<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" shape-rendering="crispEdges">
  <rect width="160" height="100" fill="#0b0f14"/>
  <!-- floor tile (isometric diamond) -->
  <g transform="translate(20,50)">
    <polygon points="0,0 32,-16 64,0 32,16" fill="#1b2331"/>
    <polygon points="0,0 32,-16 64,0 32,16" fill="none" stroke="#2a3447"/>
    <rect x="28" y="-4" width="2" height="2" fill="#2a3447"/>
    <rect x="36" y="2" width="2" height="2" fill="#2a3447"/>
    <rect x="18" y="4" width="2" height="2" fill="#2a3447"/>
    <rect x="44" y="-6" width="2" height="2" fill="#2a3447"/>
  </g>
  <!-- half cover (crate on floor) -->
  <g transform="translate(80,50)">
    <polygon points="0,0 32,-16 64,0 32,16" fill="#1b2331"/>
    <polygon points="0,0 32,-16 64,0 32,16" fill="none" stroke="#2a3447"/>
    <polygon points="14,-4 32,-12 50,-4 32,4" fill="#3c5673"/>
    <polygon points="14,-4 32,4 32,16 14,8" fill="#2e4358"/>
    <polygon points="32,4 50,-4 50,8 32,16" fill="#4a6884"/>
    <rect x="30" y="-2" width="4" height="2" fill="#5a7a96"/>
  </g>
  <!-- full cover (wall segment) -->
  <g transform="translate(120,50)">
    <polygon points="0,0 20,-10 20,22 0,32" fill="#0b0f14" stroke="#2a3447"/>
    <polygon points="20,-10 40,0 40,32 20,22" fill="#121822" stroke="#2a3447"/>
    <polygon points="0,0 20,-10 40,0 20,10" fill="#5a7498" stroke="#2a3447"/>
    <rect x="10" y="4" width="4" height="4" fill="#1a1e24"/>
    <rect x="24" y="8" width="4" height="4" fill="#1a1e24"/>
    <rect x="22" y="-2" width="2" height="4" fill="#7cc4ff"/>
  </g>
</svg>
