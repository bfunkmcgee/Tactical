    <circle cx="36" cy="26" r="2.8" fill="#c79aff"/>
    <circle cx="28" cy="26" r="1.2" fill="#fff0ff"/>
    <circle cx="36" cy="26" r="1.2" fill="#fff0ff"/>
  </g>
