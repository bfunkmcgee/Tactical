<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <defs>
    <pattern id="bpt-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0 L0 0 L0 4" fill="none" stroke="#0e3048" stroke-width="0.3"/>
    </pattern>
    <filter id="bpt-glow"><feGaussianBlur stdDeviation="0.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="160" height="100" fill="#02080e"/>
  <rect width="160" height="100" fill="url(#bpt-grid)"/>
  <g fill="none" stroke="#6bd0ff" stroke-width="1" filter="url(#bpt-glow)" stroke-linejoin="round">
    <!-- floor -->
    <g transform="translate(20,50)">
      <polygon points="0,0 32,-16 64,0 32,16"/>
      <path d="M32 -16 L32 16"/>
      <path d="M0 0 L64 0"/>
    </g>
    <!-- half cover -->
    <g transform="translate(80,50)">
      <polygon points="0,0 32,-16 64,0 32,16"/>
      <polygon points="14,-4 32,-12 50,-4 32,4"/>
      <polygon points="14,-4 32,4 32,16 14,8"/>
      <polygon points="32,4 50,-4 50,8 32,16"/>
    </g>
    <!-- full wall -->
    <g transform="translate(120,50)">
      <polygon points="0,0 20,-10 20,22 0,32"/>
      <polygon points="20,-10 40,0 40,32 20,22"/>
      <polygon points="0,0 20,-10 40,0 20,10"/>
      <path d="M10 5 L10 18"/>
      <path d="M30 10 L30 25"/>
    </g>
  </g>
  <!-- rune highlights -->
  <g filter="url(#bpt-glow)">
    <circle cx="112" cy="46" r="1.6" fill="#6bd0ff"/>
    <circle cx="142" cy="58" r="2" fill="#ff9a3c"/>
  </g>
  <g fill="#6bd0ff" font-family="ui-monospace, Menlo, monospace" font-size="5" opacity=".6">
    <text x="22" y="84">FLOOR</text>
    <text x="80" y="84">HALF</text>
    <text x="120" y="84">FULL</text>
  </g>
</svg>
