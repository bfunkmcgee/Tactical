<?xml version="1.0" encoding="UTF-8"?>
<!--
  Orin — Sapper, no-armor reference sprite.
  Appearance: medium skin, auburn bob, green eyes, utility wear (grease-
  smudged). Average build with a slightly forward-leaning "tinkerer"
  stance. 96×128 viewBox matches the rig.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <!-- Shadow. -->
  <ellipse cx="48" cy="125" rx="14" ry="2.2" fill="#000000" opacity="0.35"/>

  <!-- Legs: canvas work trousers + sturdy boots. A slight tool-bag loop
       hanging at the hip adds silhouette variety. -->
  <rect x="37" y="82" width="9" height="38" fill="#4a3828"/>
  <rect x="50" y="82" width="9" height="38" fill="#4a3828"/>
  <!-- Oil smudge on the left thigh. -->
  <ellipse cx="41" cy="100" rx="2.5" ry="1.5" fill="#1a0f08" opacity="0.7"/>
  <!-- Boots. -->
  <rect x="35" y="118" width="13" height="6" fill="#1a1008"/>
  <rect x="48" y="118" width="13" height="6" fill="#1a1008"/>
  <!-- Tool belt with pouches + hammer loop. -->
  <rect x="35" y="80" width="26" height="4" fill="#5a4028" stroke="#1a1008" stroke-width="0.3"/>
  <rect x="46" y="80" width="4" height="4" fill="#c4a468"/>
  <!-- Small pouch hanging at the right hip. -->
  <rect x="58" y="84" width="5" height="7" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.3"/>

  <!-- Torso: worn canvas utility vest over an olive undershirt. -->
  <path d="M 34 50 L 62 50 L 64 82 L 32 82 Z" fill="#6a5a44"/>
  <!-- Vest halves (open-front with dark edges). -->
  <path d="M 32 52 L 42 50 L 42 82 L 32 82 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.4"/>
  <path d="M 54 50 L 64 52 L 64 82 L 54 82 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.4"/>
  <!-- Pocket hints on the vest. -->
  <rect x="34" y="64" width="6" height="7" fill="#5a4030"/>
  <rect x="56" y="64" width="6" height="7" fill="#5a4030"/>
  <!-- Grease smudge on the chest. -->
  <path d="M 46 68 Q 48 72 50 68" fill="none" stroke="#1a0f08" stroke-width="0.8" opacity="0.8"/>

  <!-- Arms: rolled-up olive sleeves, medium-skin forearms + hands. -->
  <path d="M 28 52 L 34 52 L 36 72 L 30 74 Z" fill="#6a5a44"/>
  <path d="M 62 52 L 68 52 L 66 74 L 60 72 Z" fill="#6a5a44"/>
  <!-- Cuff hint where sleeve rolls up. -->
  <rect x="28" y="70" width="8" height="1.2" fill="#3a2a1c"/>
  <rect x="60" y="70" width="8" height="1.2" fill="#3a2a1c"/>
  <!-- Forearms — exposed medium-tone skin (0xc48a6a). -->
  <path d="M 30 72 L 36 72 L 36 80 L 30 80 Z" fill="#c48a6a"/>
  <path d="M 60 72 L 66 72 L 66 80 L 60 80 Z" fill="#c48a6a"/>
  <ellipse cx="33" cy="82" rx="3" ry="3.2" fill="#c48a6a"/>
  <ellipse cx="63" cy="82" rx="3" ry="3.2" fill="#c48a6a"/>

  <!-- Neck + head. Medium skin. -->
  <rect x="44" y="40" width="8" height="10" fill="#c48a6a"/>
  <ellipse cx="48" cy="28" rx="10" ry="12" fill="#c48a6a" stroke="#6a4030" stroke-width="0.4"/>

  <!-- Hair: auburn bob (0x7a3a20). Frames jaw, longer than short-crop. -->
  <path d="M 36 22 Q 48 12 60 22 L 60 36 L 54 36 L 54 28 Q 48 26 42 28 L 42 36 L 36 36 Z" fill="#7a3a20"/>
  <!-- Slight fringe / bangs. -->
  <path d="M 38 22 Q 48 18 58 22 L 58 26 Q 48 23 38 26 Z" fill="#6a2810"/>

  <!-- Green eyes (0x3a5a3a). -->
  <ellipse cx="44" cy="28" rx="1.7" ry="1.1" fill="#ffffff"/>
  <circle cx="44" cy="28" r="0.9" fill="#3a5a3a"/>
  <ellipse cx="52" cy="28" rx="1.7" ry="1.1" fill="#ffffff"/>
  <circle cx="52" cy="28" r="0.9" fill="#3a5a3a"/>

  <!-- Slight smirk — Orin's a tinkerer with personality. -->
  <path d="M 45 33 Q 48 35 51 33" fill="none" stroke="#4a2818" stroke-width="0.7" stroke-linecap="round"/>
  <!-- Nose hint. -->
  <line x1="48" y1="30" x2="48" y2="33" stroke="#6a4030" stroke-width="0.4" opacity="0.6"/>
  <!-- Small grease smudge on the cheek. -->
  <ellipse cx="54" cy="34" rx="1.5" ry="0.6" fill="#1a0f08" opacity="0.7"/>
</svg>
