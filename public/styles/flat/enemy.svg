<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="w-cloak-outer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3866"/><stop offset="1" stop-color="#1a0e2a"/>
    </linearGradient>
    <linearGradient id="w-cloak-inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a1f3a"/><stop offset="1" stop-color="#0a0515"/>
    </linearGradient>
    <radialGradient id="w-eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset=".4" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#3a1a55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w-blade" cx=".5" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset=".7" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#7a3fb8"/>
    </radialGradient>
    <radialGradient id="w-sigil" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset="1" stop-color="#c79aff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="50" rx="34" ry="36" fill="#3a1a55" opacity=".15"/>
  <ellipse cx="48" cy="120" rx="26" ry="4" fill="#000" opacity=".5"/>
  <!-- swirling mist base -->
  <ellipse cx="48" cy="116" rx="30" ry="4" fill="#2a1f3a" opacity=".6"/>
  <ellipse cx="42" cy="114" rx="10" ry="2" fill="#4a3866" opacity=".4"/>
  <ellipse cx="56" cy="118" rx="8" ry="2" fill="#4a3866" opacity=".4"/>

  <!-- OUTER CLOAK -->
  <path d="M22 28 Q22 12 48 10 Q74 12 74 28 L80 72 Q80 118 48 118 Q16 118 16 72 Z" fill="url(#w-cloak-outer)"/>
  <!-- cloak folds -->
  <path d="M22 28 Q24 60 26 108" fill="none" stroke="#2a1f3a" stroke-width="1.5"/>
  <path d="M74 28 Q72 60 70 108" fill="none" stroke="#2a1f3a" stroke-width="1.5"/>
  <path d="M48 30 Q46 70 44 116" fill="none" stroke="#2a1f3a" stroke-width="1"/>
  <path d="M48 30 Q50 70 52 116" fill="none" stroke="#2a1f3a" stroke-width="1"/>

  <!-- tattered hem -->
  <path d="M16 104 L20 118 L26 106 L30 118 L36 106 L42 118 L48 106 L54 118 L60 106 L66 118 L70 106 L76 118 L80 104 L80 118 L16 118 Z" fill="#1b2331"/>

  <!-- INNER ROBE -->
  <path d="M30 40 Q30 24 48 22 Q66 24 66 40 L70 76 Q70 108 48 108 Q26 108 26 76 Z" fill="url(#w-cloak-inner)"/>

  <!-- chest belt sash with sigil -->
  <path d="M30 58 L66 70 L66 76 L30 64 Z" fill="#3a2a52"/>
  <circle cx="48" cy="68" r="4" fill="#1a0e2a"/>
  <path d="M45 68 L51 68 M48 65 L48 71" stroke="#c79aff" stroke-width="1"/>
  <circle cx="48" cy="68" r="1.2" fill="#fff0ff"/>

  <!-- hood shadow -->
  <ellipse cx="48" cy="34" rx="17" ry="18" fill="#0a0515"/>
  <!-- bone mask under hood -->
  <path d="M38 30 Q38 22 48 20 Q58 22 58 30 L58 42 Q48 48 38 42 Z" fill="#d8cab0"/>
  <!-- mask cracks -->
  <path d="M44 26 L42 38 M52 26 L54 38 M48 30 L46 44 L50 44 L48 30 Z" stroke="#7a6a50" stroke-width="0.5" fill="#9a8a70" opacity=".6"/>
  <!-- mask eye sockets -->
  <ellipse cx="43" cy="32" rx="3" ry="3.2" fill="#0a0515"/>
  <ellipse cx="53" cy="32" rx="3" ry="3.2" fill="#0a0515"/>
  <!-- glowing eyes inside sockets -->
  <circle cx="43" cy="32" r="2" fill="url(#w-eye)"/>
  <circle cx="53" cy="32" r="2" fill="url(#w-eye)"/>
  <circle cx="43" cy="32" r="0.9" fill="#fff0ff"/>
  <circle cx="53" cy="32" r="0.9" fill="#fff0ff"/>
  <!-- mask nose slit -->
  <path d="M48 35 L46 40 L50 40 Z" fill="#0a0515"/>
  <!-- teeth / jaw -->
  <path d="M40 42 L44 46 L48 43 L52 46 L56 42" fill="none" stroke="#0a0515" stroke-width="0.6"/>

  <!-- chain cinch around hood -->
  <path d="M28 44 Q48 54 68 44" fill="none" stroke="#7a6a50" stroke-width="1"/>
  <circle cx="30" cy="45" r="1" fill="#7a6a50"/>
  <circle cx="48" cy="52" r="1.4" fill="#c79aff"/>
  <circle cx="66" cy="45" r="1" fill="#7a6a50"/>

  <!-- ARM + CLAWS right -->
  <path d="M70 72 Q76 78 80 88 Q82 94 78 96 L70 90 Z" fill="url(#w-cloak-outer)"/>
  <!-- bone hand -->
  <path d="M78 92 L84 94 L84 100 L78 98 Z" fill="#d8cab0"/>
  <path d="M84 94 L88 98 M84 96 L90 100 M84 98 L88 102" stroke="#d8cab0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- LEFT ARM holding staff/blade -->
  <path d="M26 72 Q20 78 18 90 Q18 96 22 96 L26 88 Z" fill="url(#w-cloak-outer)"/>
  <!-- bone hand gripping haft -->
  <path d="M18 92 L14 94 L14 100 L18 98 Z" fill="#d8cab0"/>

  <!-- SPECTRAL STAFF / BLADE -->
  <rect x="14" y="14" width="2" height="80" fill="#3a2a52"/>
  <path d="M14 14 L15 8 L16 14 Z" fill="#1a0e2a"/>
  <!-- blade head -->
  <path d="M10 8 Q15 -2 20 8 Q18 14 15 18 Q12 14 10 8 Z" fill="url(#w-blade)"/>
  <path d="M10 8 Q15 0 20 8" fill="none" stroke="#fff0ff" stroke-width="0.5" opacity=".8"/>
  <!-- crystal embedded -->
  <path d="M15 4 L17 8 L15 12 L13 8 Z" fill="#fff0ff" opacity=".8"/>
  <!-- rune rings on haft -->
  <rect x="13" y="26" width="4" height="2" fill="#c79aff"/>
  <rect x="13" y="46" width="4" height="2" fill="#c79aff"/>
  <rect x="13" y="66" width="4" height="2" fill="#c79aff"/>

  <!-- floating sigils -->
  <g opacity=".8">
    <circle cx="76" cy="42" r="3" fill="url(#w-sigil)"/>
    <path d="M74 42 L78 42 M76 40 L76 44" stroke="#c79aff" stroke-width="0.5"/>
    <circle cx="22" cy="54" r="2.5" fill="url(#w-sigil)"/>
    <path d="M20 54 L24 54 M22 52 L22 56" stroke="#c79aff" stroke-width="0.5"/>
  </g>
</svg>
