  <path d="M18 42 Q16 43 16 46 L18 66 Q18 70 22 70 L26 68 L26 40 Z" fill="url(#r-sand)"/>
  <path d="M78 42 Q80 43 80 46 L78 66 Q78 70 74 70 L70 68 L70 40 Z" fill="url(#r-sand)"/>
  <!-- bicep bands (darker) -->
