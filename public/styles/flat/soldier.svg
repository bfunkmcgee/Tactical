<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="r-cloak" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a98560"/><stop offset="1" stop-color="#4a3420"/>
    </linearGradient>
    <linearGradient id="r-cloak-inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3420"/><stop offset="1" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="r-sand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d4b07c"/><stop offset="1" stop-color="#8a6a40"/>
    </linearGradient>
    <linearGradient id="r-sand-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9c7a4c"/><stop offset="1" stop-color="#5a3f22"/>
    </linearGradient>
    <linearGradient id="r-helmet" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b08a58"/><stop offset="1" stop-color="#5a3f22"/>
    </linearGradient>
    <linearGradient id="r-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dfae89"/><stop offset="1" stop-color="#a87a56"/>
    </linearGradient>
    <linearGradient id="r-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a382a"/><stop offset="1" stop-color="#1a0e06"/>
    </linearGradient>
    <radialGradient id="r-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="118" rx="26" ry="4" fill="#000" opacity=".45"/>

