  <rect x="70" y="50" width="10" height="3" fill="#3a2414"/>
  <!-- forearm wraps -->
  <path d="M16 58 L26 58 M16 62 L26 62" stroke="#8a6a40" stroke-width="0.6"/>
  <path d="M70 58 L80 58 M70 62 L80 62" stroke="#8a6a40" stroke-width="0.6"/>
  <!-- gloves (dark leather) -->
  <path d="M14 64 Q12 66 14 70 L22 72 Q24 70 22 66 Z" fill="#2a1c10"/>
  <path d="M82 64 Q84 66 82 70 L74 72 Q72 70 74 66 Z" fill="#2a1c10"/>
  <path d="M15 66 L21 70 M15 68 L21 70" stroke="#5a3f22" stroke-width="0.5"/>
  <path d="M81 66 L75 70 M81 68 L75 70" stroke="#5a3f22" stroke-width="0.5"/>

  <!-- RIFLE: Runeweave Carbine -->
  <path d="M8 62 L18 62 L18 70 L8 72 Z" fill="url(#r-gun)"/>
