  <rect x="46" y="5" width="4" height="3" rx="0.5" fill="#3a2414"/>
  <circle cx="48" cy="6.5" r="1" fill="#7cc4ff"/>
  <!-- chin strap hidden behind scarf -->

  <!-- HOOD (pulled partially back behind head) -->
  <path d="M28 14 Q24 26 26 38 L32 32 L32 16 Q30 12 28 14 Z" fill="url(#r-cloak)"/>
  <path d="M68 14 Q72 26 70 38 L64 32 L64 16 Q66 12 68 14 Z" fill="url(#r-cloak)"/>
  <path d="M26 26 Q24 32 26 36" fill="none" stroke="#4a3420" stroke-width="0.8"/>
  <path d="M70 26 Q72 32 70 36" fill="none" stroke="#4a3420" stroke-width="0.8"/>

