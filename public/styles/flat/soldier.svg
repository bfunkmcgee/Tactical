  <path d="M37 94 Q42 92 46 94 L46 100 Q42 102 37 100 Z" fill="#3a2414"/>
  <path d="M59 94 Q54 92 50 94 L50 100 Q54 102 59 100 Z" fill="#3a2414"/>
