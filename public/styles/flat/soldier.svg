  <path d="M36 30 Q48 34 60 30 L62 80 Q48 86 34 80 Z" fill="url(#r-cloak-inner)" opacity=".6"/>
  <!-- tattered hem on back cloak -->
  <path d="M8 110 L14 118 L20 110 L26 118 L32 110 L32 118 L8 118 Z" fill="#1b2331"/>
  <path d="M64 110 L70 118 L76 110 L82 118 L88 110 L88 118 L64 118 Z" fill="#1b2331"/>
  <!-- cloak folds -->
  <path d="M18 40 Q18 80 22 116" fill="none" stroke="#4a3420" stroke-width="1.2"/>
  <path d="M28 40 Q26 80 28 116" fill="none" stroke="#4a3420" stroke-width="1"/>
  <path d="M78 40 Q78 80 74 116" fill="none" stroke="#4a3420" stroke-width="1.2"/>
  <path d="M68 40 Q70 80 68 116" fill="none" stroke="#4a3420" stroke-width="1"/>

