<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="bone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0ead8"/><stop offset="1" stop-color="#8a7e66"/>
    </linearGradient>
    <linearGradient id="bone-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8ad95"/><stop offset="1" stop-color="#4a3e28"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d4c8b0"/><stop offset="1" stop-color="#3a3020"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8dfc4"/><stop offset="1" stop-color="#7a6e52"/>
    </linearGradient>
    <linearGradient id="undersuit" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a251e"/><stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a322a"/><stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="rune-blue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="118" rx="24" ry="4" fill="#000" opacity=".55"/>

  <!-- TATTERED CLOAK / mantle flowing behind -->
  <path d="M14 36 Q10 56 8 92 Q10 118 18 118 L28 118 L32 80 L32 34 Q22 30 18 32 Q14 34 14 36 Z" fill="url(#fur)"/>
  <path d="M82 36 Q86 56 88 92 Q86 118 78 118 L68 118 L64 80 L64 34 Q74 30 78 32 Q82 34 82 36 Z" fill="url(#fur)"/>
  <!-- cloak center back panel -->
  <path d="M32 40 L64 40 L66 114 L30 114 Z" fill="url(#bone-dark)" opacity=".5"/>
  <!-- cloak tattered hem -->
  <path d="M8 108 L12 118 L16 110 L20 118 L24 110 L28 118 L32 110 L32 118 L8 118 Z" fill="#1b2331"/>
  <path d="M64 110 L64 118 L68 110 L72 118 L76 110 L80 118 L84 110 L88 108 L88 118 Z" fill="#1b2331"/>
  <!-- cloak weathering lines -->
  <path d="M16 44 Q14 80 12 110" fill="none" stroke="#2a2414" stroke-width="0.8"/>
  <path d="M80 44 Q82 80 84 110" fill="none" stroke="#2a2414" stroke-width="0.8"/>

  <!-- LEGS: dark undersuit + bone thigh plates -->
  <path d="M38 78 Q37 108 40 112 L46 112 L47 78 Z" fill="url(#undersuit)"/>
  <path d="M58 78 Q59 108 56 112 L50 112 L49 78 Z" fill="url(#undersuit)"/>
  <!-- bone thigh plates with carved pattern -->
  <path d="M37 78 L47 78 L47 92 L37 92 Z" fill="url(#bone)"/>
  <path d="M59 78 L49 78 L49 92 L59 92 Z" fill="url(#bone)"/>
  <path d="M40 82 L44 82 M40 86 L44 86" stroke="#8a7e66" stroke-width="0.4"/>
  <path d="M52 82 L56 82 M52 86 L56 86" stroke="#8a7e66" stroke-width="0.4"/>
  <!-- engraved filigree on thigh plate -->
  <path d="M42 84 Q42 88 40 90" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <path d="M54 84 Q54 88 56 90" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <!-- bone kneepads -->
  <path d="M37 94 Q42 92 46 94 L46 102 Q42 104 37 102 Z" fill="url(#bone)"/>
  <path d="M59 94 Q54 92 50 94 L50 102 Q54 104 59 102 Z" fill="url(#bone)"/>
  <path d="M40 96 L44 96 M40 100 L44 100" stroke="#6a5a40" stroke-width="0.3"/>
  <path d="M52 96 L56 96 M52 100 L56 100" stroke="#6a5a40" stroke-width="0.3"/>
  <!-- shin greaves -->
  <path d="M38 102 L46 102 L45 110 L39 110 Z" fill="url(#bone)"/>
  <path d="M58 102 L50 102 L51 110 L57 110 Z" fill="url(#bone)"/>
  <!-- grime on shins -->
  <path d="M40 106 L44 108" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M52 106 L56 108" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- tactical boots -->
  <path d="M36 108 Q36 114 40 114 L47 114 L47 108 Z" fill="#0a0806"/>
  <path d="M60 108 Q60 114 56 114 L49 114 L49 108 Z" fill="#0a0806"/>
  <path d="M38 110 L45 110 M38 112 L45 112" stroke="#2a2218" stroke-width="0.5"/>
  <path d="M51 110 L58 110 M51 112 L58 112" stroke="#2a2218" stroke-width="0.5"/>

  <!-- BELT + holster -->
  <path d="M28 74 L68 74 L68 80 L28 80 Z" fill="#1a1410"/>
  <rect x="45" y="74" width="6" height="6" fill="url(#bone-dark)"/>
  <rect x="46.5" y="75.5" width="3" height="3" fill="#7cc4ff"/>
  <!-- leg holster -->
  <path d="M58 80 L66 80 L66 96 L58 96 Z" fill="#1a1410"/>
  <path d="M60 82 L64 82 L64 92 L60 92 Z" fill="#2a2218"/>
  <path d="M61 84 L63 84 L63 90 L61 90 Z" fill="#0a0806"/>

  <!-- TORSO: bone chest plate over dark undersuit -->
  <!-- dark undersuit visible at edges and joints -->
  <path d="M22 38 Q22 34 26 34 L70 34 Q74 34 74 38 L74 74 Q74 78 70 78 L26 78 Q22 78 22 74 Z" fill="url(#undersuit)"/>
  <!-- main bone chest plate (layered scallop design) -->
  <path d="M26 40 L70 40 Q72 40 72 42 L72 58 L48 64 L24 58 L24 42 Q24 40 26 40 Z" fill="url(#bone)"/>
  <!-- second plate layer (belly) -->
  <path d="M30 58 L66 58 L66 74 L48 78 L30 74 Z" fill="url(#bone)"/>
  <!-- plate separation shadow -->
  <path d="M24 58 L72 58" stroke="#6a5a40" stroke-width="0.8"/>
  <!-- engraved ornamental crown sigil centered on chest (inspired by reference) -->
  <path d="M42 48 L46 44 L48 46 L50 44 L54 48 L52 54 L44 54 Z" fill="none" stroke="#5a4a30" stroke-width="0.7"/>
  <path d="M46 46 L46 50 M50 46 L50 50 M48 44 L48 52" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M44 54 Q48 56 52 54" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- secondary filigree on belly plate -->
  <path d="M36 62 Q48 64 60 62" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M40 66 Q48 68 56 66" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M42 70 Q48 72 54 70" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- rivets along plate edges -->
  <circle cx="28" cy="44" r="0.8" fill="#6a5a40"/>
  <circle cx="68" cy="44" r="0.8" fill="#6a5a40"/>
  <circle cx="28" cy="56" r="0.8" fill="#6a5a40"/>
  <circle cx="68" cy="56" r="0.8" fill="#6a5a40"/>
  <circle cx="32" cy="72" r="0.8" fill="#6a5a40"/>
  <circle cx="64" cy="72" r="0.8" fill="#6a5a40"/>
  <!-- weathering streaks on chest -->
  <path d="M30 52 L34 56" stroke="#6a5a40" stroke-width="0.3" opacity=".7"/>
  <path d="M58 50 L62 54" stroke="#6a5a40" stroke-width="0.3" opacity=".7"/>
  <path d="M36 66 L40 70" stroke="#4a3e28" stroke-width="0.3" opacity=".6"/>
  <!-- runic-blue class sigil (small, embedded in crown) -->
  <circle cx="48" cy="50" r="1.2" fill="#7cc4ff"/>
  <circle cx="48" cy="50" r="0.5" fill="#eaf6ff"/>

  <!-- tactical pouches (dark, contrast against bone) -->
  <rect x="25" y="60" width="5" height="10" rx="1" fill="#1a1410"/>
  <rect x="66" y="60" width="5" height="10" rx="1" fill="#1a1410"/>
  <path d="M26 62 L29 62 M26 65 L29 65 M26 68 L29 68" stroke="#3a3228" stroke-width="0.4"/>
  <path d="M67 62 L70 62 M67 65 L70 65 M67 68 L70 68" stroke="#3a3228" stroke-width="0.4"/>

  <!-- PAULDRONS: layered bone with carved edge -->
  <path d="M16 34 Q14 46 20 50 L28 46 L28 36 Q22 32 18 32 Q16 32 16 34 Z" fill="url(#bone)"/>
  <path d="M80 34 Q82 46 76 50 L68 46 L68 36 Q74 32 78 32 Q80 32 80 34 Z" fill="url(#bone)"/>
  <!-- pauldron scallop layers -->
  <path d="M16 42 Q22 46 28 42" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <path d="M80 42 Q74 46 68 42" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <!-- engraved sigil on pauldron (squad sigil in runic blue) -->
  <circle cx="22" cy="40" r="1.6" fill="#3a3020"/>
  <path d="M22 38.5 L23.5 40 L22 41.5 L20.5 40 Z" fill="#7cc4ff"/>
  <circle cx="74" cy="40" r="1.6" fill="#3a3020"/>
  <path d="M74 38.5 L75.5 40 L74 41.5 L72.5 40 Z" fill="#7cc4ff"/>

  <!-- FUR MANTLE / shaggy collar around shoulders -->
  <path d="M14 30 Q16 36 22 38 L34 36 Q40 34 48 34 Q56 34 62 36 L74 38 Q80 36 82 30
           Q80 26 70 26 Q60 28 48 28 Q36 28 26 26 Q16 26 14 30 Z" fill="url(#fur)"/>
  <!-- shaggy fur tufts (zigzag edge) -->
  <path d="M14 30 L16 34 L18 30 L20 34 L22 30 L24 34 L26 30 L28 34 L30 30 L32 34 L34 30
           L36 34 L38 30 L40 34 L42 30 L44 34 L46 30 L48 34 L50 30 L52 34 L54 30 L56 34
           L58 30 L60 34 L62 30 L64 34 L66 30 L68 34 L70 30 L72 34 L74 30 L76 34 L78 30 L80 34 L82 30"
        fill="none" stroke="#2a2414" stroke-width="0.6"/>
  <!-- inner fur shadow -->
  <path d="M20 34 Q48 38 76 34" fill="none" stroke="#4a3e28" stroke-width="1"/>

  <!-- SCARF / shemagh bunched below mask -->
  <path d="M34 36 Q48 44 62 36 L62 44 Q48 50 34 44 Z" fill="url(#scarf)"/>
  <path d="M34 36 Q36 40 38 42 L32 40 Z" fill="url(#scarf)"/>
  <path d="M62 36 Q60 40 58 42 L64 40 Z" fill="url(#scarf)"/>
  <!-- scarf folds -->
  <path d="M36 40 Q48 44 60 40" fill="none" stroke="#7a6e52" stroke-width="0.4"/>
  <path d="M38 42 Q48 46 58 42" fill="none" stroke="#7a6e52" stroke-width="0.4"/>

  <!-- HEAD + FULL BONE MASK -->
  <!-- mask back/skull shape -->
  <ellipse cx="48" cy="22" rx="14" ry="16" fill="url(#bone)"/>
  <!-- ridged brow crest -->
  <path d="M34 14 Q48 6 62 14 L60 18 Q48 12 36 18 Z" fill="url(#bone-dark)"/>
  <path d="M36 16 Q48 12 60 16" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <!-- crest ridge down center forehead -->
  <path d="M48 6 L50 14 L48 18 L46 14 Z" fill="url(#bone-dark)"/>
  <!-- temple filigree (engraved) -->
  <path d="M36 18 Q34 22 36 26 L38 24 L38 20 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M60 18 Q62 22 60 26 L58 24 L58 20 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- side rails / sensor mounts -->
  <rect x="32" y="18" width="2" height="8" fill="#1a1410"/>
  <rect x="62" y="18" width="2" height="8" fill="#1a1410"/>
  <circle cx="33" cy="20" r="0.8" fill="#7cc4ff"/>
  <!-- GOGGLE VISOR (wide horizontal slit with dark lens) -->
  <path d="M36 20 L60 20 L60 26 L36 26 Z" fill="#0a0806"/>
  <path d="M36 20 L60 20" stroke="#3a3228" stroke-width="0.8"/>
  <!-- lens reflection -->
  <path d="M38 22 L44 22" stroke="#2a4060" stroke-width="0.8" opacity=".7"/>
  <path d="M52 22 L58 22" stroke="#2a4060" stroke-width="0.6" opacity=".7"/>
  <!-- bridge between goggles -->
  <rect x="46" y="21" width="4" height="4" fill="url(#bone-dark)"/>
  <!-- mask cheek engraving -->
  <path d="M36 28 Q42 32 48 30" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M60 28 Q54 32 48 30" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- mask mouth: vent/respirator slits -->
  <path d="M42 30 L54 30 L53 34 L43 34 Z" fill="#1a1410"/>
  <rect x="43" y="31" width="10" height="0.5" fill="#3a3228"/>
  <rect x="43" y="32.5" width="10" height="0.5" fill="#3a3228"/>
  <!-- mask chin point -->
  <path d="M43 34 L48 38 L53 34 Z" fill="url(#bone-dark)"/>
  <path d="M46 35 L48 37 L50 35" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- engraved scout emblem on forehead (small crown motif) -->
  <path d="M46 10 L48 8 L50 10 L49 12 L47 12 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- NVG / rangefinder mount on top -->
  <rect x="44" y="4" width="8" height="2" rx="0.5" fill="#1a1410"/>
  <rect x="46" y="2" width="4" height="3" rx="0.5" fill="#1a1410"/>
  <circle cx="48" cy="3.5" r="0.8" fill="#7cc4ff"/>
  <!-- mask weathering streaks -->
  <path d="M38 24 L36 28" stroke="#6a5a40" stroke-width="0.3" opacity=".6"/>
  <path d="M58 24 L60 28" stroke="#6a5a40" stroke-width="0.3" opacity=".6"/>

  <!-- ARMS: dark undersuit + bone pauldron continues + forearm bracer -->
  <path d="M18 44 Q16 46 16 48 L18 68 Q18 72 22 72 L26 70 L26 42 Z" fill="url(#undersuit)"/>
  <path d="M78 44 Q80 46 80 48 L78 68 Q78 72 74 72 L70 70 L70 42 Z" fill="url(#undersuit)"/>
  <!-- upper arm armor band -->
  <path d="M16 50 L26 50 L26 56 L16 56 Z" fill="url(#bone)"/>
  <path d="M80 50 L70 50 L70 56 L80 56 Z" fill="url(#bone)"/>
  <!-- forearm bracer -->
  <path d="M16 62 L26 62 L26 70 L16 70 Z" fill="url(#bone)"/>
  <path d="M80 62 L70 62 L70 70 L80 70 Z" fill="url(#bone)"/>
  <path d="M18 64 L24 64 M18 67 L24 67" stroke="#6a5a40" stroke-width="0.4"/>
  <path d="M72 64 L78 64 M72 67 L78 67" stroke="#6a5a40" stroke-width="0.4"/>
  <!-- tactical gloves (dark, mesh knuckles) -->
  <path d="M14 70 Q12 74 16 78 L22 78 Q24 74 22 70 Z" fill="#0a0806"/>
  <path d="M82 70 Q84 74 80 78 L74 78 Q72 74 74 70 Z" fill="#0a0806"/>
  <path d="M15 72 L21 74 M15 74 L21 76" stroke="#2a2218" stroke-width="0.5"/>
  <path d="M81 72 L75 74 M81 74 L75 76" stroke="#2a2218" stroke-width="0.5"/>
  <circle cx="16" cy="74" r="0.7" fill="#2a2218"/>
  <circle cx="20" cy="76" r="0.7" fill="#2a2218"/>
  <circle cx="80" cy="74" r="0.7" fill="#2a2218"/>
  <circle cx="76" cy="76" r="0.7" fill="#2a2218"/>

  <!-- RUNEWEAVE CARBINE (dark tactical modern) -->
  <!-- stock -->
  <path d="M4 62 L16 62 L16 70 L4 72 Z" fill="url(#gun)"/>
  <path d="M6 64 L14 64 M6 68 L14 68" stroke="#0a0806" stroke-width="0.4"/>
  <!-- receiver -->
  <path d="M16 62 L60 62 L60 70 L16 70 Z" fill="url(#gun)"/>
  <!-- picatinny rail -->
  <rect x="20" y="60" width="38" height="2" fill="#0a0806"/>
  <path d="M22 60 L22 62 M26 60 L26 62 M30 60 L30 62 M34 60 L34 62 M38 60 L38 62 M42 60 L42 62 M46 60 L46 62 M50 60 L50 62 M54 60 L54 62" stroke="#1a1410" stroke-width="0.4"/>
  <!-- scope / optic -->
  <rect x="28" y="54" width="14" height="6" rx="1" fill="#141210"/>
  <circle cx="35" cy="57" r="2.2" fill="#0a0806"/>
  <circle cx="35" cy="57" r="1.4" fill="#7cc4ff"/>
  <circle cx="35" cy="57" r="0.5" fill="#eaf6ff"/>
  <!-- top accessory (laser/rangefinder) -->
  <rect x="44" y="56" width="6" height="3" rx="0.5" fill="#141210"/>
  <circle cx="47" cy="57.5" r="0.5" fill="#7cc4ff"/>
  <!-- magazine -->
  <path d="M30 70 L40 70 L39 82 L31 82 Z" fill="#141210"/>
  <path d="M31 72 L39 72 M31 75 L39 75" stroke="#2a2218" stroke-width="0.4"/>
  <!-- trigger guard -->
  <path d="M40 70 Q44 74 48 70" fill="none" stroke="#0a0806" stroke-width="1.4"/>
  <!-- foregrip / vertical grip -->
  <path d="M48 70 L52 70 L52 78 L48 78 Z" fill="#141210"/>
  <path d="M49 72 L51 72 M49 75 L51 75" stroke="#2a2218" stroke-width="0.3"/>
  <!-- barrel with suppressor -->
  <rect x="60" y="64" width="12" height="4" fill="url(#gun)"/>
  <!-- suppressor -->
  <rect x="72" y="63" width="14" height="6" rx="1" fill="#141210"/>
  <path d="M74 64 L84 64 M74 66 L84 66 M74 68 L84 68" stroke="#0a0806" stroke-width="0.3"/>
  <!-- muzzle rune core -->
  <circle cx="86" cy="66" r="4" fill="url(#rune-blue)"/>
  <circle cx="86" cy="66" r="1.6" fill="#eaf6ff"/>
</svg>
