<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="t-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a6a50"/><stop offset="1" stop-color="#2a2418"/>
    </linearGradient>
    <linearGradient id="t-skin-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a4a38"/><stop offset="1" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="t-rust" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a5028"/><stop offset="1" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="t-rust-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c87030"/><stop offset="1" stop-color="#4a2410"/>
    </linearGradient>
    <linearGradient id="t-metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="t-rag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a5838"/><stop offset="1" stop-color="#2a2010"/>
    </linearGradient>
    <radialGradient id="t-eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset=".5" stop-color="#c82810"/>
      <stop offset="1" stop-color="#3a0808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- SCRAP HEAVY MACHINE GUN (huge, two-handed) -->
  <!-- stock -->
  <path d="M0 56 L14 56 L14 70 L0 72 Z" fill="#4a2810"/>
  <rect x="-2" y="56" width="4" height="16" fill="url(#t-rust)"/>
  <!-- receiver (massive) -->
  <path d="M14 54 L50 54 L50 72 L14 72 Z" fill="url(#t-rust)"/>
  <!-- heat sinks on top -->
  <rect x="18" y="50" width="28" height="4" fill="#2a1408"/>
  <path d="M20 50 L20 54 M24 50 L24 54 M28 50 L28 54 M32 50 L32 54 M36 50 L36 54 M40 50 L40 54 M44 50 L44 54" stroke="#c87030" stroke-width="0.4"/>
  <!-- welded plate patches -->
  <rect x="22" y="58" width="8" height="8" fill="url(#t-metal)"/>
  <rect x="34" y="58" width="12" height="6" fill="url(#t-rust-hl)"/>
  <circle cx="24" cy="60" r="0.8" fill="#c87030"/>
  <circle cx="28" cy="60" r="0.8" fill="#c87030"/>
  <circle cx="24" cy="64" r="0.8" fill="#c87030"/>
  <circle cx="28" cy="64" r="0.8" fill="#c87030"/>
  <circle cx="38" cy="60" r="0.7" fill="#4a4a4e"/>
  <circle cx="42" cy="60" r="0.7" fill="#4a4a4e"/>
  <!-- ammo belt feeding into receiver (iconic machine gun detail) -->
  <path d="M50 68 L60 78 L58 82" stroke="#2a2010" stroke-width="2" fill="none"/>
  <rect x="52" y="70" width="2" height="4" fill="#8a6030"/>
  <rect x="55" y="73" width="2" height="4" fill="#8a6030"/>
  <rect x="58" y="76" width="2" height="4" fill="#8a6030"/>
  <!-- big trigger + grip -->
  <path d="M50 72 Q54 76 58 72" fill="none" stroke="#0a0a0c" stroke-width="1.6"/>
  <path d="M54 72 L62 72 L62 84 L58 86 Z" fill="#4a2810"/>
  <!-- bipod -->
  <path d="M62 72 L58 84 M62 72 L66 84" fill="none" stroke="#0a0a0c" stroke-width="1"/>
  <!-- belt feed box below receiver -->
  <path d="M36 72 L50 72 L50 84 L36 84 Z" fill="url(#t-rust)"/>
  <rect x="38" y="74" width="10" height="8" fill="#0a0a0c"/>
  <!-- HUGE barrel + heat shroud -->
  <rect x="62" y="56" width="24" height="10" fill="url(#t-metal)"/>
  <path d="M64 58 L64 64 M68 58 L68 64 M72 58 L72 64 M76 58 L76 64 M80 58 L80 64 M84 58 L84 64" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- scrap flash suppressor / muzzle -->
  <path d="M86 52 L92 54 L92 68 L86 70 Z" fill="#2a1408"/>
  <path d="M88 56 L90 56 M88 60 L90 60 M88 64 L90 64" stroke="#c87030" stroke-width="0.5"/>
  <!-- muzzle flash -->
  <circle cx="94" cy="61" r="4" fill="url(#t-eye)" opacity=".8"/>
  <circle cx="94" cy="61" r="1.8" fill="#fff4c0"/>
</svg>