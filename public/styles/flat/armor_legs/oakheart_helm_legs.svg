<?xml version="1.0" encoding="UTF-8"?>
<!-- oakheart_helm (Orin) legs overlay: work-armored trousers w/
     kevlar-and-heartwood inserts. Sapper aesthetic — reinforced but
     still has pouches + tool loops visible. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <!-- Reinforced work trouser legs. -->
  <rect x="36" y="82" width="11" height="38" fill="#2a2418"/>
  <rect x="49" y="82" width="11" height="38" fill="#2a2418"/>
  <!-- Kevlar thigh patches w/ heartwood stitching. -->
  <rect x="37" y="88" width="9" height="14" fill="#3a3428" stroke="#5a4028" stroke-width="0.3"/>
  <rect x="50" y="88" width="9" height="14" fill="#3a3428" stroke="#5a4028" stroke-width="0.3"/>
  <!-- Heartwood stitching lines. -->
  <line x1="37" y1="95" x2="46" y2="95" stroke="#5a4028" stroke-width="0.4"/>
  <line x1="50" y1="95" x2="59" y2="95" stroke="#5a4028" stroke-width="0.4"/>
  <!-- Tool pouch on right thigh. -->
  <rect x="52" y="102" width="6" height="6" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.3"/>
  <!-- Reinforced knee caps. -->
  <rect x="36" y="108" width="11" height="4" fill="#4a4030" stroke="#1a1008" stroke-width="0.3"/>
  <rect x="49" y="108" width="11" height="4" fill="#4a4030" stroke="#1a1008" stroke-width="0.3"/>
  <!-- Heavy work boots. -->
  <rect x="34" y="118" width="14" height="6" fill="#0a0a0c"/>
  <rect x="48" y="118" width="14" height="6" fill="#0a0a0c"/>
</svg>
