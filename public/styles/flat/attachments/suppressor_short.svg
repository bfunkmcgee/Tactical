<?xml version="1.0" encoding="UTF-8"?>
<!--
  Short suppressor (weapon-muzzle attachment). Mounts at the weapon's
  'muzzle' anchor. Cylinder extending forward past the barrel end;
  baffles visible as horizontal lines along the body.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 10" width="18" height="10">
  <!-- Suppressor body -->
  <rect x="0" y="2" width="17" height="6" fill="#2a2a2e" stroke="#0a0a0c" stroke-width="0.4"/>
  <!-- Ribs / baffles -->
  <line x1="3" y1="2" x2="3" y2="8" stroke="#0a0a0c" stroke-width="0.3"/>
  <line x1="6" y1="2" x2="6" y2="8" stroke="#0a0a0c" stroke-width="0.3"/>
  <line x1="9" y1="2" x2="9" y2="8" stroke="#0a0a0c" stroke-width="0.3"/>
  <line x1="12" y1="2" x2="12" y2="8" stroke="#0a0a0c" stroke-width="0.3"/>
  <line x1="15" y1="2" x2="15" y2="8" stroke="#0a0a0c" stroke-width="0.3"/>
  <!-- Top ridge highlight -->
  <rect x="0" y="2" width="17" height="0.8" fill="#4a4a52"/>
  <!-- Muzzle cap -->
  <rect x="16" y="2" width="2" height="6" fill="#1a1a1c" stroke="#0a0a0c" stroke-width="0.3"/>
  <circle cx="17" cy="5" r="1" fill="#0a0a0c"/>
</svg>
