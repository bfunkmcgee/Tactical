<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="r-plate" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="r-plate-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="r-tan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a88c5c"/><stop offset="1" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="r-tan-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a6038"/><stop offset="1" stop-color="#3a2e18"/>
    </linearGradient>
    <linearGradient id="r-boot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b09060"/><stop offset="1" stop-color="#6a5430"/>
    </linearGradient>
    <linearGradient id="r-gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c488"/><stop offset="1" stop-color="#8a6838"/>
    </linearGradient>
    <linearGradient id="r-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="r-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ARMS: matte black shell + tan sleeves at joints -->
  <path d="M18 42 L26 40 L26 54 L18 56 Z" fill="url(#r-plate)"/>
  <path d="M78 42 L70 40 L70 54 L78 56 Z" fill="url(#r-plate)"/>
  <!-- elbow gap (tan fabric) -->
  <path d="M18 56 L26 54 L26 58 L18 60 Z" fill="url(#r-tan)"/>
  <path d="M78 56 L70 54 L70 58 L78 60 Z" fill="url(#r-tan)"/>
  <!-- forearm plate -->
  <path d="M16 58 L26 58 L26 72 L18 72 Z" fill="url(#r-plate)"/>
  <path d="M80 58 L70 58 L70 72 L78 72 Z" fill="url(#r-plate)"/>
  <!-- forearm seam -->
  <path d="M18 62 L24 62 M18 68 L24 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <path d="M72 62 L78 62 M72 68 L78 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <!-- tactical gloves (dark) -->
  <path d="M14 72 Q12 76 16 78 L22 78 Q24 74 22 72 Z" fill="#0a0a0c"/>
  <path d="M82 72 Q84 76 80 78 L74 78 Q72 74 74 72 Z" fill="#0a0a0c"/>
  <!-- knuckle studs -->
  <circle cx="16" cy="74" r="0.6" fill="#2a2a2e"/>
  <circle cx="20" cy="76" r="0.6" fill="#2a2a2e"/>
  <circle cx="80" cy="74" r="0.6" fill="#2a2a2e"/>
  <circle cx="76" cy="76" r="0.6" fill="#2a2a2e"/>

</svg>