<?xml version="1.0" encoding="UTF-8"?>
<!--
  Standard Human Template — review image.
  Full-body render of what the rig composes when a soldier's
  HumanAppearance is left at the catalog's default choices:
    skinTone:  medium  (#c48a6a)
    hairStyle: short-crop
    hairColor: brown   (#4a3020)
    eyeColor:  brown   (#3a2a1c)
    baseOutfit: fatigues  (drab olive shirt + trousers)
  No armor overlay, no weapon. Viewport 192x280 so head + full body
  are visible. Rig parts are labeled on the right for reference.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 280" width="192" height="280">
  <defs>
    <radialGradient id="bg-t" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#0c1014"/>
    </radialGradient>
    <linearGradient id="skin-t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a488"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="fatigue-shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a6a44"/>
      <stop offset="100%" stop-color="#4a4a2c"/>
    </linearGradient>
    <linearGradient id="fatigue-pant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a3c"/>
      <stop offset="100%" stop-color="#3a3a24"/>
    </linearGradient>
    <linearGradient id="boot-t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f14"/>
      <stop offset="100%" stop-color="#140a04"/>
    </linearGradient>
  </defs>

  <rect width="192" height="280" fill="url(#bg-t)"/>

  <!-- Figure column centered around x=72 (leaves right side for labels) -->

  <!-- LEGS (base outfit trousers + boots) -->
  <g>
    <!-- Left leg -->
    <path d="M 56 160 L 54 218 L 62 222 L 66 162 Z" fill="url(#fatigue-pant)"/>
    <!-- Right leg -->
    <path d="M 78 162 L 82 222 L 90 218 L 88 160 Z" fill="url(#fatigue-pant)"/>
    <!-- Knee seam shadow -->
    <path d="M 56 190 L 66 190" stroke="#2a2a18" stroke-width="0.6" opacity="0.6"/>
    <path d="M 80 190 L 88 190" stroke="#2a2a18" stroke-width="0.6" opacity="0.6"/>
    <!-- Pant cuffs -->
    <rect x="53" y="216" width="11" height="2" fill="#2a2a18"/>
    <rect x="80" y="216" width="11" height="2" fill="#2a2a18"/>
    <!-- Boots -->
    <path d="M 53 218 L 52 232 L 66 232 L 66 222 Z" fill="url(#boot-t)"/>
    <path d="M 78 222 L 78 232 L 92 232 L 91 218 Z" fill="url(#boot-t)"/>
    <!-- Boot laces -->
    <line x1="58" y1="224" x2="60" y2="228" stroke="#5a4028" stroke-width="0.4"/>
    <line x1="60" y1="223" x2="58" y2="227" stroke="#5a4028" stroke-width="0.4"/>
    <line x1="83" y1="224" x2="85" y2="228" stroke="#5a4028" stroke-width="0.4"/>
    <line x1="85" y1="223" x2="83" y2="227" stroke="#5a4028" stroke-width="0.4"/>
  </g>

  <!-- ARMS BACK (visible behind torso silhouette) -->
  <!-- Left back-arm -->
  <path d="M 36 106 Q 30 130 34 170 L 42 172 Q 40 132 44 108 Z" fill="url(#fatigue-shirt)"/>
  <!-- Right back-arm -->
  <path d="M 108 106 Q 114 130 110 170 L 102 172 Q 104 132 100 108 Z" fill="url(#fatigue-shirt)"/>

  <!-- TORSO (base outfit shirt) -->
  <g>
    <!-- Main torso silhouette -->
    <path d="M 44 108 Q 44 100 52 98 Q 72 96 92 98 Q 100 100 100 108 L 100 160 Q 72 164 44 160 Z"
          fill="url(#fatigue-shirt)"/>
    <!-- Belt -->
    <rect x="44" y="154" width="56" height="6" fill="#2a1f14"/>
    <!-- Belt buckle -->
    <rect x="68" y="154" width="8" height="6" fill="#8a7a58" stroke="#2a1f14" stroke-width="0.5"/>
    <!-- Shirt center seam -->
    <line x1="72" y1="100" x2="72" y2="154" stroke="#3a3a24" stroke-width="0.5" opacity="0.6"/>
    <!-- Collar notch -->
    <path d="M 64 98 L 72 104 L 80 98" stroke="#3a3a24" stroke-width="0.7" fill="#4a4a2c"/>
    <!-- Sleeve seams -->
    <line x1="46" y1="108" x2="42" y2="114" stroke="#3a3a24" stroke-width="0.5" opacity="0.6"/>
    <line x1="98" y1="108" x2="102" y2="114" stroke="#3a3a24" stroke-width="0.5" opacity="0.6"/>
    <!-- Chest pocket flap hints -->
    <rect x="50" y="118" width="14" height="8" fill="none" stroke="#3a3a24" stroke-width="0.4" opacity="0.5"/>
    <rect x="80" y="118" width="14" height="8" fill="none" stroke="#3a3a24" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- ARMS FRONT (drop in front of torso near the grip position) -->
  <!-- Left front-arm (the hand side) -->
  <g>
    <path d="M 38 108 Q 34 140 38 170 L 50 172 Q 46 138 50 110 Z" fill="url(#fatigue-shirt)"/>
    <!-- Hand (skin) at end -->
    <ellipse cx="44" cy="176" rx="5" ry="5" fill="url(#skin-t)"/>
    <!-- Thumb crease -->
    <path d="M 41 174 Q 44 177 47 174" stroke="#8a5838" stroke-width="0.4" fill="none"/>
    <!-- Cuff -->
    <rect x="38" y="170" width="12" height="2" fill="#3a3a24"/>
  </g>
  <g>
    <path d="M 106 108 Q 110 140 106 170 L 94 172 Q 98 138 94 110 Z" fill="url(#fatigue-shirt)"/>
    <ellipse cx="100" cy="176" rx="5" ry="5" fill="url(#skin-t)"/>
    <path d="M 97 174 Q 100 177 103 174" stroke="#8a5838" stroke-width="0.4" fill="none"/>
    <rect x="94" y="170" width="12" height="2" fill="#3a3a24"/>
  </g>

  <!-- NECK -->
  <path d="M 64 90 L 64 104 L 80 104 L 80 90 Z" fill="url(#skin-t)"/>
  <path d="M 64 90 L 64 104 L 67 104 L 67 90 Z" fill="#8a5838" opacity="0.4"/>

  <!-- HEAD -->
  <g>
    <!-- Face silhouette -->
    <path d="M 52 54 Q 52 26 72 22 Q 92 26 92 54 Q 92 78 84 86 Q 78 92 72 92 Q 66 92 60 86 Q 52 78 52 54 Z"
          fill="url(#skin-t)"/>
    <!-- Face edge shadow -->
    <path d="M 52 54 Q 52 78 60 86 Q 66 92 72 92" stroke="#8a5838" stroke-width="0.5" fill="none" opacity="0.4"/>
    <!-- Ears -->
    <path d="M 51 62 Q 49 70 52 78 L 54 76 L 54 64 Z" fill="url(#skin-t)"/>
    <path d="M 93 62 Q 95 70 92 78 L 90 76 L 90 64 Z" fill="url(#skin-t)"/>

    <!-- HAIR: short-crop, brown -->
    <path d="M 52 46 Q 52 20 72 18 Q 92 20 92 46 L 92 54 Q 84 46 72 45 Q 60 46 52 54 Z" fill="#4a3020"/>
    <!-- Hair highlight on crown -->
    <path d="M 62 24 Q 72 20 82 24" stroke="#6a4830" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- Tapered sideburns -->
    <path d="M 52 54 L 54 64 L 52 62 Z" fill="#4a3020"/>
    <path d="M 92 54 L 90 64 L 92 62 Z" fill="#4a3020"/>

    <!-- Eyebrows: neutral, outer-raised -->
    <path d="M 57 54 Q 62 52 67 56" stroke="#2a180c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 77 56 Q 82 52 87 54" stroke="#2a180c" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Eyes: neutral open -->
    <path d="M 56 62 Q 62 60 68 62 Q 62 65 56 62 Z" fill="#ffffff" stroke="#3a2818" stroke-width="0.4"/>
    <path d="M 76 62 Q 82 60 88 62 Q 82 65 76 62 Z" fill="#ffffff" stroke="#3a2818" stroke-width="0.4"/>
    <!-- Iris: brown -->
    <circle cx="62" cy="62" r="2.2" fill="#3a2a1c"/>
    <circle cx="82" cy="62" r="2.2" fill="#3a2a1c"/>
    <circle cx="62" cy="62" r="2.2" fill="none" stroke="#5a4028" stroke-width="0.3"/>
    <circle cx="82" cy="62" r="2.2" fill="none" stroke="#5a4028" stroke-width="0.3"/>
    <!-- Pupils + catchlights -->
    <circle cx="62" cy="62" r="0.9" fill="#080606"/>
    <circle cx="82" cy="62" r="0.9" fill="#080606"/>
    <circle cx="63" cy="61.2" r="0.5" fill="#ffffff"/>
    <circle cx="83" cy="61.2" r="0.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 70 68 Q 70 74 70 78" stroke="#a07858" stroke-width="0.5" fill="none" opacity="0.6"/>
    <path d="M 74 68 Q 74 74 74 78" stroke="#a07858" stroke-width="0.5" fill="none" opacity="0.5"/>
    <path d="M 69 78 Q 72 80 75 78" stroke="#8a5838" stroke-width="0.6" fill="none"/>
    <circle cx="70.5" cy="79" r="0.4" fill="#8a5838" opacity="0.7"/>
    <circle cx="73.5" cy="79" r="0.4" fill="#8a5838" opacity="0.7"/>

    <!-- Cheek warmth -->
    <ellipse cx="58" cy="72" rx="3.5" ry="2" fill="#e8a888" opacity="0.35"/>
    <ellipse cx="86" cy="72" rx="3.5" ry="2" fill="#e8a888" opacity="0.35"/>

    <!-- Mouth: neutral single-stroke slight smile -->
    <path d="M 63 85 Q 72 82 81 85" stroke="#3a1810" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Part-name callouts on the right with dotted leader lines -->
  <g font-family="system-ui, sans-serif" font-size="7" fill="#e8c488" font-weight="bold">
    <!-- head -->
    <line x1="96" y1="54" x2="130" y2="54" stroke="#e8c488" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <text x="132" y="56">head</text>
    <!-- torso -->
    <line x1="102" y1="128" x2="130" y2="128" stroke="#e8c488" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <text x="132" y="130">torso</text>
    <!-- arms_front -->
    <line x1="106" y1="160" x2="130" y2="160" stroke="#e8c488" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <text x="132" y="162">arms_front</text>
    <!-- arms_back -->
    <line x1="112" y1="140" x2="138" y2="100" stroke="#e8c488" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <text x="132" y="98">arms_back</text>
    <!-- legs -->
    <line x1="92" y1="196" x2="130" y2="196" stroke="#e8c488" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
    <text x="132" y="198">legs</text>
  </g>

  <!-- Appearance legend along the left -->
  <g font-family="system-ui, sans-serif" font-size="6" fill="#b8a878">
    <rect x="6" y="40" width="36" height="68" fill="#0c1014" fill-opacity="0.55" stroke="#3a3e48" stroke-width="0.5" rx="2"/>
    <text x="8" y="50" fill="#e8c488" font-weight="bold">DEFAULTS</text>
    <text x="8" y="62">skin:</text>
    <rect x="22" y="57" width="18" height="5" fill="#c48a6a"/>
    <text x="8" y="72">hair:</text>
    <rect x="22" y="67" width="18" height="5" fill="#4a3020"/>
    <text x="8" y="82">eyes:</text>
    <rect x="22" y="77" width="18" height="5" fill="#3a2a1c"/>
    <text x="8" y="92">style:</text>
    <text x="8" y="100" fill="#d8c898">short-crop</text>
    <text x="8" y="106" fill="#d8c898">fatigues</text>
  </g>

  <!-- Title -->
  <text x="96" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e8c488" font-weight="bold">STANDARD HUMAN TEMPLATE</text>
  <text x="96" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" fill="#a89878">no armor · no weapon · neutral pose · default appearance</text>
</svg>
