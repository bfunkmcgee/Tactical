<?xml version="1.0" encoding="UTF-8"?>
<!--
  MOCKUP for review — Orin, Sapper.
  Medium skin, auburn bob, green eyes, a grease smudge on the cheek.
  Tinkerer's energy — wiry, practical, faint smirk. Displayed at 128×128
  for legibility. Review art only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg-orin" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3a3a28"/>
      <stop offset="100%" stop-color="#14140a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg-orin)"/>

  <!-- Shoulders + utility vest silhouette. -->
  <path d="M 18 128 L 24 106 Q 64 98 104 106 L 110 128 Z" fill="#6a5a44"/>
  <!-- Vest halves — dark canvas panels with edge stitching. -->
  <path d="M 24 106 L 42 104 L 42 128 L 18 128 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.5"/>
  <path d="M 104 106 L 86 104 L 86 128 L 110 128 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.5"/>
  <!-- Pouch hints on the vest. -->
  <rect x="26" y="112" width="10" height="10" fill="#5a4030"/>
  <rect x="92" y="112" width="10" height="10" fill="#5a4030"/>
  <!-- Tee undershirt showing at the collar. -->
  <path d="M 50 106 Q 64 112 78 106 Z" fill="#4a4030"/>

  <!-- Neck. -->
  <rect x="58" y="88" width="12" height="18" fill="#c48a6a"/>

  <!-- Head: medium skin 0xc48a6a. Slightly rounder than Kestrel. -->
  <path d="M 44 58 Q 44 30 64 26 Q 84 30 84 58 Q 84 82 74 88 Q 64 92 54 88 Q 44 82 44 58 Z"
        fill="#c48a6a" stroke="#6a4030" stroke-width="0.6"/>

  <!-- Hair: auburn bob 0x7a3a20. Chin-length, slightly tousled. -->
  <!-- Crown + back volume. -->
  <path d="M 40 52 Q 44 22 64 22 Q 84 22 88 52 L 84 80 L 78 80 Q 78 66 84 58 Q 80 50 64 48 Q 48 50 44 58 Q 50 66 50 80 L 44 80 Z" fill="#7a3a20"/>
  <!-- Fringe / bangs — shaggy. -->
  <path d="M 46 44 Q 52 36 58 40 L 60 48 Q 54 46 50 50 Z" fill="#6a2810"/>
  <path d="M 68 40 Q 74 36 82 44 L 80 50 Q 76 46 70 48 Z" fill="#6a2810"/>
  <!-- Loose strand across the forehead. -->
  <path d="M 56 42 Q 60 44 64 42" stroke="#5a2010" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Ear tip peek (left side). -->
  <ellipse cx="44" cy="66" rx="2" ry="4" fill="#c48a6a" stroke="#6a4030" stroke-width="0.3"/>

  <!-- Eyebrows — angled, a little playful. -->
  <path d="M 50 58 L 58 60" stroke="#4a1808" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 70 60 L 78 58" stroke="#4a1808" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Eyes: green 0x3a5a3a. Bright, alert. -->
  <ellipse cx="54" cy="68" rx="4" ry="2.6" fill="#ffffff"/>
  <ellipse cx="74" cy="68" rx="4" ry="2.6" fill="#ffffff"/>
  <circle cx="55" cy="68" r="2.2" fill="#3a5a3a"/>
  <circle cx="73" cy="68" r="2.2" fill="#3a5a3a"/>
  <circle cx="55" cy="68" r="0.9" fill="#0a0a0c"/>
  <circle cx="73" cy="68" r="0.9" fill="#0a0a0c"/>
  <circle cx="56" cy="67" r="0.6" fill="#ffffff"/>
  <circle cx="74" cy="67" r="0.6" fill="#ffffff"/>

  <!-- Nose: small, slightly upturned (tinkerer read). -->
  <path d="M 64 70 L 62 80 L 64 82 L 67 80 Z" fill="#a86838" opacity="0.6"/>
  <path d="M 62 80 Q 64 81 67 80" stroke="#6a4030" stroke-width="0.5" fill="none"/>

  <!-- Mouth: slight smirk — one corner up. -->
  <path d="M 56 88 Q 62 90 68 89 Q 70 87 72 88" stroke="#4a2818" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M 56 88 Q 62 87 68 87" stroke="#c48a6a" stroke-width="0.5" fill="none" opacity="0.6"/>

  <!-- Cheek highlights. -->
  <ellipse cx="50" cy="76" rx="3" ry="1.6" fill="#e0a888" opacity="0.5"/>
  <ellipse cx="78" cy="76" rx="3" ry="1.6" fill="#e0a888" opacity="0.5"/>

  <!-- Signature detail: grease smudge on left cheek. -->
  <ellipse cx="54" cy="82" rx="3.5" ry="1.2" fill="#1a0f08" opacity="0.75"/>
  <ellipse cx="50" cy="80" rx="1.5" ry="0.8" fill="#1a0f08" opacity="0.6"/>
  <!-- A small grease mark on the forehead too — playful. -->
  <circle cx="72" cy="48" r="1.2" fill="#1a0f08" opacity="0.5"/>

  <!-- Freckles across the nose bridge + cheeks — adds character. -->
  <circle cx="58" cy="74" r="0.5" fill="#6a4030" opacity="0.6"/>
  <circle cx="61" cy="76" r="0.4" fill="#6a4030" opacity="0.6"/>
  <circle cx="68" cy="75" r="0.5" fill="#6a4030" opacity="0.6"/>
  <circle cx="71" cy="74" r="0.4" fill="#6a4030" opacity="0.6"/>
  <circle cx="65" cy="73" r="0.4" fill="#6a4030" opacity="0.5"/>

  <!-- Name label. -->
  <text x="64" y="122" text-anchor="middle" font-family="system-ui" font-size="8" fill="#e8c488" font-weight="bold">ORIN · Sapper</text>
</svg>
