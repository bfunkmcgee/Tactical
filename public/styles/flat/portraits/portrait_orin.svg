<?xml version="1.0" encoding="UTF-8"?>
<!--
  Orin — Sapper. Portrait mockup v3 (rebuild from scratch).
  Medium warm skin, auburn chin-length bob with scruffy fringe, bright
  green eyes, freckles across the nose bridge, asymmetric smirk,
  signature grease smudge on the left cheek. Utility vest with pouches.
  Review art only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg-o" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3a3a28"/>
      <stop offset="100%" stop-color="#14140a"/>
    </radialGradient>
    <linearGradient id="skin-o" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a488"/>
      <stop offset="100%" stop-color="#a87858"/>
    </linearGradient>
    <linearGradient id="hair-o" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4020"/>
      <stop offset="100%" stop-color="#5a2010"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg-o)"/>

  <!-- Shoulders: utility vest over tee -->
  <path d="M 14 128 L 22 104 Q 64 96 106 104 L 114 128 Z" fill="#6a5a40"/>
  <!-- Vest panels (darker canvas) -->
  <path d="M 22 104 L 42 102 L 42 128 L 14 128 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.5"/>
  <path d="M 106 104 L 86 102 L 86 128 L 114 128 Z" fill="#3a2a1c" stroke="#1a1008" stroke-width="0.5"/>
  <!-- Pouches -->
  <rect x="26" y="110" width="11" height="11" fill="#5a4030" stroke="#2a1a10" stroke-width="0.4"/>
  <rect x="91" y="110" width="11" height="11" fill="#5a4030" stroke="#2a1a10" stroke-width="0.4"/>
  <!-- Pouch strap hints -->
  <line x1="26" y1="115" x2="37" y2="115" stroke="#2a1a10" stroke-width="0.3"/>
  <line x1="91" y1="115" x2="102" y2="115" stroke="#2a1a10" stroke-width="0.3"/>
  <!-- Tee showing at collar -->
  <path d="M 50 104 Q 64 110 78 104 L 76 106 Q 64 110 52 106 Z" fill="#4a4030"/>
  <!-- Strap across chest -->
  <rect x="42" y="108" width="44" height="2.2" fill="#3a2a1c"/>
  <rect x="42" y="110.2" width="44" height="0.6" fill="#1a1008" opacity="0.7"/>

  <!-- Neck -->
  <path d="M 58 88 L 58 106 L 70 106 L 70 88 Z" fill="url(#skin-o)"/>
  <path d="M 58 88 L 58 106 L 61 106 L 61 88 Z" fill="#8a6848" opacity="0.4"/>

  <!-- Head: slightly rounder than Kestrel's, with a little more apple-cheek -->
  <path d="M 44 58 Q 44 30 64 26 Q 84 30 84 58 Q 84 80 78 86 Q 72 92 64 93 Q 56 92 50 86 Q 44 80 44 58 Z"
        fill="url(#skin-o)"/>
  <path d="M 44 58 Q 44 80 50 86 Q 56 92 64 93" stroke="#8a5838" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Ear tips peeking through hair -->
  <path d="M 43 66 Q 41 72 44 78 L 46 76 L 46 68 Z" fill="url(#skin-o)" stroke="#8a5838" stroke-width="0.3"/>

  <!-- Hair: auburn bob — crown + back volume + shaggy fringe -->
  <!-- Back + sides (chin-length) -->
  <path d="M 40 54 Q 42 22 64 22 Q 86 22 88 54 L 86 82 Q 82 86 78 82 Q 78 66 84 58 Q 80 50 64 48 Q 48 50 44 58 Q 50 66 50 82 Q 46 86 42 82 Z"
        fill="url(#hair-o)"/>
  <!-- Shaggy fringe pieces -->
  <path d="M 48 46 Q 54 38 60 42 L 62 52 Q 56 48 50 52 Z" fill="#4a1808"/>
  <path d="M 66 42 Q 74 38 82 46 L 80 52 Q 74 48 68 52 Z" fill="#4a1808"/>
  <!-- Stray forehead wisp -->
  <path d="M 56 44 Q 62 44 66 42" stroke="#3a1008" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Hair highlights -->
  <path d="M 50 30 Q 56 26 64 26" stroke="#a85838" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Eyebrows: playful arch, outer-raised, right slightly higher for smirk -->
  <path d="M 49 59 Q 54 57 59 60" stroke="#3a1008" stroke-width="1.9" stroke-linecap="round" fill="none"/>
  <path d="M 68 58 Q 73 55 78 58" stroke="#3a1008" stroke-width="1.9" stroke-linecap="round" fill="none"/>

  <!-- Eyes: wide, bright, alert -->
  <path d="M 48 65 Q 54 63 60 65 Q 54 68 48 65 Z" fill="#ffffff" stroke="#4a2010" stroke-width="0.4"/>
  <path d="M 68 65 Q 74 63 80 65 Q 74 68 68 65 Z" fill="#ffffff" stroke="#4a2010" stroke-width="0.4"/>
  <!-- Iris: bright green -->
  <circle cx="54" cy="65" r="2.3" fill="#3a6a3a"/>
  <circle cx="74" cy="65" r="2.3" fill="#3a6a3a"/>
  <circle cx="54" cy="65" r="2.3" fill="none" stroke="#5a8a5a" stroke-width="0.3"/>
  <circle cx="74" cy="65" r="2.3" fill="none" stroke="#5a8a5a" stroke-width="0.3"/>
  <!-- Pupil -->
  <circle cx="54" cy="65" r="0.9" fill="#0a0808"/>
  <circle cx="74" cy="65" r="0.9" fill="#0a0808"/>
  <!-- Catchlight (bigger, a bit more sparkle) -->
  <circle cx="55" cy="64.2" r="0.6" fill="#ffffff"/>
  <circle cx="75" cy="64.2" r="0.6" fill="#ffffff"/>

  <!-- Nose: small, slightly upturned -->
  <path d="M 62 71 Q 61 77 62 80 L 64 82 L 67 80 Q 66 77 66 71" stroke="#8a5838" stroke-width="0.5" fill="none" opacity="0.6"/>
  <circle cx="62.5" cy="81" r="0.4" fill="#6a4030" opacity="0.8"/>
  <circle cx="65.5" cy="81" r="0.4" fill="#6a4030" opacity="0.8"/>

  <!-- Cheek warmth (apple-cheeks) -->
  <ellipse cx="51" cy="76" rx="3.5" ry="2.2" fill="#e89878" opacity="0.55"/>
  <ellipse cx="77" cy="76" rx="3.5" ry="2.2" fill="#e89878" opacity="0.55"/>

  <!-- Freckles across nose + cheeks -->
  <circle cx="58" cy="73" r="0.5" fill="#6a3020" opacity="0.7"/>
  <circle cx="61" cy="75" r="0.4" fill="#6a3020" opacity="0.7"/>
  <circle cx="65" cy="73" r="0.4" fill="#6a3020" opacity="0.6"/>
  <circle cx="68" cy="75" r="0.5" fill="#6a3020" opacity="0.7"/>
  <circle cx="71" cy="73" r="0.4" fill="#6a3020" opacity="0.6"/>
  <circle cx="55" cy="77" r="0.35" fill="#6a3020" opacity="0.5"/>
  <circle cx="73" cy="77" r="0.35" fill="#6a3020" opacity="0.5"/>

  <!-- Mouth: single-stroke asymmetric smirk. Left corner y=89, right y=85. -->
  <path d="M 54 89 Q 62 83 74 85" stroke="#3a1810" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Dimple at raised corner -->
  <circle cx="74" cy="85" r="0.6" fill="#6a3020" opacity="0.7"/>

  <!-- Grease smudge on left cheek (signature) -->
  <ellipse cx="52" cy="82" rx="4" ry="1.4" fill="#1a0f08" opacity="0.75"/>
  <ellipse cx="48" cy="80" rx="1.5" ry="0.7" fill="#1a0f08" opacity="0.6"/>
  <!-- Tiny grease dot on forehead -->
  <circle cx="72" cy="50" r="1.2" fill="#1a0f08" opacity="0.55"/>

  <!-- Name label -->
  <text x="64" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#e8c488" font-weight="bold">ORIN · SAPPER</text>
</svg>
