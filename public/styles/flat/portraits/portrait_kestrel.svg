<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kestrel — Ranger. Portrait mockup v3 (rebuild from scratch).
  Sharp-eyed scout. Fair skin, short black tactical crop, blue eyes,
  determined set to the mouth, small scar over the right brow.
  Tactical harness grounds the portrait. Review art only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg-k" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2e3f50"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </radialGradient>
    <linearGradient id="skin-k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cfae"/>
      <stop offset="100%" stop-color="#d4a888"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg-k)"/>

  <!-- Shoulders: tactical harness vest -->
  <path d="M 10 128 L 18 106 Q 64 98 110 106 L 118 128 Z" fill="#5c6a48"/>
  <!-- Chest strap across -->
  <rect x="18" y="112" width="92" height="3" fill="#2a1f14"/>
  <!-- Buckle hint -->
  <rect x="60" y="110" width="8" height="7" fill="#7a6a48" stroke="#2a1f14" stroke-width="0.5"/>
  <line x1="60" y1="113.5" x2="68" y2="113.5" stroke="#2a1f14" stroke-width="0.4"/>
  <!-- Strap rivets -->
  <circle cx="22" cy="113.5" r="0.8" fill="#8a7a58"/>
  <circle cx="106" cy="113.5" r="0.8" fill="#8a7a58"/>

  <!-- Neck -->
  <path d="M 56 90 L 56 108 L 72 108 L 72 90 Z" fill="url(#skin-k)"/>
  <!-- Neck shadow on left side -->
  <path d="M 56 90 L 56 108 L 60 108 L 60 90 Z" fill="#b08868" opacity="0.4"/>
  <!-- Jaw-to-neck transition shadow -->
  <path d="M 54 90 Q 64 93 74 90" stroke="#a07858" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Head silhouette: oval with modest jaw taper -->
  <path d="M 44 54 Q 44 28 64 24 Q 84 28 84 54 Q 84 76 78 86 Q 72 92 64 93 Q 56 92 50 86 Q 44 76 44 54 Z"
        fill="url(#skin-k)"/>
  <!-- Face silhouette shadow edge -->
  <path d="M 44 54 Q 44 76 50 86 Q 56 92 64 93" stroke="#a07858" stroke-width="0.5" fill="none" opacity="0.4"/>

  <!-- Ear: left side only (natural at this angle) -->
  <path d="M 43 66 Q 41 72 44 78 L 46 76 L 46 68 Z" fill="#d4a888"/>
  <path d="M 44 70 Q 45 72 44 74" stroke="#8a6844" stroke-width="0.4" fill="none"/>

  <!-- Hair: short tactical crop. Helmet-shaped, follows skull. -->
  <path d="M 44 48 Q 44 22 64 20 Q 84 22 84 48 L 84 54 Q 78 46 64 45 Q 50 46 44 54 Z" fill="#141008"/>
  <!-- Hair highlight on crown -->
  <path d="M 54 26 Q 64 22 74 26" stroke="#2a2018" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- Tapered sideburns -->
  <path d="M 44 54 L 46 66 L 44 64 Z" fill="#141008"/>
  <path d="M 84 54 L 82 66 L 84 64 Z" fill="#141008"/>
  <!-- Forehead fringe -->
  <path d="M 52 46 Q 58 44 64 46 Q 62 50 58 50 Q 54 50 52 48 Z" fill="#080604"/>

  <!-- Eyebrows: outer-raised, thick, focused -->
  <path d="M 49 56 Q 54 54 60 58" stroke="#0a0806" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M 68 58 Q 74 54 79 56" stroke="#0a0806" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Eye shape: slightly narrowed (alert scout) -->
  <path d="M 49 64 Q 54 62 59 64 Q 54 67 49 64 Z" fill="#ffffff" stroke="#3a2818" stroke-width="0.4"/>
  <path d="M 69 64 Q 74 62 79 64 Q 74 67 69 64 Z" fill="#ffffff" stroke="#3a2818" stroke-width="0.4"/>
  <!-- Iris: blue -->
  <circle cx="54" cy="64.5" r="2.2" fill="#3a5a8a"/>
  <circle cx="74" cy="64.5" r="2.2" fill="#3a5a8a"/>
  <!-- Iris highlight ring -->
  <circle cx="54" cy="64.5" r="2.2" fill="none" stroke="#5a7aaa" stroke-width="0.4"/>
  <circle cx="74" cy="64.5" r="2.2" fill="none" stroke="#5a7aaa" stroke-width="0.4"/>
  <!-- Pupil -->
  <circle cx="54" cy="64.5" r="0.9" fill="#080606"/>
  <circle cx="74" cy="64.5" r="0.9" fill="#080606"/>
  <!-- Catchlight -->
  <circle cx="55" cy="63.7" r="0.5" fill="#ffffff"/>
  <circle cx="75" cy="63.7" r="0.5" fill="#ffffff"/>

  <!-- Nose: minimal — just a subtle bridge shadow and nostril hints -->
  <path d="M 62 70 Q 62 76 62 80" stroke="#a07858" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M 66 70 Q 66 76 66 80" stroke="#a07858" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 61 80 Q 64 82 67 80" stroke="#8a6844" stroke-width="0.6" fill="none"/>
  <circle cx="62.5" cy="81" r="0.4" fill="#8a6844" opacity="0.7"/>
  <circle cx="65.5" cy="81" r="0.4" fill="#8a6844" opacity="0.7"/>

  <!-- Cheek warmth -->
  <ellipse cx="50" cy="74" rx="4" ry="2.2" fill="#e8a888" opacity="0.35"/>
  <ellipse cx="78" cy="74" rx="4" ry="2.2" fill="#e8a888" opacity="0.35"/>

  <!-- Mouth: single-stroke determined smile -->
  <path d="M 55 87 Q 64 83 73 87" stroke="#3a1810" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Scar: diagonal through right brow -->
  <line x1="71" y1="53" x2="77" y2="56" stroke="#f0d4b8" stroke-width="0.9"/>
  <line x1="71" y1="53" x2="77" y2="56" stroke="#a07858" stroke-width="0.4" opacity="0.5"/>

  <!-- Name label -->
  <text x="64" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#e8c488" font-weight="bold">KESTREL · RANGER</text>
</svg>
