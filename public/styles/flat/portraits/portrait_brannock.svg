<?xml version="1.0" encoding="UTF-8"?>
<!--
  Brannock — Warden. Portrait mockup v3 (rebuild from scratch).
  Tan skin, cleanly shaved head with natural scalp shine, hazel eyes,
  heavy brow, thick moustache, diagonal scar on the left cheek, and a
  faded Eagle Corps sigil tattoo on the right side of the neck.
  Henley-collared undershirt + broad shoulders. Review art only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg-b" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <radialGradient id="skin-b" cx="42%" cy="36%" r="85%">
      <stop offset="0%" stop-color="#a87a5a"/>
      <stop offset="100%" stop-color="#865838"/>
    </radialGradient>
    <linearGradient id="scalp-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c48a6a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c48a6a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="url(#bg-b)"/>

  <!-- Broad shoulders: dark canvas shirt -->
  <path d="M 8 128 L 16 102 Q 64 94 112 102 L 120 128 Z" fill="#3a3228"/>
  <!-- Shoulder-seam highlights -->
  <path d="M 18 108 Q 40 103 58 103" stroke="#5a4a38" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M 70 103 Q 88 103 110 108" stroke="#5a4a38" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- Henley collar: two-button placket -->
  <path d="M 56 102 L 56 120 L 72 120 L 72 102 Z" fill="#2a241c"/>
  <line x1="64" y1="104" x2="64" y2="120" stroke="#5a4a38" stroke-width="0.4"/>
  <circle cx="64" cy="107" r="0.9" fill="#8a6a48"/>
  <circle cx="64" cy="114" r="0.9" fill="#8a6a48"/>

  <!-- Thick neck -->
  <path d="M 52 88 L 50 106 L 78 106 L 76 88 Z" fill="url(#skin-b)"/>
  <!-- Neck shadow under jaw -->
  <path d="M 52 92 Q 64 95 76 92" stroke="#5a3020" stroke-width="0.6" fill="none" opacity="0.6"/>
  <!-- Collarbone hint -->
  <path d="M 52 104 Q 64 108 76 104" stroke="#5a3020" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Head: broader than Kestrel's, strong jaw but not exaggerated -->
  <path d="M 42 56 Q 42 28 64 22 Q 86 28 86 56 Q 86 76 82 84 Q 74 92 64 93 Q 54 92 46 84 Q 42 76 42 56 Z"
        fill="url(#skin-b)"/>
  <!-- Face edge shadow -->
  <path d="M 42 56 Q 42 76 46 84 Q 54 92 64 93" stroke="#5a3020" stroke-width="0.5" fill="none" opacity="0.5"/>

  <!-- Ear (left) -->
  <path d="M 41 64 Q 39 72 42 80 L 44 78 L 44 66 Z" fill="url(#skin-b)"/>
  <path d="M 42 70 Q 43 74 42 76" stroke="#5a3020" stroke-width="0.4" fill="none"/>
  <!-- Ear (right) -->
  <path d="M 87 64 Q 89 72 86 80 L 84 78 L 84 66 Z" fill="url(#skin-b)"/>

  <!-- Shaved scalp shine -->
  <ellipse cx="64" cy="34" rx="18" ry="9" fill="url(#scalp-b)"/>
  <!-- Stubble tone on the scalp sides -->
  <path d="M 42 42 Q 42 50 44 54 Q 48 48 56 46 Q 64 44 72 46 Q 80 48 84 54 Q 86 50 86 42 Q 64 36 42 42 Z"
        fill="#3a1a0c" opacity="0.22"/>

  <!-- Heavy brow ridge -->
  <path d="M 46 56 Q 54 52 60 58" stroke="#3a1a0c" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M 68 58 Q 74 52 82 56" stroke="#3a1a0c" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Eyes: steady, open, not squinting -->
  <path d="M 48 65 Q 54 62 60 65 Q 54 68 48 65 Z" fill="#ffffff" stroke="#3a1a0c" stroke-width="0.5"/>
  <path d="M 68 65 Q 74 62 80 65 Q 74 68 68 65 Z" fill="#ffffff" stroke="#3a1a0c" stroke-width="0.5"/>
  <!-- Upper-lid shadow from heavy brow -->
  <path d="M 48 63 Q 54 62 60 63" stroke="#3a1a0c" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M 68 63 Q 74 62 80 63" stroke="#3a1a0c" stroke-width="0.8" fill="none" opacity="0.7"/>
  <!-- Iris: hazel -->
  <circle cx="54" cy="65" r="2.2" fill="#6a4a28"/>
  <circle cx="74" cy="65" r="2.2" fill="#6a4a28"/>
  <circle cx="54" cy="65" r="2.2" fill="none" stroke="#8a6a38" stroke-width="0.3"/>
  <circle cx="74" cy="65" r="2.2" fill="none" stroke="#8a6a38" stroke-width="0.3"/>
  <!-- Pupil -->
  <circle cx="54" cy="65" r="0.9" fill="#0a0806"/>
  <circle cx="74" cy="65" r="0.9" fill="#0a0806"/>
  <!-- Catchlight -->
  <circle cx="55" cy="64.2" r="0.5" fill="#ffffff"/>
  <circle cx="75" cy="64.2" r="0.5" fill="#ffffff"/>

  <!-- Nose: broad Roman, clean bridge + nostrils -->
  <path d="M 60 68 Q 58 76 58 80 L 60 82 L 64 83 L 68 82 L 70 80 Q 70 76 68 68 Z"
        fill="#8a5a3a" opacity="0.45"/>
  <line x1="64" y1="68" x2="64" y2="80" stroke="#c48a6a" stroke-width="0.6" opacity="0.7"/>
  <ellipse cx="61" cy="81" rx="1.1" ry="0.6" fill="#3a1a0c" opacity="0.8"/>
  <ellipse cx="67" cy="81" rx="1.1" ry="0.6" fill="#3a1a0c" opacity="0.8"/>

  <!-- Cheekbone highlight -->
  <ellipse cx="48" cy="72" rx="4" ry="2" fill="#c48a6a" opacity="0.35"/>
  <ellipse cx="80" cy="72" rx="4" ry="2" fill="#c48a6a" opacity="0.35"/>

  <!-- Moustache: thick horseshoe -->
  <path d="M 50 86 Q 54 84 58 85 L 60 88 Q 55 89 51 90 Z" fill="#2a1408"/>
  <path d="M 78 86 Q 74 84 70 85 L 68 88 Q 73 89 77 90 Z" fill="#2a1408"/>
  <path d="M 58 85 Q 64 84 70 85 L 70 87 Q 64 86 58 87 Z" fill="#2a1408"/>

  <!-- Mouth: single-stroke stoic half-smile, tucked under the moustache -->
  <path d="M 54 90 Q 64 86 74 90" stroke="#1a0a04" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Chin stubble shadow along the jaw -->
  <path d="M 48 84 Q 64 94 80 84 Q 78 90 64 92 Q 50 90 48 84 Z" fill="#3a1a0c" opacity="0.32"/>

  <!-- Scar: diagonal on left cheek, raised-scar dual stroke -->
  <path d="M 46 70 Q 44 78 46 86" stroke="#3a1a0c" stroke-width="1.2" fill="none" opacity="0.75"/>
  <path d="M 46 70 Q 44 78 46 86" stroke="#e8c4a4" stroke-width="0.8" fill="none" opacity="0.9"/>
  <line x1="45" y1="74" x2="47" y2="73.4" stroke="#2a1408" stroke-width="0.3" opacity="0.6"/>
  <line x1="44.4" y1="78" x2="46.4" y2="77.6" stroke="#2a1408" stroke-width="0.3" opacity="0.6"/>
  <line x1="44.8" y1="82" x2="46.8" y2="81.6" stroke="#2a1408" stroke-width="0.3" opacity="0.6"/>

  <!-- Eagle Corps sigil tattoo on right neck: stylized double-headed eagle -->
  <g opacity="0.8">
    <!-- Eagle heads + beaks -->
    <path d="M 72 96 L 71 92.5 L 72.8 91 L 73 93 Z" fill="#1a0804"/>
    <path d="M 75 96 L 75.2 93 L 77 91 L 76 92.5 Z" fill="#1a0804"/>
    <path d="M 71.5 92 L 69.5 91 L 71.5 91.5 Z" fill="#1a0804"/>
    <path d="M 76.5 92 L 78.5 91 L 76.5 91.5 Z" fill="#1a0804"/>
    <!-- Wings spread -->
    <path d="M 66 98 L 72 95.5 L 74 95.5 L 76 95.5 L 82 98 L 80 99.5 L 74 98 L 68 99.5 Z" fill="#1a0804"/>
    <!-- Body + tail -->
    <path d="M 73 97 L 75 97 L 75.5 101 L 74 102 L 72.5 101 Z" fill="#1a0804"/>
    <!-- Motto dash below -->
    <line x1="70" y1="103.5" x2="78" y2="103.5" stroke="#1a0804" stroke-width="0.5"/>
  </g>

  <!-- Name label -->
  <text x="64" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" fill="#e8c488" font-weight="bold">BRANNOCK · WARDEN</text>
</svg>
