<?xml version="1.0" encoding="UTF-8"?>
<!--
  MOCKUP for review — Brannock, Warden. v2 (less awkward).
  Tan skin, cleanly shaved head with a natural 5-o'clock shadow,
  hazel eyes, strong but proportionate features. Reads as stoic
  veteran rather than exaggerated meat-head. Review art only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg-brannock" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </radialGradient>
    <!-- Subtle skin-shading gradient for a bit of dimensionality. -->
    <radialGradient id="brannock-skin" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#a87a5a"/>
      <stop offset="100%" stop-color="#8a5a3a"/>
    </radialGradient>
    <!-- Shadow gradient for the shaved head shine. -->
    <linearGradient id="brannock-scalp-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c48a6a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c48a6a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="url(#bg-brannock)"/>

  <!-- Shoulders — broad, dark canvas undershirt with a slight collar. -->
  <path d="M 12 128 L 18 104 Q 64 96 110 104 L 116 128 Z" fill="#3a3228"/>
  <!-- Henley neckline — two-button instead of a weird stretched scoop. -->
  <path d="M 58 104 L 58 118 L 70 118 L 70 104 Z" fill="#2a241c"/>
  <line x1="64" y1="106" x2="64" y2="118" stroke="#5a4a38" stroke-width="0.4"/>
  <circle cx="64" cy="108" r="0.8" fill="#8a6a48"/>
  <circle cx="64" cy="114" r="0.8" fill="#8a6a48"/>
  <!-- Shoulder-line subtle highlight to sell bulk without a hard ridge. -->
  <path d="M 18 108 Q 38 102 58 104" stroke="#5a4a38" stroke-width="0.6" fill="none" opacity="0.6"/>
  <path d="M 70 104 Q 90 102 110 108" stroke="#5a4a38" stroke-width="0.6" fill="none" opacity="0.6"/>

  <!-- Thick neck — proportioned, not stubby. -->
  <path d="M 52 88 L 52 106 L 76 106 L 76 88 Z" fill="url(#brannock-skin)"/>
  <!-- Subtle collarbone shading. -->
  <path d="M 52 104 Q 64 110 76 104" stroke="#5a3020" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- Head: tan skin. Egg-shaped with a strong but not exaggerated jaw. -->
  <path d="M 42 58 Q 42 30 64 24 Q 86 30 86 58 Q 86 78 82 84 Q 74 92 64 92 Q 54 92 46 84 Q 42 78 42 58 Z"
        fill="url(#brannock-skin)"/>
  <!-- Face silhouette edge for definition. -->
  <path d="M 42 58 Q 42 30 64 24 Q 86 30 86 58 Q 86 78 82 84 Q 74 92 64 92 Q 54 92 46 84 Q 42 78 42 58 Z"
        fill="none" stroke="#5a3020" stroke-width="0.8"/>

  <!-- Shaved-head shine on the crown (natural light). -->
  <ellipse cx="64" cy="36" rx="16" ry="8" fill="url(#brannock-scalp-shine)"/>

  <!-- 5-o'clock shadow on the chin/jaw — NOT a ring. Follows the jaw
       line naturally, fading as it approaches the ears. -->
  <path d="M 48 76 Q 64 90 80 76 Q 78 86 64 90 Q 50 86 48 76 Z" fill="#4a2818" opacity="0.35"/>
  <!-- Mustache-stubble hint above the lip. -->
  <path d="M 56 82 Q 64 83 72 82" stroke="#4a2818" stroke-width="1" stroke-linecap="round" opacity="0.35" fill="none"/>

  <!-- Brow ridge: heavy but clean — one smooth line each. -->
  <path d="M 48 58 Q 56 54 62 56" stroke="#3a1a0c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 66 56 Q 72 54 80 58" stroke="#3a1a0c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes: hazel. Open, steady — not squinting. -->
  <ellipse cx="54" cy="66" rx="4" ry="2.6" fill="#ffffff"/>
  <ellipse cx="74" cy="66" rx="4" ry="2.6" fill="#ffffff"/>
  <!-- Upper-lid shadow from the heavy brow. -->
  <path d="M 50 64 Q 54 63 58 64" stroke="#3a1a0c" stroke-width="0.8" fill="none" opacity="0.6"/>
  <path d="M 70 64 Q 74 63 78 64" stroke="#3a1a0c" stroke-width="0.8" fill="none" opacity="0.6"/>
  <circle cx="54" cy="66.5" r="2" fill="#6a4a28"/>
  <circle cx="74" cy="66.5" r="2" fill="#6a4a28"/>
  <circle cx="54" cy="66.5" r="0.8" fill="#0a0a0c"/>
  <circle cx="74" cy="66.5" r="0.8" fill="#0a0a0c"/>
  <circle cx="55" cy="65.5" r="0.5" fill="#ffffff"/>
  <circle cx="75" cy="65.5" r="0.5" fill="#ffffff"/>

  <!-- Nose: broad Roman nose, clean line. No broken-bend weirdness. -->
  <path d="M 62 68 Q 60 74 60 80 L 62 82 L 66 82 L 68 80 Q 68 74 66 68 Z"
        fill="#8a5a3a" opacity="0.5"/>
  <!-- Nose bridge highlight. -->
  <line x1="64" y1="68" x2="64" y2="80" stroke="#c48a6a" stroke-width="0.5" opacity="0.7"/>
  <!-- Nostrils. -->
  <ellipse cx="61.5" cy="80.5" rx="1" ry="0.6" fill="#5a3020" opacity="0.7"/>
  <ellipse cx="66.5" cy="80.5" rx="1" ry="0.6" fill="#5a3020" opacity="0.7"/>

  <!-- Mouth: stoic half-smile — corners curve slightly UP (Q control
       above endpoints). Reads as "composed veteran" rather than grim. -->
  <path d="M 54 90 Q 58 88 64 88 Q 70 88 74 90" stroke="#2a1408" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Lower-lip hint, same curve. -->
  <path d="M 56 91 Q 64 89.5 72 91" stroke="#8a4828" stroke-width="0.6" fill="none" opacity="0.55"/>

  <!-- Cheekbone highlight — gives the face structure without a harsh
       contour line. -->
  <ellipse cx="50" cy="72" rx="4" ry="2" fill="#c48a6a" opacity="0.35"/>
  <ellipse cx="78" cy="72" rx="4" ry="2" fill="#c48a6a" opacity="0.35"/>

  <!-- Character detail: a long diagonal scar across the left cheek,
       running from just under the outer corner of the eye down to the
       corner of the jaw. Double-stroked (light raised scar over a
       dark outline) so it reads as a healed cut, not a skin mark. -->
  <path d="M 48 70 Q 46 78 48 86" stroke="#5a3020" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 48 70 Q 46 78 48 86" stroke="#e0a888" stroke-width="0.8" fill="none" opacity="0.9"/>
  <!-- Tiny cross-hatch suture marks along the scar for texture. -->
  <line x1="46.6" y1="74" x2="48.6" y2="73.2" stroke="#4a2818" stroke-width="0.3" opacity="0.6"/>
  <line x1="46" y1="78" x2="48" y2="77.4" stroke="#4a2818" stroke-width="0.3" opacity="0.6"/>
  <line x1="46.3" y1="82" x2="48.3" y2="81.4" stroke="#4a2818" stroke-width="0.3" opacity="0.6"/>

  <!-- Neck tattoo: stylized double-headed Eagle Corps sigil on the
       right side of the neck, in dark ink. Faded slightly to read as
       older ink. -->
  <!-- Twin eagle heads. -->
  <path d="M 72 96 L 71 93 L 72 91.5 L 73 93 Z M 74 96 L 73 93 L 74 91.5 L 75 93 Z" fill="#1a0804" opacity="0.78"/>
  <!-- Beaks. -->
  <path d="M 71.5 92 L 70 91 L 71.5 91.2 Z" fill="#1a0804" opacity="0.78"/>
  <path d="M 73.5 92 L 75 91 L 73.5 91.2 Z" fill="#1a0804" opacity="0.78"/>
  <!-- Wings spread horizontally beneath the heads. -->
  <path d="M 67 97 L 72 95.5 L 77 97 L 76 98.5 L 72 97.5 L 68 98.5 Z" fill="#1a0804" opacity="0.78"/>
  <!-- Body + tail. -->
  <path d="M 72 97 L 73 97 L 74 100.5 L 72.5 101.5 L 71 100.5 Z" fill="#1a0804" opacity="0.78"/>
  <!-- Small motto dash beneath the sigil. -->
  <line x1="70" y1="103" x2="76" y2="103" stroke="#1a0804" stroke-width="0.5" opacity="0.6"/>

  <!-- Small ear hint (left side, peeks out from head shape). -->
  <ellipse cx="43" cy="66" rx="2" ry="4" fill="url(#brannock-skin)" stroke="#5a3020" stroke-width="0.4"/>
  <!-- Ear interior detail. -->
  <path d="M 43 64 Q 44 66 43 68" stroke="#5a3020" stroke-width="0.4" fill="none"/>

  <!-- Name label. -->
  <text x="64" y="122" text-anchor="middle" font-family="system-ui" font-size="8" fill="#e8c488" font-weight="bold">BRANNOCK · Warden</text>
</svg>
