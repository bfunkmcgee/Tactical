<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="g-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9aa054"/><stop offset="1" stop-color="#4a5028"/>
    </linearGradient>
    <linearGradient id="g-skin-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a7038"/><stop offset="1" stop-color="#2a3018"/>
    </linearGradient>
    <linearGradient id="g-rust" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a5028"/><stop offset="1" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="g-rust-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c87030"/><stop offset="1" stop-color="#4a2410"/>
    </linearGradient>
    <linearGradient id="g-rag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a5838"/><stop offset="1" stop-color="#2a2010"/>
    </linearGradient>
    <linearGradient id="g-metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a4a4e"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <radialGradient id="g-eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset=".5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#8a3010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="48" cy="120" rx="20" ry="3.5" fill="#000" opacity=".55"/>

  <!-- SHORT HUNCHED STANCE: legs are short + bent -->
  <!-- legs (skin showing, knobby) -->
  <path d="M38 86 Q36 108 42 114 L46 114 L47 86 Z" fill="url(#g-skin)"/>
  <path d="M58 86 Q60 108 54 114 L50 114 L49 86 Z" fill="url(#g-skin)"/>
  <!-- shin wraps (dirty rags) -->
  <path d="M38 96 L47 96 L47 108 L38 108 Z" fill="url(#g-rag)"/>
  <path d="M58 96 L49 96 L49 108 L58 108 Z" fill="url(#g-rag)"/>
  <path d="M39 99 L46 99 M39 103 L46 103 M39 107 L46 107" stroke="#2a2010" stroke-width="0.4"/>
  <path d="M50 99 L57 99 M50 103 L57 103 M50 107 L57 107" stroke="#2a2010" stroke-width="0.4"/>
  <!-- bare feet with toe claws -->
  <path d="M36 112 L48 112 L48 118 L38 118 Z" fill="url(#g-skin-dark)"/>
  <path d="M60 112 L48 112 L48 118 L58 118 Z" fill="url(#g-skin-dark)"/>
  <path d="M37 118 L36 121 L39 121 Z" fill="#e8ddc0"/>
  <path d="M41 118 L40 121 L43 121 Z" fill="#e8ddc0"/>
  <path d="M45 118 L44 121 L47 121 Z" fill="#e8ddc0"/>
  <path d="M49 118 L48 121 L51 121 Z" fill="#e8ddc0"/>
  <path d="M53 118 L52 121 L55 121 Z" fill="#e8ddc0"/>
  <path d="M57 118 L56 121 L59 121 Z" fill="#e8ddc0"/>

  <!-- TATTERED LOINCLOTH -->
  <path d="M32 80 L64 80 L66 98 L30 98 Z" fill="url(#g-rag)"/>
  <path d="M30 98 L34 94 L38 98 L42 94 L46 98 L50 94 L54 98 L58 94 L62 98 L66 98" fill="none" stroke="#1a1410" stroke-width="0.5"/>
  <path d="M34 84 L62 84 M34 90 L62 90" stroke="#2a2010" stroke-width="0.3" opacity=".6"/>
  <!-- belt -->
  <path d="M28 78 L68 78 L68 84 L28 84 Z" fill="#1a1410"/>
  <rect x="44" y="77" width="8" height="8" fill="url(#g-rust)"/>
  <!-- hanging bell (choir motif) -->
  <path d="M34 84 L34 90" stroke="#2a2010" stroke-width="0.5"/>
  <path d="M31 90 L37 90 L36 95 L32 95 Z" fill="url(#g-rust-hl)"/>
  <path d="M33 95 L35 97" stroke="#2a1408" stroke-width="0.5"/>
  <!-- bandolier of scrap bullets -->
  <path d="M26 42 L72 60" stroke="#2a2010" stroke-width="3"/>
  <rect x="30" y="44" width="2.5" height="4" fill="#8a6030"/>
  <rect x="30" y="44" width="2.5" height="1" fill="#c8a868"/>
  <rect x="36" y="47" width="2.5" height="4" fill="#8a6030"/>
  <rect x="36" y="47" width="2.5" height="1" fill="#c8a868"/>
  <rect x="42" y="50" width="2.5" height="4" fill="#8a6030"/>
  <rect x="42" y="50" width="2.5" height="1" fill="#c8a868"/>
  <rect x="54" y="54" width="2.5" height="4" fill="#8a6030"/>
  <rect x="54" y="54" width="2.5" height="1" fill="#c8a868"/>
  <rect x="60" y="56" width="2.5" height="4" fill="#8a6030"/>
  <rect x="60" y="56" width="2.5" height="1" fill="#c8a868"/>

  <!-- TORSO: scrawny green body visible underneath scrap plate -->
  <path d="M28 44 Q28 40 32 40 L62 40 Q66 40 66 44 L66 78 Q66 82 62 82 L32 82 Q28 82 28 78 Z" fill="url(#g-skin)"/>
  <!-- ribs hint -->
  <path d="M34 58 Q40 60 46 58" fill="none" stroke="#2a3018" stroke-width="0.4" opacity=".7"/>
  <path d="M50 58 Q56 60 62 58" fill="none" stroke="#2a3018" stroke-width="0.4" opacity=".7"/>
  <!-- ASYMMETRIC SCRAP CHEST PLATE (only covers half chest) -->
  <path d="M30 44 L48 44 L52 60 L48 70 L30 66 Z" fill="url(#g-rust)"/>
  <!-- plate rivets -->
  <circle cx="32" cy="46" r="0.8" fill="#c87030"/>
  <circle cx="46" cy="46" r="0.8" fill="#c87030"/>
  <circle cx="32" cy="64" r="0.8" fill="#c87030"/>
  <circle cx="48" cy="64" r="0.8" fill="#c87030"/>
  <!-- scratched rust pitting -->
  <path d="M34 50 L38 54" stroke="#2a1408" stroke-width="0.4"/>
  <path d="M38 60 L44 62" stroke="#2a1408" stroke-width="0.4"/>
  <path d="M36 56 Q38 58 36 60" fill="none" stroke="#c87030" stroke-width="0.3"/>
  <!-- crudely painted choir sigil (jagged hymn lines) -->
  <path d="M34 52 L38 50 L42 52 L44 50" fill="none" stroke="#c87030" stroke-width="0.6"/>
  <path d="M34 56 L42 56" stroke="#c87030" stroke-width="0.4"/>
  <!-- scrap strap holding plate -->
  <path d="M28 44 L50 46 L50 48 L28 46 Z" fill="#2a2010"/>

  <!-- ONE ASYMMETRIC SCRAP SHOULDER PAD (on other shoulder) -->
  <path d="M60 38 Q70 38 70 46 L66 50 L60 48 Z" fill="url(#g-rust)"/>
  <circle cx="63" cy="42" r="0.8" fill="#c87030"/>
  <circle cx="67" cy="42" r="0.8" fill="#c87030"/>
  <path d="M62 44 L66 46" stroke="#2a1408" stroke-width="0.3"/>
  <!-- little rusty horn/bell on shoulder (choir) -->
  <path d="M68 38 L72 30 L74 38 Z" fill="url(#g-rust-hl)"/>
  <path d="M71 32 L71 36" stroke="#2a1408" stroke-width="0.4"/>

  <!-- ARMS: long, skinny -->
  <!-- left arm raised (holding gun forestock) -->
  <path d="M26 42 Q20 44 18 50 L24 62 L30 60 L30 44 Z" fill="url(#g-skin)"/>
  <!-- right arm at side (trigger) -->
  <path d="M70 42 Q76 44 78 50 L72 62 L66 60 L66 44 Z" fill="url(#g-skin)"/>
  <!-- muscle shadow -->
  <path d="M22 52 L26 56" stroke="#2a3018" stroke-width="0.4" opacity=".7"/>
  <path d="M74 52 L70 56" stroke="#2a3018" stroke-width="0.4" opacity=".7"/>
  <!-- bicep rope wraps -->
  <path d="M22 48 L28 50" stroke="#2a2010" stroke-width="1"/>
  <path d="M74 48 L68 50" stroke="#2a2010" stroke-width="1"/>
  <!-- clawed hands -->
  <path d="M20 60 Q18 66 22 68 L28 66 Q30 62 28 60 Z" fill="url(#g-skin-dark)"/>
  <path d="M76 60 Q78 66 74 68 L68 66 Q66 62 68 60 Z" fill="url(#g-skin-dark)"/>
  <!-- finger claws -->
  <path d="M22 68 L21 71 L23 71 Z" fill="#e8ddc0"/>
  <path d="M26 68 L25 71 L27 71 Z" fill="#e8ddc0"/>
  <path d="M74 68 L75 71 L73 71 Z" fill="#e8ddc0"/>
  <path d="M70 68 L71 71 L69 71 Z" fill="#e8ddc0"/>

  <!-- HEAD (big relative to body) -->
  <ellipse cx="48" cy="26" rx="14" ry="12" fill="url(#g-skin)"/>
  <!-- jaw/chin -->
  <path d="M40 30 Q48 38 56 30 L56 34 Q48 40 40 34 Z" fill="url(#g-skin-dark)"/>
  <!-- BIG POINTED EARS -->
  <path d="M34 22 L26 18 L30 28 L36 26 Z" fill="url(#g-skin)"/>
  <path d="M62 22 L70 18 L66 28 L60 26 Z" fill="url(#g-skin)"/>
  <path d="M28 20 L32 24" stroke="#2a3018" stroke-width="0.3"/>
  <path d="M68 20 L64 24" stroke="#2a3018" stroke-width="0.3"/>
  <!-- hooked nose -->
  <path d="M48 26 L46 32 L50 32 Z" fill="url(#g-skin-dark)"/>
  <!-- eye sockets (deep) -->
  <ellipse cx="42" cy="25" rx="3" ry="2" fill="#1a1a0c"/>
  <ellipse cx="54" cy="25" rx="3" ry="2" fill="#1a1a0c"/>
  <!-- glowing ember eyes -->
  <circle cx="42" cy="25" r="1.6" fill="url(#g-eye)"/>
  <circle cx="54" cy="25" r="1.6" fill="url(#g-eye)"/>
  <circle cx="42" cy="25" r="0.8" fill="#fff4c0"/>
  <circle cx="54" cy="25" r="0.8" fill="#fff4c0"/>
  <!-- sneer / teeth -->
  <path d="M42 33 L54 33" stroke="#1a1a0c" stroke-width="0.8"/>
  <path d="M43 33 L43 36 M46 33 L46 36 M49 33 L49 36 M52 33 L52 36" stroke="#e8ddc0" stroke-width="0.6"/>
  <!-- crooked tusks -->
  <path d="M44 34 L43 38 L46 36 Z" fill="#e8ddc0"/>
  <path d="M52 34 L53 38 L50 36 Z" fill="#e8ddc0"/>
  <!-- brow furrow -->
  <path d="M38 20 L46 22" stroke="#2a3018" stroke-width="1.3"/>
  <path d="M50 22 L58 20" stroke="#2a3018" stroke-width="1.3"/>
  <!-- scars on face -->
  <path d="M40 28 L44 30" stroke="#2a1408" stroke-width="0.5"/>

  <!-- SCRAP KETTLE HELMET (dented pot) -->
  <path d="M34 8 Q36 4 48 3 Q60 4 62 8 L64 18 L32 18 Z" fill="url(#g-metal)"/>
  <!-- helmet rim -->
  <path d="M32 18 L64 18" stroke="#0a0a0c" stroke-width="1"/>
  <!-- rivets -->
  <circle cx="36" cy="16" r="0.8" fill="#c87030"/>
  <circle cx="60" cy="16" r="0.8" fill="#c87030"/>
  <circle cx="42" cy="10" r="0.6" fill="#c87030"/>
  <circle cx="54" cy="10" r="0.6" fill="#c87030"/>
  <!-- DENTS -->
  <path d="M38 8 Q40 10 42 8" fill="none" stroke="#0a0a0c" stroke-width="0.8"/>
  <path d="M52 12 Q54 14 56 12" fill="none" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- rust streaks -->
  <path d="M36 6 L38 14" stroke="url(#g-rust-hl)" stroke-width="0.5"/>
  <path d="M56 6 L58 14" stroke="url(#g-rust-hl)" stroke-width="0.5"/>
  <!-- helmet ear-hole cut-outs -->
  <path d="M32 14 L34 18 L36 14 Z" fill="#1b2331"/>
  <path d="M64 14 L62 18 L60 14 Z" fill="#1b2331"/>
  <!-- crude scrap horn poking off top -->
  <path d="M44 3 L46 -4 L48 2 Z" fill="url(#g-rust)"/>
  <path d="M54 3 L56 -5 L58 2 Z" fill="url(#g-rust)"/>
  <!-- dangling chain with small bell (choir motif) -->
  <path d="M64 16 Q68 20 70 26" stroke="#2a2010" stroke-width="0.6" fill="none"/>
  <path d="M68 26 L72 26 L71 30 L69 30 Z" fill="url(#g-rust-hl)"/>
  <path d="M70 30 L70 32" stroke="#2a1408" stroke-width="0.4"/>

  <!-- SCRAP PIPE-GUN / BLUNDERBUSS (crude, held across body) -->
  <!-- stock (rough wood) -->
  <path d="M4 58 L14 58 L14 66 L4 68 Z" fill="#4a2810"/>
  <path d="M6 60 L12 60 M6 64 L12 64" stroke="#2a1408" stroke-width="0.3"/>
  <!-- receiver (welded box) -->
  <path d="M14 58 L38 58 L38 68 L14 68 Z" fill="url(#g-rust)"/>
  <!-- patch plates bolted on -->
  <rect x="18" y="56" width="8" height="4" fill="url(#g-rust-hl)"/>
  <rect x="28" y="58" width="8" height="6" fill="url(#g-metal)"/>
  <circle cx="20" cy="58" r="0.7" fill="#c87030"/>
  <circle cx="24" cy="58" r="0.7" fill="#c87030"/>
  <circle cx="30" cy="60" r="0.6" fill="#c87030"/>
  <circle cx="34" cy="60" r="0.6" fill="#c87030"/>
  <!-- crooked makeshift sight -->
  <rect x="22" y="54" width="2" height="4" fill="#2a1408"/>
  <!-- grip -->
  <path d="M32 68 L38 68 L38 76 L34 78 Z" fill="#4a2810"/>
  <!-- trigger (exposed) -->
  <path d="M32 68 L34 72" stroke="#2a1408" stroke-width="0.8"/>
  <!-- wide flared barrel (blunderbuss) -->
  <path d="M38 60 L60 60 L60 66 L38 66 Z" fill="url(#g-rust)"/>
  <path d="M60 56 L68 58 L68 68 L60 70 Z" fill="url(#g-rust)"/>
  <!-- rust streaks on barrel -->
  <path d="M42 62 L56 62" stroke="#c87030" stroke-width="0.3" opacity=".7"/>
  <path d="M42 64 L56 64" stroke="#2a1408" stroke-width="0.3" opacity=".7"/>
  <!-- duct tape wrapping -->
  <rect x="44" y="58" width="6" height="10" fill="#2a2010"/>
  <!-- muzzle - crude flared scrap -->
  <path d="M68 54 L76 56 L76 72 L68 74 Z" fill="#2a1408"/>
  <path d="M70 58 L74 58 M70 62 L74 62 M70 66 L74 66 M70 70 L74 70" stroke="#c87030" stroke-width="0.3"/>
  <!-- muzzle residue (smoke/ember glow from scrap ammo) -->
  <circle cx="78" cy="64" r="3" fill="url(#g-eye)" opacity=".7"/>
  <circle cx="78" cy="64" r="1.2" fill="#fff4c0"/>
</svg>
