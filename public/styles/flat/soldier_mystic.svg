  <path d="M36 46 Q48 50 60 46" fill="none" stroke="#7a6e52" stroke-width="0.4"/>
  <!-- fae trim on scarf -->
  <path d="M34 38 L62 38" stroke="#c79aff" stroke-width="0.4" opacity=".6"/>

