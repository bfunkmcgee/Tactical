  <path d="M22 46 L23 47 L22 48 L21 47 Z" fill="#7cc4ff"/>
  <circle cx="74" cy="47" r="1.2" fill="#3a3020"/>
  <path d="M74 46 L75 47 L74 48 L73 47 Z" fill="#7cc4ff"/>

  <!-- FUR MANTLE (lighter, more elegant) -->
  <path d="M14 30 Q16 36 22 38 L34 36 Q40 34 48 34 Q56 34 62 36 L74 38 Q80 36 82 30
           Q80 26 70 26 Q60 28 48 28 Q36 28 26 26 Q16 26 14 30 Z" fill="url(#m-fur)"/>
  <path d="M14 30 L16 34 L18 30 L20 34 L22 30 L24 34 L26 30 L28 34 L30 30 L32 34 L34 30
           L36 34 L38 30 L40 34 L42 30 L44 34 L46 30 L48 34 L50 30 L52 34 L54 30 L56 34
           L58 30 L60 34 L62 30 L64 34 L66 30 L68 34 L70 30 L72 34 L74 30 L76 34 L78 30 L80 34 L82 30"
        fill="none" stroke="#2a2414" stroke-width="0.6"/>
  <path d="M20 34 Q48 38 76 34" fill="none" stroke="#4a3e28" stroke-width="1"/>

  <!-- SCARF (longer drape, ceremonial) -->
