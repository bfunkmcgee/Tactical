  <path d="M46 22 L50 22 L50 26 L46 26 Z" fill="url(#m-bone-dark)"/>
  <path d="M48 22 L48 26" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- cheek engraving (delicate curls) -->
  <path d="M36 28 Q38 30 40 29 Q42 27 44 28" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M60 28 Q58 30 56 29 Q54 27 52 28" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- mouth vent (narrow) -->
  <path d="M44 30 L52 30 L51 34 L45 34 Z" fill="#1a1410"/>
  <rect x="45" y="31" width="6" height="0.4" fill="#3a3228"/>
  <rect x="45" y="32.5" width="6" height="0.4" fill="#3a3228"/>
  <!-- chin point -->
  <path d="M45 34 L48 38 L51 34 Z" fill="url(#m-bone-dark)"/>
  <!-- crown/circlet arc above mask -->
  <path d="M36 6 Q48 0 60 6" fill="none" stroke="#c79aff" stroke-width="0.8"/>
  <circle cx="48" cy="2" r="1.4" fill="#c79aff"/>
  <circle cx="48" cy="2" r="0.6" fill="#fff0ff"/>
  <circle cx="42" cy="4" r="0.7" fill="#c79aff"/>
  <circle cx="54" cy="4" r="0.7" fill="#c79aff"/>
  <!-- mask weathering (light) -->
  <path d="M34 20 L32 24" stroke="#6a5a40" stroke-width="0.3" opacity=".5"/>
  <path d="M62 20 L64 24" stroke="#6a5a40" stroke-width="0.3" opacity=".5"/>

  <!-- ARMS: undersuit + slim bone bracers -->
  <path d="M20 44 Q18 46 18 48 L16 68 Q18 72 22 72 L26 70 L26 40 Z" fill="url(#m-under)"/>
  <path d="M76 44 Q78 46 78 48 L80 68 Q78 72 74 72 L70 70 L70 40 Z" fill="url(#m-under)"/>
  <!-- upper arm plate -->
  <path d="M18 48 L26 48 L26 54 L18 54 Z" fill="url(#m-bone)"/>
  <path d="M78 48 L70 48 L70 54 L78 54 Z" fill="url(#m-bone)"/>
  <!-- forearm bracer (ornate) -->
  <path d="M16 60 L26 60 L26 70 L16 70 Z" fill="url(#m-bone)"/>
  <path d="M80 60 L70 60 L70 70 L80 70 Z" fill="url(#m-bone)"/>
  <path d="M18 62 L24 62 M18 68 L24 68" stroke="#6a5a40" stroke-width="0.3"/>
  <path d="M72 62 L78 62 M72 68 L78 68" stroke="#6a5a40" stroke-width="0.3"/>
  <!-- fae trim on bracer -->
  <path d="M19 65 L25 65" stroke="#c79aff" stroke-width="0.4" opacity=".7"/>
  <path d="M71 65 L77 65" stroke="#c79aff" stroke-width="0.4" opacity=".7"/>
  <!-- gloves (dark) -->
  <path d="M14 70 Q12 74 16 78 L22 78 Q24 74 22 70 Z" fill="#0a0806"/>
  <path d="M82 70 Q84 74 80 78 L74 78 Q72 74 74 70 Z" fill="#0a0806"/>

  <!-- ARCLIGHT MARKSMAN (dark tactical sniper with suppressor) -->
  <path d="M4 66 L16 64 L18 76 L4 78 Z" fill="url(#m-gun)"/>
  <path d="M6 68 L14 67 M6 74 L14 73" stroke="#0a0806" stroke-width="0.4"/>
  <path d="M8 62 L16 61 L16 66 L8 66 Z" fill="#1a1410"/>
  <path d="M16 66 L56 64 L56 76 L16 76 Z" fill="url(#m-gun)"/>
  <rect x="20" y="62" width="36" height="2" fill="#0a0806"/>
  <path d="M22 62 L22 64 M26 62 L26 64 M30 62 L30 64 M34 62 L34 64 M38 62 L38 64 M42 62 L42 64 M46 62 L46 64 M50 62 L50 64 M54 62 L54 64" stroke="#1a1410" stroke-width="0.4"/>
  <!-- large scope -->
  <rect x="28" y="54" width="20" height="8" rx="1.2" fill="#141210"/>
  <rect x="24" y="56" width="4" height="4" rx="0.8" fill="#0a0806"/>
  <rect x="48" y="56" width="4" height="4" rx="0.8" fill="#0a0806"/>
  <circle cx="38" cy="58" r="3" fill="#0a0806"/>
  <circle cx="38" cy="58" r="2" fill="#7cc4ff"/>
  <circle cx="38" cy="58" r="0.7" fill="#eaf6ff"/>
  <!-- scope turrets -->
  <rect x="34" y="51" width="2" height="4" fill="#0a0806"/>
  <rect x="40" y="51" width="2" height="4" fill="#0a0806"/>
  <!-- magazine -->
  <path d="M30 76 L40 76 L39 88 L31 88 Z" fill="#141210"/>
  <!-- trigger guard -->
  <path d="M40 76 Q44 80 48 76" fill="none" stroke="#0a0806" stroke-width="1.4"/>
  <!-- grip -->
  <path d="M46 76 L52 76 L52 86 L48 88 Z" fill="#141210"/>
  <!-- bipod -->
  <path d="M52 76 L50 86 L54 84" fill="none" stroke="#0a0806" stroke-width="1"/>
  <!-- barrel with COILED rune wrap + suppressor -->
  <rect x="56" y="68" width="18" height="3" fill="url(#m-gun)"/>
  <path d="M58 68 Q60 66 62 68 Q64 70 66 68 Q68 66 70 68 Q72 70 74 68" fill="none" stroke="#7cc4ff" stroke-width="0.7"/>
  <!-- suppressor -->
  <rect x="74" y="66" width="14" height="6" rx="1" fill="#141210"/>
  <path d="M76 67 L86 67 M76 69 L86 69 M76 71 L86 71" stroke="#0a0806" stroke-width="0.3"/>
  <!-- muzzle rune -->
  <circle cx="88" cy="69" r="4" fill="url(#m-rune)"/>
  <circle cx="88" cy="69" r="1.6" fill="#eaf6ff"/>
  <!-- lightning arc from muzzle -->
  <path d="M86 65 L88 68 L86 70 L88 72" fill="none" stroke="#eaf6ff" stroke-width="0.6"/>

  <!-- FLOATING WISPS -->
  <circle cx="14" cy="18" r="2" fill="url(#m-fae)" opacity=".7"/>
  <circle cx="14" cy="18" r="0.7" fill="#fff0ff"/>
  <circle cx="82" cy="14" r="1.6" fill="url(#m-fae)" opacity=".6"/>
  <circle cx="82" cy="14" r="0.6" fill="#fff0ff"/>
  <circle cx="84" cy="40" r="1.2" fill="url(#m-fae)" opacity=".5"/>
</svg>
