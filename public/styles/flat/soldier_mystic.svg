<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="m-bone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4eee0"/><stop offset="1" stop-color="#8a7e66"/>
    </linearGradient>
    <linearGradient id="m-bone-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8ad95"/><stop offset="1" stop-color="#4a3e28"/>
    </linearGradient>
    <linearGradient id="m-fur" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d4c8b0"/><stop offset="1" stop-color="#3a3020"/>
    </linearGradient>
    <linearGradient id="m-scarf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ece4c8"/><stop offset="1" stop-color="#7a6e52"/>
    </linearGradient>
    <linearGradient id="m-under" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a251e"/><stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="m-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2224"/><stop offset="1" stop-color="#080608"/>
    </linearGradient>
    <radialGradient id="m-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-fae" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset=".5" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#3a1a55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="118" rx="22" ry="4" fill="#000" opacity=".5"/>
  <ellipse cx="48" cy="50" rx="28" ry="32" fill="#3a1a55" opacity=".08"/>

  <!-- FLOWING CLOAK (longer than Ranger, reaches the ground, trailing) -->
  <path d="M14 36 Q10 58 8 96 Q10 122 20 122 L30 118 L32 80 L32 34 Q22 30 18 32 Q14 34 14 36 Z" fill="url(#m-fur)"/>
  <path d="M82 36 Q86 58 88 96 Q86 122 76 122 L66 118 L64 80 L64 34 Q74 30 78 32 Q82 34 82 36 Z" fill="url(#m-fur)"/>
  <!-- center back panel -->
  <path d="M32 40 L64 40 L66 118 L30 118 Z" fill="url(#m-bone-dark)" opacity=".4"/>
  <!-- cloak tattered hem (pointed, ornate) -->
  <path d="M8 112 L10 122 L14 116 L18 124 L22 116 L26 122 L30 118 L30 126 L8 126 Z" fill="#1b2331"/>
  <path d="M66 118 L66 126 L88 126 L88 112 L86 122 L82 116 L78 124 L74 116 L70 122 Z" fill="#1b2331"/>
  <!-- cloak fold lines -->
  <path d="M16 42 Q14 80 12 118" fill="none" stroke="#2a2414" stroke-width="0.8"/>
  <path d="M80 42 Q82 80 84 118" fill="none" stroke="#2a2414" stroke-width="0.8"/>
  <!-- fae trim along cloak edge -->
  <path d="M30 42 Q28 80 28 118" fill="none" stroke="#c79aff" stroke-width="0.5" opacity=".6"/>
  <path d="M66 42 Q68 80 68 118" fill="none" stroke="#c79aff" stroke-width="0.5" opacity=".6"/>

