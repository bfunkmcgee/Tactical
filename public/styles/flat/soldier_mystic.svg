  <path d="M28 40 L68 40 Q70 40 70 42 L70 56 L48 60 L26 56 L26 42 Q26 40 28 40 Z" fill="url(#m-bone)"/>
  <!-- lower plate with V cinch -->
  <path d="M28 56 L68 56 L68 68 L48 74 L28 68 Z" fill="url(#m-bone)"/>
  <!-- plate edge shadow -->
  <path d="M26 56 L70 56" stroke="#6a5a40" stroke-width="0.6"/>
  <!-- ORNATE filigree crown sigil (more delicate than Warden's) -->
  <path d="M40 46 Q44 42 48 44 Q52 42 56 46 L54 52 L42 52 Z" fill="none" stroke="#5a4a30" stroke-width="0.6"/>
  <path d="M44 44 L44 50 M48 44 L48 50 M52 44 L52 50" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M42 52 Q48 54 54 52" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- fae violet gem in sigil center -->
  <circle cx="48" cy="48" r="1.4" fill="#c79aff"/>
  <circle cx="48" cy="48" r="0.7" fill="#fff0ff"/>
  <!-- filigree on lower plate -->
  <path d="M34 60 Q48 64 62 60" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M36 64 Q48 68 60 64" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M40 68 Q48 70 56 68" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- fae swirl details -->
  <path d="M32 58 Q30 62 32 66" fill="none" stroke="#c79aff" stroke-width="0.4" opacity=".7"/>
  <path d="M64 58 Q66 62 64 66" fill="none" stroke="#c79aff" stroke-width="0.4" opacity=".7"/>
  <!-- rivets (small, delicate) -->
  <circle cx="30" cy="44" r="0.7" fill="#6a5a40"/>
  <circle cx="66" cy="44" r="0.7" fill="#6a5a40"/>
  <circle cx="30" cy="54" r="0.7" fill="#6a5a40"/>
  <circle cx="66" cy="54" r="0.7" fill="#6a5a40"/>
  <circle cx="32" cy="66" r="0.7" fill="#6a5a40"/>
  <circle cx="64" cy="66" r="0.7" fill="#6a5a40"/>
