<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="m-coat" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a3a7a"/><stop offset="1" stop-color="#1f0f3a"/>
    </linearGradient>
    <linearGradient id="m-coat-inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a1f5a"/><stop offset="1" stop-color="#0f0420"/>
    </linearGradient>
    <linearGradient id="m-silver" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8e0f0"/><stop offset="1" stop-color="#8a80a0"/>
    </linearGradient>
    <linearGradient id="m-tights" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a1a48"/><stop offset="1" stop-color="#0a0418"/>
    </linearGradient>
    <linearGradient id="m-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ebd4c0"/><stop offset="1" stop-color="#b89080"/>
    </linearGradient>
    <linearGradient id="m-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#0a0812"/>
    </linearGradient>
    <radialGradient id="m-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-fae" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset=".5" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#3a1a55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="118" rx="22" ry="4" fill="#000" opacity=".45"/>
  <ellipse cx="48" cy="50" rx="30" ry="34" fill="#3a1a55" opacity=".12"/>

  <!-- BACK COAT SKIRT (flares out below waist) -->
  <path d="M24 68 Q14 90 12 112 L16 116 L30 110 L32 80 Z" fill="url(#m-coat)"/>
  <path d="M72 68 Q82 90 84 112 L80 116 L66 110 L64 80 Z" fill="url(#m-coat)"/>
  <!-- coat center back panel -->
  <path d="M32 70 L64 70 L66 114 L30 114 Z" fill="url(#m-coat-inner)"/>
  <!-- coat skirt folds -->
  <path d="M40 72 L38 114" stroke="#1a0a2a" stroke-width="0.8"/>
  <path d="M48 72 L48 114" stroke="#1a0a2a" stroke-width="0.8"/>
  <path d="M56 72 L58 114" stroke="#1a0a2a" stroke-width="0.8"/>
  <!-- trim on skirt -->
  <path d="M16 116 L30 110 L66 110 L80 116 L80 118 L16 118 Z" fill="#8a5fb8"/>
  <path d="M16 116 L30 110 L66 110 L80 116" fill="none" stroke="#e8e0f0" stroke-width="0.5"/>
  <!-- pointed hem tips -->
  <path d="M20 116 L22 122 L24 116 Z" fill="url(#m-coat-inner)"/>
  <path d="M40 116 L42 122 L44 116 Z" fill="url(#m-coat-inner)"/>
  <path d="M52 116 L54 122 L56 116 Z" fill="url(#m-coat-inner)"/>
  <path d="M72 116 L74 122 L76 116 Z" fill="url(#m-coat-inner)"/>

  <!-- LEGS: dark tights -->
  <path d="M38 78 Q37 108 40 112 L46 112 L47 78 Z" fill="url(#m-tights)"/>
  <path d="M58 78 Q59 108 56 112 L50 112 L49 78 Z" fill="url(#m-tights)"/>
  <!-- Swiftstep greaves (light silver) -->
  <path d="M37 94 L47 94 L46 110 L39 110 Z" fill="url(#m-silver)"/>
  <path d="M59 94 L49 94 L50 110 L57 110 Z" fill="url(#m-silver)"/>
  <!-- greave fae gems -->
  <path d="M42 98 L44 100 L42 102 L40 100 Z" fill="#c79aff"/>
  <path d="M54 98 L52 100 L54 102 L56 100 Z" fill="#c79aff"/>
  <!-- greave filigree -->
  <path d="M39 96 L45 96 M39 108 L45 108" stroke="#5a527a" stroke-width="0.5"/>
  <path d="M51 96 L57 96 M51 108 L57 108" stroke="#5a527a" stroke-width="0.5"/>
  <!-- elvish boots (pointed) -->
  <path d="M37 108 Q36 114 40 114 L47 114 L47 108 Z" fill="#0a0418"/>
  <path d="M59 108 Q60 114 56 114 L49 114 L49 108 Z" fill="#0a0418"/>
  <path d="M45 112 L49 115 L45 115 Z" fill="#0a0418"/>
  <path d="M51 112 L47 115 L51 115 Z" fill="#0a0418"/>

  <!-- BELT with fae charms -->
  <path d="M28 70 L68 70 L68 76 L28 76 Z" fill="#1a0a2a"/>
  <path d="M40 70 L56 70 L56 76 L40 76 Z" fill="#3a1f5a"/>
  <!-- belt buckle sigil -->
  <path d="M44 71 L52 71 L52 75 L44 75 Z" fill="url(#m-silver)"/>
  <path d="M48 72 L50 73 L48 74 L46 73 Z" fill="#c79aff"/>
  <!-- hanging fae charms -->
  <circle cx="34" cy="80" r="1.4" fill="#c79aff"/>
  <path d="M34 81 L34 86" stroke="#8a5fb8" stroke-width="0.5"/>
  <circle cx="34" cy="86" r="0.9" fill="#e8e0f0"/>
  <circle cx="62" cy="80" r="1.4" fill="#c79aff"/>
  <path d="M62 81 L62 86" stroke="#8a5fb8" stroke-width="0.5"/>
  <circle cx="62" cy="86" r="0.9" fill="#e8e0f0"/>

  <!-- TORSO: fitted coat -->
  <path d="M24 38 Q24 34 28 34 L68 34 Q72 34 72 38 L72 70 Q72 74 68 74 L28 74 Q24 74 24 70 Z" fill="url(#m-coat)"/>
  <!-- coat opening (center) -->
  <path d="M44 34 L52 34 L50 74 L46 74 Z" fill="url(#m-coat-inner)"/>
  <!-- undervest visible through opening -->
  <path d="M45 40 L51 40 L50 72 L46 72 Z" fill="#0a0418"/>
  <!-- coat buttons with sigils -->
  <circle cx="40" cy="44" r="1.6" fill="url(#m-silver)"/>
  <circle cx="40" cy="44" r="0.8" fill="#c79aff"/>
  <circle cx="56" cy="44" r="1.6" fill="url(#m-silver)"/>
  <circle cx="56" cy="44" r="0.8" fill="#c79aff"/>
  <circle cx="40" cy="56" r="1.6" fill="url(#m-silver)"/>
  <circle cx="40" cy="56" r="0.8" fill="#c79aff"/>
  <circle cx="56" cy="56" r="1.6" fill="url(#m-silver)"/>
  <circle cx="56" cy="56" r="0.8" fill="#c79aff"/>
  <circle cx="40" cy="68" r="1.6" fill="url(#m-silver)"/>
  <circle cx="40" cy="68" r="0.8" fill="#c79aff"/>
  <circle cx="56" cy="68" r="1.6" fill="url(#m-silver)"/>
  <circle cx="56" cy="68" r="0.8" fill="#c79aff"/>
  <!-- coat trim down center opening -->
  <path d="M43 34 L45 74 M51 34 L49 74" stroke="#8a5fb8" stroke-width="0.6"/>
  <!-- high collar -->
  <path d="M36 34 L60 34 L62 26 L34 26 Z" fill="url(#m-coat)"/>
  <path d="M36 30 L60 30" stroke="#8a5fb8" stroke-width="0.6"/>

  <!-- PAULDRONS (slim, ornamental) -->
  <path d="M20 34 Q18 42 22 46 L28 44 L30 34 Q26 32 22 32 Q20 32 20 34 Z" fill="url(#m-silver)"/>
  <path d="M76 34 Q78 42 74 46 L68 44 L66 34 Q70 32 74 32 Q76 32 76 34 Z" fill="url(#m-silver)"/>
  <!-- pauldron fae gem -->
  <path d="M24 38 L27 41 L24 44 L21 41 Z" fill="#c79aff"/>
  <path d="M24 40 L26 41 L24 42 L22 41 Z" fill="#fff0ff"/>
  <path d="M72 38 L69 41 L72 44 L75 41 Z" fill="#c79aff"/>
  <path d="M72 40 L70 41 L72 42 L74 41 Z" fill="#fff0ff"/>

  <!-- NECK -->
  <rect x="43" y="22" width="10" height="6" fill="#b89080"/>

  <!-- HEAD -->
  <ellipse cx="48" cy="18" rx="11" ry="12" fill="url(#m-skin)"/>
  <!-- jawline highlight (delicate) -->
  <path d="M40 18 Q48 26 56 18 L56 20 Q48 28 40 20 Z" fill="#c89a80" opacity=".3"/>
  <!-- lips -->
  <path d="M45 22 Q48 24 51 22" stroke="#8a5a4a" stroke-width="0.8" fill="none"/>
  <!-- subtle blush -->
  <ellipse cx="41" cy="20" rx="1.8" ry="1" fill="#d89888" opacity=".5"/>
  <ellipse cx="55" cy="20" rx="1.8" ry="1" fill="#d89888" opacity=".5"/>
  <!-- right eye (open) -->
  <ellipse cx="53" cy="16" rx="2.2" ry="1.6" fill="#eaf6ff"/>
  <circle cx="53.5" cy="16" r="1.2" fill="#5a3a7a"/>
  <circle cx="53.8" cy="15.7" r="0.4" fill="#fff"/>
  <!-- left eye covered by ocular monocle -->
  <circle cx="43" cy="16" r="4" fill="#0a0418"/>
  <circle cx="43" cy="16" r="3" fill="url(#m-fae)"/>
  <circle cx="43" cy="16" r="1.2" fill="#fff0ff"/>
  <path d="M39 12 L38 10 M47 12 L48 10" stroke="#8a5fb8" stroke-width="0.6"/>
  <!-- monocle strap -->
  <path d="M47 16 Q54 14 58 10" stroke="#3a1f5a" stroke-width="0.8" fill="none"/>
  <!-- brow -->
  <path d="M50 13 L56 13" stroke="#4a3050" stroke-width="0.8" stroke-linecap="round"/>
  <!-- pointed ear -->
  <path d="M37 18 L33 16 L37 22 Z" fill="url(#m-skin)"/>

  <!-- HAIR: silver braid swept to one side -->
  <path d="M36 10 Q32 20 36 28 L40 26 L40 14 Q38 10 36 10 Z" fill="url(#m-silver)"/>
  <path d="M60 10 Q64 20 60 28 L56 26 L56 14 Q58 10 60 10 Z" fill="url(#m-silver)"/>
  <!-- hair top -->
  <path d="M37 10 Q48 2 59 10 L59 14 Q48 8 37 14 Z" fill="url(#m-silver)"/>
  <!-- braid on left side -->
  <path d="M34 22 Q30 30 32 40 Q34 42 36 40 Q38 32 38 24 Z" fill="url(#m-silver)"/>
  <path d="M33 26 L36 28 M32 32 L35 34 M31 38 L34 38" stroke="#5a527a" stroke-width="0.5"/>

  <!-- TIARA / circlet with fae gems -->
  <path d="M38 10 Q48 4 58 10" fill="none" stroke="#c79aff" stroke-width="1"/>
  <circle cx="48" cy="7" r="1.6" fill="#c79aff"/>
  <circle cx="48" cy="7" r="0.7" fill="#fff0ff"/>
  <circle cx="42" cy="9" r="0.8" fill="#c79aff"/>
  <circle cx="54" cy="9" r="0.8" fill="#c79aff"/>

  <!-- ARMS: coat sleeves flaring at wrist -->
  <path d="M20 44 Q18 46 18 48 L16 68 Q18 72 22 72 L26 70 L26 40 Z" fill="url(#m-coat)"/>
  <path d="M76 44 Q78 46 78 48 L80 68 Q78 72 74 72 L70 70 L70 40 Z" fill="url(#m-coat)"/>
  <!-- flared cuffs -->
  <path d="M14 66 L26 66 L28 74 L12 74 Z" fill="url(#m-coat-inner)"/>
  <path d="M82 66 L70 66 L68 74 L84 74 Z" fill="url(#m-coat-inner)"/>
  <path d="M14 66 L26 66" stroke="#8a5fb8" stroke-width="0.6"/>
  <path d="M82 66 L70 66" stroke="#8a5fb8" stroke-width="0.6"/>
  <!-- sleeve trim stripe -->
  <path d="M19 52 L25 52" stroke="#c79aff" stroke-width="0.8"/>
  <path d="M77 52 L71 52" stroke="#c79aff" stroke-width="0.8"/>
  <!-- gloves (slim black leather) -->
  <path d="M14 72 Q12 76 16 78 L22 78 Q24 74 22 72 Z" fill="#0a0418"/>
  <path d="M82 72 Q84 76 80 78 L74 78 Q72 74 74 72 Z" fill="#0a0418"/>

  <!-- ARCLIGHT MARKSMAN: long sniper rifle across body -->
  <!-- stock -->
  <path d="M4 70 L16 68 L18 78 L4 80 Z" fill="url(#m-gun)"/>
  <path d="M6 72 L14 71 M6 76 L14 75" stroke="#1a1020" stroke-width="0.5"/>
  <!-- cheek rest -->
  <path d="M8 66 L16 65 L16 70 L8 70 Z" fill="#2a2236"/>
  <!-- receiver -->
  <path d="M16 70 L56 68 L56 78 L16 78 Z" fill="url(#m-gun)"/>
  <!-- long rail -->
  <rect x="20" y="66" width="34" height="2" fill="#0a0812"/>
  <path d="M22 66 L22 68 M26 66 L26 68 M30 66 L30 68 M34 66 L34 68 M38 66 L38 68 M42 66 L42 68 M46 66 L46 68 M50 66 L50 68" stroke="#3a2618" stroke-width="0.4"/>
  <!-- LARGE SCOPE with sunshade -->
  <rect x="28" y="58" width="20" height="8" rx="1.5" fill="#141a26"/>
  <rect x="24" y="60" width="4" height="4" rx="1" fill="#0a0812"/>
  <rect x="48" y="60" width="4" height="4" rx="1" fill="#0a0812"/>
  <circle cx="38" cy="62" r="3.4" fill="#0d1119"/>
  <circle cx="38" cy="62" r="2.2" fill="#7cc4ff"/>
  <circle cx="38" cy="62" r="0.8" fill="#eaf6ff"/>
  <!-- scope turrets -->
  <rect x="34" y="55" width="2" height="4" fill="#0a0812"/>
  <rect x="40" y="55" width="2" height="4" fill="#0a0812"/>
  <!-- magazine -->
  <path d="M32 78 L40 78 L39 88 L33 88 Z" fill="#141a26"/>
  <path d="M33 80 L39 80" stroke="#3a4556" stroke-width="0.5"/>
  <!-- trigger guard -->
  <path d="M40 78 Q44 82 48 78" fill="none" stroke="#1a0e06" stroke-width="1.4"/>
  <!-- grip -->
  <path d="M46 78 L52 78 L52 86 L48 88 Z" fill="#141a26"/>
  <!-- bipod (folded) -->
  <path d="M52 78 L50 86 L54 84" fill="none" stroke="#0a0812" stroke-width="1"/>
  <!-- LONG barrel with COILS -->
  <rect x="56" y="70" width="30" height="3" fill="url(#m-gun)"/>
  <rect x="56" y="73" width="30" height="1" fill="#0a0812"/>
  <!-- copper coils wound around barrel -->
  <path d="M58 70 Q60 68 62 70 Q64 72 66 70 Q68 68 70 70 Q72 72 74 70 Q76 68 78 70 Q80 72 82 70 Q84 68 86 70" fill="none" stroke="#7cc4ff" stroke-width="0.9"/>
  <path d="M58 73 Q60 75 62 73 Q64 71 66 73 Q68 75 70 73 Q72 71 74 73 Q76 75 78 73 Q80 71 82 73 Q84 75 86 73" fill="none" stroke="#7cc4ff" stroke-width="0.5" opacity=".6"/>
  <!-- front sight -->
  <rect x="62" y="66" width="2" height="4" fill="#0a0812"/>
  <!-- MUZZLE with lightning core -->
  <circle cx="88" cy="72" r="5" fill="url(#m-rune)"/>
  <circle cx="88" cy="72" r="2.4" fill="#eaf6ff"/>
  <!-- lightning arc -->
  <path d="M86 68 L88 70 L86 72 L88 74 L86 76" fill="none" stroke="#eaf6ff" stroke-width="0.7"/>

  <!-- FLOATING WISPS around her -->
  <circle cx="16" cy="30" r="2" fill="url(#m-fae)" opacity=".8"/>
  <circle cx="16" cy="30" r="0.7" fill="#fff0ff"/>
  <circle cx="82" cy="24" r="1.6" fill="url(#m-fae)" opacity=".7"/>
  <circle cx="82" cy="24" r="0.6" fill="#fff0ff"/>
  <circle cx="88" cy="50" r="1.2" fill="url(#m-fae)" opacity=".6"/>
</svg>
