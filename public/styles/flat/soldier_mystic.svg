<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="m-cloak" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a98560"/><stop offset="1" stop-color="#4a3420"/>
    </linearGradient>
    <linearGradient id="m-cloak-inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3420"/><stop offset="1" stop-color="#2a1c10"/>
    </linearGradient>
    <linearGradient id="m-robe" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c6a473"/><stop offset="1" stop-color="#5a3f22"/>
    </linearGradient>
    <linearGradient id="m-robe-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a6a40"/><stop offset="1" stop-color="#3a2614"/>
    </linearGradient>
    <linearGradient id="m-silver" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8e0f0"/><stop offset="1" stop-color="#8a80a0"/>
    </linearGradient>
    <linearGradient id="m-tights" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3a2a"/><stop offset="1" stop-color="#1a1008"/>
    </linearGradient>
    <linearGradient id="m-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ebd4c0"/><stop offset="1" stop-color="#b89080"/>
    </linearGradient>
    <linearGradient id="m-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2236"/><stop offset="1" stop-color="#0a0812"/>
    </linearGradient>
    <radialGradient id="m-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-fae" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset=".5" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#3a1a55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="118" rx="22" ry="4" fill="#000" opacity=".45"/>

