<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="m-plate" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="m-plate-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="m-tan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a88c5c"/><stop offset="1" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="m-tan-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a6038"/><stop offset="1" stop-color="#3a2e18"/>
    </linearGradient>
    <linearGradient id="m-boot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b09060"/><stop offset="1" stop-color="#6a5430"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c488"/><stop offset="1" stop-color="#8a6838"/>
    </linearGradient>
    <linearGradient id="m-fur" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a6e48"/><stop offset="1" stop-color="#2a1e10"/>
    </linearGradient>
    <linearGradient id="m-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d8a878"/><stop offset="1" stop-color="#8a6038"/>
    </linearGradient>
    <linearGradient id="m-scarf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8986a"/><stop offset="1" stop-color="#6a5230"/>
    </linearGradient>
    <linearGradient id="m-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="m-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="120" rx="24" ry="4" fill="#000" opacity=".55"/>

  <!-- LEGS: tan pants + black kneepads -->
  <path d="M34 76 Q32 108 38 114 L46 114 L48 76 Z" fill="url(#m-tan-dark)"/>
  <path d="M62 76 Q64 108 58 114 L50 114 L48 76 Z" fill="url(#m-tan-dark)"/>
  <path d="M36 82 L38 108" stroke="#2a2010" stroke-width="0.5" opacity=".6"/>
  <path d="M58 82 L60 108" stroke="#2a2010" stroke-width="0.5" opacity=".6"/>
  <!-- cargo pockets -->
  <path d="M34 84 L46 84 L46 94 L34 94 Z" fill="#4a3818"/>
  <path d="M62 84 L50 84 L50 94 L62 94 Z" fill="#4a3818"/>
  <!-- BLACK HARD SHELL KNEE PADS -->
  <path d="M34 94 Q40 92 46 94 L46 104 Q40 108 34 106 Z" fill="url(#m-plate)"/>
  <path d="M62 94 Q56 92 50 94 L50 104 Q56 108 62 106 Z" fill="url(#m-plate)"/>
  <path d="M36 96 Q40 94 45 96" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <path d="M60 96 Q56 94 51 96" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <!-- ankle wraps -->
  <path d="M35 106 L47 106 L47 110 L35 110 Z" fill="#2a2010"/>
  <path d="M61 106 L49 106 L49 110 L61 110 Z" fill="#2a2010"/>
  <!-- DESERT BOOTS -->
  <path d="M33 110 Q32 116 36 118 L48 118 L48 110 Z" fill="url(#m-boot)"/>
  <path d="M63 110 Q64 116 60 118 L48 118 L48 110 Z" fill="url(#m-boot)"/>
  <path d="M36 112 L45 112 M36 114 L45 114 M36 116 L45 116" stroke="#3a2818" stroke-width="0.5"/>
  <path d="M51 112 L60 112 M51 114 L60 114 M51 116 L60 116" stroke="#3a2818" stroke-width="0.5"/>

  <!-- BELT + leg holster -->
  <path d="M28 72 L68 72 L68 78 L28 78 Z" fill="#1a1410"/>
  <rect x="45" y="72" width="6" height="6" fill="url(#m-plate-hl)"/>
  <rect x="46.5" y="73.5" width="3" height="3" fill="#c79aff"/>
  <path d="M58 78 L66 78 L66 94 L58 94 Z" fill="url(#m-plate)"/>
  <path d="M60 80 L64 80 L64 90 L60 90 Z" fill="#0a0a0c"/>

  <!-- TORSO: matte black hard-shell plate -->
  <path d="M22 38 Q22 34 26 34 L70 34 Q74 34 74 38 L74 72 Q74 76 70 76 L26 76 Q22 76 22 72 Z" fill="url(#m-plate)"/>
  <path d="M26 34 L70 34 L70 36 L26 36 Z" fill="url(#m-plate-hl)" opacity=".7"/>
  <path d="M22 44 L74 44" stroke="#4a4a50" stroke-width="0.5" opacity=".6"/>
  <path d="M22 60 L74 60" stroke="#4a4a50" stroke-width="0.5" opacity=".6"/>
  <path d="M48 34 L48 76" stroke="#4a4a50" stroke-width="0.4" opacity=".5"/>
  <!-- gold double-headed eagle emblem -->
  <g transform="translate(48 52)">
    <ellipse cx="0" cy="0" rx="2.5" ry="4.5" fill="url(#m-gold)"/>
    <circle cx="-2.5" cy="-4" r="1.6" fill="url(#m-gold)"/>
    <circle cx="2.5" cy="-4" r="1.6" fill="url(#m-gold)"/>
    <path d="M-4 -4.5 L-5 -4 L-4 -3.5 Z" fill="url(#m-gold)"/>
    <path d="M4 -4.5 L5 -4 L4 -3.5 Z" fill="url(#m-gold)"/>
    <path d="M-2 -1 L-8 -2 L-10 1 L-8 3 L-4 2 L-2 3 Z" fill="url(#m-gold)"/>
    <path d="M2 -1 L8 -2 L10 1 L8 3 L4 2 L2 3 Z" fill="url(#m-gold)"/>
    <path d="M-9 0 L-6 0 M-8 2 L-5 2" stroke="#8a6838" stroke-width="0.3"/>
    <path d="M9 0 L6 0 M8 2 L5 2" stroke="#8a6838" stroke-width="0.3"/>
    <path d="M-1 4 L0 6 L1 4 Z" fill="url(#m-gold)"/>
    <path d="M-1 -6 L-1 -5 L0 -6 L1 -5 L1 -6 Z" fill="url(#m-gold)"/>
    <!-- fae violet gem between heads -->
    <circle cx="0" cy="-3.5" r="0.6" fill="#c79aff"/>
  </g>
  <!-- chest rig (tan straps) -->
  <path d="M26 40 L46 40 L46 46 L26 46 Z" fill="url(#m-tan)"/>
  <path d="M50 40 L70 40 L70 46 L50 46 Z" fill="url(#m-tan)"/>
  <rect x="27" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="33" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="39" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="52" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="58" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="64" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="30" y="62" width="6" height="10" rx="0.5" fill="#1a1410"/>
  <rect x="60" y="62" width="6" height="10" rx="0.5" fill="#1a1410"/>

  <!-- PAULDRONS -->
  <path d="M16 34 Q12 46 20 50 L28 46 L28 36 Q22 32 18 32 Q16 32 16 34 Z" fill="url(#m-plate)"/>
  <path d="M80 34 Q84 46 76 50 L68 46 L68 36 Q74 32 78 32 Q80 32 80 34 Z" fill="url(#m-plate)"/>
  <path d="M16 40 Q20 44 26 42" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <path d="M80 40 Q76 44 70 42" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <circle cx="22" cy="44" r="1.6" fill="#0a0a0c"/>
  <path d="M22 43 L21 45 L22 45.5 L23 45 Z" fill="url(#m-gold)"/>
  <circle cx="74" cy="44" r="1.6" fill="#0a0a0c"/>
  <path d="M74 43 L73 45 L74 45.5 L75 45 Z" fill="url(#m-gold)"/>

  <!-- LARGE BROWN FUR MANTLE (defining feature for Mystic - she wears the biggest) -->
  <path d="M6 34 Q10 42 20 44 L28 42 L28 32 Q14 28 8 30 Q4 30 6 34 Z" fill="url(#m-fur)"/>
  <path d="M90 34 Q86 42 76 44 L68 42 L68 32 Q82 28 88 30 Q92 30 90 34 Z" fill="url(#m-fur)"/>
  <!-- fur rear drape -->
  <path d="M14 42 Q10 60 14 78 L22 76 L24 46 Z" fill="url(#m-fur)"/>
  <path d="M82 42 Q86 60 82 78 L74 76 L72 46 Z" fill="url(#m-fur)"/>
  <!-- shaggy fur tufts (many zig-zag edges for texture) -->
  <path d="M6 34 L8 40 L10 34 L12 40 L14 34 L16 40 L18 34 L20 40 L22 34 L24 40 L26 34 L28 40"
        fill="none" stroke="#1a1008" stroke-width="0.5"/>
  <path d="M68 40 L70 34 L72 40 L74 34 L76 40 L78 34 L80 40 L82 34 L84 40 L86 34 L88 40 L90 34"
        fill="none" stroke="#1a1008" stroke-width="0.5"/>
  <!-- fur clumps on drape -->
  <path d="M14 50 L12 54 L14 58 L12 64 L14 68 L12 72 L14 76" fill="none" stroke="#1a1008" stroke-width="0.5"/>
  <path d="M82 50 L84 54 L82 58 L84 64 L82 68 L84 72 L82 76" fill="none" stroke="#1a1008" stroke-width="0.5"/>
  <!-- fur highlights -->
  <path d="M10 36 Q16 40 22 38" fill="none" stroke="#a88658" stroke-width="0.5" opacity=".6"/>
  <path d="M86 36 Q80 40 74 38" fill="none" stroke="#a88658" stroke-width="0.5" opacity=".6"/>

  <!-- DESERT SCARF / shemagh wrapped around neck and face -->
  <!-- front scarf wrap -->
  <path d="M34 28 Q48 26 62 28 L62 38 Q48 44 34 38 Z" fill="url(#m-scarf)"/>
  <!-- scarf covering lower face (up to nose) -->
  <path d="M38 22 Q48 20 58 22 L58 30 L38 30 Z" fill="url(#m-scarf)"/>
  <!-- scarf texture lines -->
  <path d="M36 32 L60 32 M36 34 L60 34 M36 36 L60 36" stroke="#5a4828" stroke-width="0.3" opacity=".5"/>
  <path d="M40 24 L56 24 M40 26 L56 26" stroke="#5a4828" stroke-width="0.3" opacity=".5"/>
  <!-- scarf loose ends -->
  <path d="M34 36 L28 44 L32 46 L36 38 Z" fill="url(#m-scarf)"/>
  <path d="M62 36 L68 44 L64 46 L60 38 Z" fill="url(#m-scarf)"/>

  <!-- HEAD: EXPOSED FACE (main distinguishing feature from reference) -->
  <!-- face (showing above the scarf) -->
  <ellipse cx="48" cy="15" rx="10" ry="10" fill="url(#m-skin)"/>
  <!-- jaw shadow -->
  <path d="M40 18 Q48 24 56 18 L56 20 Q48 26 40 20 Z" fill="#7a4830" opacity=".5"/>
  <!-- eyes (intense, narrow) -->
  <path d="M41 14 Q43 13 45 14" stroke="#1a0e06" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M51 14 Q53 13 55 14" stroke="#1a0e06" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <circle cx="43" cy="14.3" r="0.8" fill="#5a3a7a"/>
  <circle cx="53" cy="14.3" r="0.8" fill="#5a3a7a"/>
  <!-- eye glint -->
  <circle cx="43.5" cy="14" r="0.3" fill="#fff"/>
  <circle cx="53.5" cy="14" r="0.3" fill="#fff"/>
  <!-- brow (sharp) -->
  <path d="M40 11 L46 10" stroke="#2a1a0e" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M50 10 L56 11" stroke="#2a1a0e" stroke-width="1.3" stroke-linecap="round"/>
  <!-- nose bridge -->
  <path d="M48 16 L47 20" stroke="#7a4830" stroke-width="0.5" opacity=".5"/>
  <!-- pointed ear -->
  <path d="M37 14 L34 12 L37 18 Z" fill="url(#m-skin)"/>
  <!-- hair/temple (silver-brown wisps) -->
  <path d="M38 8 Q36 12 38 16" fill="none" stroke="#8a7866" stroke-width="1.5"/>
  <path d="M58 8 Q60 12 58 16" fill="none" stroke="#8a7866" stroke-width="1.5"/>

  <!-- GOGGLES PUSHED UP on forehead (key reference detail) -->
  <rect x="36" y="5" width="24" height="6" rx="1.5" fill="#0a0a0c"/>
  <!-- left lens -->
  <circle cx="42" cy="8" r="2.4" fill="#000"/>
  <circle cx="42" cy="8" r="1.6" fill="#2a4060"/>
  <circle cx="42" cy="7" r="0.5" fill="#c79aff"/>
  <!-- right lens -->
  <circle cx="54" cy="8" r="2.4" fill="#000"/>
  <circle cx="54" cy="8" r="1.6" fill="#2a4060"/>
  <circle cx="54" cy="7" r="0.5" fill="#c79aff"/>
  <!-- goggle strap around head -->
  <path d="M36 8 L32 10 L30 14" stroke="#0a0a0c" stroke-width="1.5" fill="none"/>
  <path d="M60 8 L64 10 L66 14" stroke="#0a0a0c" stroke-width="1.5" fill="none"/>
  <!-- strap elastic highlight -->
  <path d="M33 11 L31 13" stroke="#2a2a2e" stroke-width="0.4"/>
  <path d="M63 11 L65 13" stroke="#2a2a2e" stroke-width="0.4"/>
  <!-- patch on strap -->
  <rect x="45" y="5" width="6" height="3" fill="#2a2a2e"/>
  <path d="M48 6 L47 7.5 L48 8 L49 7.5 Z" fill="url(#m-gold)"/>

  <!-- ARMS: black plate + tan accents -->
  <path d="M18 42 L26 40 L26 54 L18 56 Z" fill="url(#m-plate)"/>
  <path d="M78 42 L70 40 L70 54 L78 56 Z" fill="url(#m-plate)"/>
  <path d="M18 56 L26 54 L26 58 L18 60 Z" fill="url(#m-tan)"/>
  <path d="M78 56 L70 54 L70 58 L78 60 Z" fill="url(#m-tan)"/>
  <path d="M16 58 L26 58 L26 72 L18 72 Z" fill="url(#m-plate)"/>
  <path d="M80 58 L70 58 L70 72 L78 72 Z" fill="url(#m-plate)"/>
  <path d="M18 62 L24 62 M18 68 L24 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <path d="M72 62 L78 62 M72 68 L78 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <!-- tactical gloves -->
  <path d="M14 72 Q12 76 16 78 L22 78 Q24 74 22 72 Z" fill="#0a0a0c"/>
  <path d="M82 72 Q84 76 80 78 L74 78 Q72 74 74 72 Z" fill="#0a0a0c"/>

  <!-- ARCLIGHT MARKSMAN sniper (tactical suppressed) -->
  <path d="M4 58 L16 56 L18 66 L4 68 Z" fill="url(#m-gun)"/>
  <path d="M8 52 L16 51 L16 56 L8 56 Z" fill="#1a1a1c"/>
  <path d="M16 56 L56 54 L56 66 L16 66 Z" fill="url(#m-gun)"/>
  <rect x="20" y="52" width="36" height="2" fill="#0a0a0c"/>
  <path d="M22 52 L22 54 M26 52 L26 54 M30 52 L30 54 M34 52 L34 54 M38 52 L38 54 M42 52 L42 54 M46 52 L46 54 M50 52 L50 54 M54 52 L54 54" stroke="#1a1a1c" stroke-width="0.4"/>
  <!-- large scope -->
  <rect x="28" y="44" width="20" height="8" rx="1.2" fill="#0a0a0c"/>
  <circle cx="38" cy="48" r="3" fill="#000"/>
  <circle cx="38" cy="48" r="2" fill="#c79aff"/>
  <circle cx="38" cy="48" r="0.7" fill="#fff0ff"/>
  <rect x="34" y="41" width="2" height="4" fill="#0a0a0c"/>
  <rect x="40" y="41" width="2" height="4" fill="#0a0a0c"/>
  <!-- magazine -->
  <path d="M30 66 L40 66 L39 80 L31 80 Z" fill="#0a0a0c"/>
  <!-- trigger -->
  <path d="M40 66 Q44 70 48 66" fill="none" stroke="#0a0a0c" stroke-width="1.4"/>
  <path d="M46 66 L52 66 L52 78 L48 80 Z" fill="#0a0a0c"/>
  <!-- bipod -->
  <path d="M52 66 L50 76 L54 74" fill="none" stroke="#0a0a0c" stroke-width="1"/>
  <!-- barrel + long suppressor -->
  <rect x="56" y="58" width="16" height="3" fill="url(#m-gun)"/>
  <rect x="72" y="56" width="16" height="7" rx="1" fill="#1a1a1c"/>
  <path d="M74 58 L86 58 M74 60 L86 60 M74 62 L86 62" stroke="#0a0a0c" stroke-width="0.3"/>
  <!-- muzzle rune (runic blue, weapon tag) -->
  <circle cx="88" cy="59" r="3.5" fill="url(#m-rune)"/>
  <circle cx="88" cy="59" r="1.3" fill="#eaf6ff"/>
</svg>
