  <circle cx="38" cy="62" r="2.2" fill="#7cc4ff"/>
  <circle cx="38" cy="62" r="0.8" fill="#eaf6ff"/>
  <rect x="34" y="55" width="2" height="4" fill="#0a0812"/>
