  <path d="M58 100 L50 100 L51 110 L57 110 Z" fill="url(#m-bone)"/>
  <path d="M40 104 L44 104" stroke="#6a5a40" stroke-width="0.3"/>
  <path d="M52 104 L56 104" stroke="#6a5a40" stroke-width="0.3"/>
  <!-- pointed boots (elvish silhouette) -->
  <path d="M37 110 Q36 114 40 114 L47 114 L47 110 Z" fill="#0a0806"/>
  <path d="M59 110 Q60 114 56 114 L49 114 L49 110 Z" fill="#0a0806"/>
  <path d="M45 112 L49 115 L45 115 Z" fill="#0a0806"/>
  <path d="M51 112 L47 115 L51 115 Z" fill="#0a0806"/>

  <!-- BELT + fae charms -->
  <path d="M28 72 L68 72 L68 78 L28 78 Z" fill="#1a1410"/>
  <rect x="44" y="71" width="8" height="8" fill="url(#m-bone-dark)"/>
  <path d="M48 73 L50 75 L48 77 L46 75 Z" fill="#c79aff"/>
  <path d="M48 75 L49 76 L48 77 L47 76 Z" fill="#fff0ff"/>
  <!-- hanging fae charms -->
  <circle cx="34" cy="80" r="1.2" fill="#c79aff"/>
  <path d="M34 81 L34 86" stroke="#8a5fb8" stroke-width="0.5"/>
  <circle cx="34" cy="86" r="0.8" fill="#e8e0f0"/>
  <circle cx="62" cy="80" r="1.2" fill="#c79aff"/>
  <path d="M62 81 L62 86" stroke="#8a5fb8" stroke-width="0.5"/>
  <circle cx="62" cy="86" r="0.8" fill="#e8e0f0"/>

