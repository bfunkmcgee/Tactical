  <path d="M37 92 Q42 90 46 92 L46 100 Q42 102 37 100 Z" fill="url(#m-bone)"/>
  <path d="M59 92 Q54 90 50 92 L50 100 Q54 102 59 100 Z" fill="url(#m-bone)"/>
  <path d="M42 96 L43 97 L42 98 L41 97 Z" fill="#c79aff"/>
  <path d="M54 96 L55 97 L54 98 L53 97 Z" fill="#c79aff"/>
