  <!-- forehead ridges -->
  <path d="M34 12 Q48 4 62 12 L60 18 Q48 10 36 18 Z" fill="url(#m-bone-dark)"/>
  <!-- butterfly / scarab-wing engraving on forehead -->
  <path d="M42 10 Q40 14 42 16 L48 14 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M54 10 Q56 14 54 16 L48 14 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M48 8 L48 18" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- crest gem -->
  <path d="M48 6 L50 8 L48 10 L46 8 Z" fill="#c79aff"/>
  <path d="M48 7 L49 8 L48 9 L47 8 Z" fill="#fff0ff"/>
  <!-- temple filigree (ornate scroll) -->
  <path d="M34 18 Q32 22 34 26 Q36 24 36 22 Q34 20 36 18 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M62 18 Q64 22 62 26 Q60 24 60 22 Q62 20 60 18 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <!-- side rails -->
  <rect x="32" y="18" width="2" height="8" fill="#1a1410"/>
  <rect x="62" y="18" width="2" height="8" fill="#1a1410"/>
  <circle cx="33" cy="20" r="0.7" fill="#c79aff"/>
