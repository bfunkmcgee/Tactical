  <path d="M32 50 L36 54" stroke="#6a5a40" stroke-width="0.3" opacity=".5"/>
  <path d="M60 50 L64 54" stroke="#6a5a40" stroke-width="0.3" opacity=".5"/>

  <!-- pauldrons (ornate bone) -->
  <path d="M16 34 Q14 46 20 50 L28 46 L28 36 Q22 32 18 32 Q16 32 16 34 Z" fill="url(#m-bone)"/>
  <path d="M80 34 Q82 46 76 50 L68 46 L68 36 Q74 32 78 32 Q80 32 80 34 Z" fill="url(#m-bone)"/>
  <!-- pauldron scallop -->
  <path d="M16 42 Q22 46 28 42" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <path d="M80 42 Q74 46 68 42" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
  <!-- fae gem embellishment -->
  <path d="M22 40 L24 42 L22 44 L20 42 Z" fill="#c79aff"/>
  <path d="M22 41 L23 42 L22 43 L21 42 Z" fill="#fff0ff"/>
  <path d="M74 40 L76 42 L74 44 L72 42 Z" fill="#c79aff"/>
  <path d="M74 41 L75 42 L74 43 L73 42 Z" fill="#fff0ff"/>
