  <path d="M52 78 Q52 82 52 86" fill="none" stroke="#5a4a30" stroke-width="0.3"/>
  <path d="M56 78 Q54 82 56 86" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M41 82 L43 82 M53 82 L55 82" stroke="#c79aff" stroke-width="0.4"/>
