<?xml version="1.0" encoding="UTF-8"?>
<!--
  Combat Plate — legs overlay. Reinforced combat trousers with
  articulated knee plates + tactical boots. Balanced tier-2 coverage.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <!-- Main trouser legs -->
  <path d="M 35 82 L 34 116 L 43 118 L 45 82 Z" fill="#3a3e32" stroke="#0a0c08" stroke-width="0.4"/>
  <path d="M 51 82 L 53 118 L 62 116 L 61 82 Z" fill="#3a3e32" stroke="#0a0c08" stroke-width="0.4"/>
  <!-- Thigh armor plate (left) -->
  <rect x="35" y="86" width="10" height="12" fill="#2a2e24" stroke="#0a0c08" stroke-width="0.4"/>
  <line x1="35" y1="90" x2="45" y2="90" stroke="#1a1c14" stroke-width="0.3"/>
  <line x1="35" y1="94" x2="45" y2="94" stroke="#1a1c14" stroke-width="0.3"/>
  <!-- Thigh armor plate (right) -->
  <rect x="51" y="86" width="10" height="12" fill="#2a2e24" stroke="#0a0c08" stroke-width="0.4"/>
  <line x1="51" y1="90" x2="61" y2="90" stroke="#1a1c14" stroke-width="0.3"/>
  <line x1="51" y1="94" x2="61" y2="94" stroke="#1a1c14" stroke-width="0.3"/>
  <!-- Articulated knee plates (domed) -->
  <path d="M 34 98 Q 40 96 45 98 L 45 103 Q 40 105 34 103 Z" fill="#4a4e44" stroke="#0a0c08" stroke-width="0.4"/>
  <path d="M 51 98 Q 56 96 62 98 L 62 103 Q 56 105 51 103 Z" fill="#4a4e44" stroke="#0a0c08" stroke-width="0.4"/>
  <!-- Shin guard strips -->
  <rect x="36" y="106" width="8" height="2.5" fill="#2a2e24"/>
  <rect x="36" y="110" width="8" height="2.5" fill="#2a2e24"/>
  <rect x="52" y="106" width="8" height="2.5" fill="#2a2e24"/>
  <rect x="52" y="110" width="8" height="2.5" fill="#2a2e24"/>
  <!-- Tactical boots -->
  <path d="M 33 116 L 32 124 L 46 124 L 46 118 Z" fill="#1a1a16" stroke="#0a0a08" stroke-width="0.3"/>
  <path d="M 50 118 L 50 124 L 64 124 L 63 116 Z" fill="#1a1a16" stroke="#0a0a08" stroke-width="0.3"/>
  <!-- Boot toe caps -->
  <path d="M 32 122 L 32 124 L 40 124 L 40 122 Z" fill="#0a0a08"/>
  <path d="M 56 122 L 56 124 L 64 124 L 64 122 Z" fill="#0a0a08"/>
  <!-- Boot laces -->
  <line x1="36" y1="119" x2="42" y2="123" stroke="#4a3828" stroke-width="0.4"/>
  <line x1="42" y1="119" x2="36" y2="123" stroke="#4a3828" stroke-width="0.4"/>
  <line x1="54" y1="119" x2="60" y2="123" stroke="#4a3828" stroke-width="0.4"/>
  <line x1="60" y1="119" x2="54" y2="123" stroke="#4a3828" stroke-width="0.4"/>
</svg>
