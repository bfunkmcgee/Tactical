<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ranger Carapace — front-arm wrist bracer for Kestrel's class-canonical
  gauntlets. Light reinforced scout glove; content kept inside
  x=46..58, y=58..76 so it overlays only the front arm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <defs>
    <linearGradient id="rcg-glove" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#546a4c"/><stop offset="1" stop-color="#2a3a22"/>
    </linearGradient>
    <linearGradient id="rcg-strap" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a88c5c"/><stop offset="1" stop-color="#5a4828"/>
    </linearGradient>
  </defs>
  <!-- Forearm wrap: lighter than warden, covers wrist area only -->
  <path d="M 51 64 L 57 62 L 56 73 L 49 74 Z" fill="url(#rcg-glove)" stroke="#1a220e" stroke-width="0.4"/>
  <!-- Strap across wrist -->
  <rect x="48" y="71" width="9" height="2" fill="url(#rcg-strap)" stroke="#3a2e18" stroke-width="0.3"/>
  <!-- Stitch detail -->
  <line x1="52" y1="65" x2="52" y2="72" stroke="#3a4a2e" stroke-width="0.3" opacity="0.6"/>
  <!-- Glove fingers hint -->
  <path d="M 49 73 L 56 73 L 55 76 L 49 76 Z" fill="#1a220e" stroke="#0a100a" stroke-width="0.3"/>
</svg>
