<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ranger Carapace — torso-only overlay for Kestrel's class-canonical
  chest piece (Mithril-Laced Vest). Light scout vest over desert
  cloak with a small gold ranger sigil. All drawn content clipped
  to the torso band (y ~ 36-82).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <defs>
    <linearGradient id="rc-vest" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#546a4c"/><stop offset="1" stop-color="#2a3a22"/>
    </linearGradient>
    <linearGradient id="rc-cloak" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a88c5c"/><stop offset="1" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="rc-gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c488"/><stop offset="1" stop-color="#8a6838"/>
    </linearGradient>
  </defs>
  <!-- Cloak drape behind torso (torso band only, not hanging to legs) -->
  <path d="M 29 44 L 67 44 L 68 80 L 28 80 Z" fill="url(#rc-cloak)" stroke="#3a2e18" stroke-width="0.4"/>
  <!-- Cloak shoulder folds -->
  <path d="M 30 48 L 32 78" stroke="#6a5430" stroke-width="0.4" opacity="0.7"/>
  <path d="M 66 48 L 64 78" stroke="#6a5430" stroke-width="0.4" opacity="0.7"/>
  <!-- Cloak collar shadow -->
  <path d="M 33 44 Q 48 48 63 44" fill="none" stroke="#3a2e18" stroke-width="0.4"/>
  <!-- Scout vest (front panel, narrower than cloak) -->
  <path d="M 35 50 L 61 50 L 62 78 L 34 78 Z" fill="url(#rc-vest)" stroke="#1a220e" stroke-width="0.5"/>
  <!-- Vest center seam -->
  <line x1="48" y1="50" x2="48" y2="78" stroke="#3a4a2e" stroke-width="0.4"/>
  <!-- Shoulder strap loops -->
  <rect x="37" y="48" width="6" height="4" fill="#2a3a22" stroke="#0a100a" stroke-width="0.3"/>
  <rect x="53" y="48" width="6" height="4" fill="#2a3a22" stroke="#0a100a" stroke-width="0.3"/>
  <!-- Chest pocket flaps -->
  <rect x="37" y="56" width="8" height="6" fill="#3a4a2e" stroke="#0a100a" stroke-width="0.3"/>
  <rect x="51" y="56" width="8" height="6" fill="#3a4a2e" stroke="#0a100a" stroke-width="0.3"/>
  <line x1="37" y1="60" x2="45" y2="60" stroke="#1a220e" stroke-width="0.2"/>
  <line x1="51" y1="60" x2="59" y2="60" stroke="#1a220e" stroke-width="0.2"/>
  <!-- Small mithril sheen on lower vest -->
  <path d="M 36 66 L 60 66 L 60 72 L 36 72 Z" fill="#6a8260" opacity="0.35"/>
  <!-- Ranger sigil (gold arrowhead) center-chest -->
  <g transform="translate(48 56)">
    <path d="M 0 -2.5 L 2.5 2.5 L 0 1.2 L -2.5 2.5 Z" fill="url(#rc-gold)" stroke="#5a4020" stroke-width="0.25"/>
  </g>
  <!-- Belt at the hip line -->
  <rect x="34" y="76" width="28" height="3" fill="#3a2e18" stroke="#1a1208" stroke-width="0.3"/>
  <rect x="46" y="76.5" width="4" height="2" fill="url(#rc-gold)" stroke="#5a4020" stroke-width="0.2"/>
</svg>
