<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="r-plate" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="r-plate-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="r-tan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a88c5c"/><stop offset="1" stop-color="#5a4828"/>
    </linearGradient>
    <linearGradient id="r-tan-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a6038"/><stop offset="1" stop-color="#3a2e18"/>
    </linearGradient>
    <linearGradient id="r-boot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b09060"/><stop offset="1" stop-color="#6a5430"/>
    </linearGradient>
    <linearGradient id="r-gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c488"/><stop offset="1" stop-color="#8a6838"/>
    </linearGradient>
    <linearGradient id="r-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="r-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".5" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2a6aa0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LEGS: desert tan pants -->
  <path d="M36 76 Q34 108 40 112 L46 112 L47 76 Z" fill="url(#r-tan-dark)"/>
  <path d="M60 76 Q62 108 56 112 L50 112 L49 76 Z" fill="url(#r-tan-dark)"/>
  <!-- pant fabric folds -->
  <path d="M38 82 L40 108" stroke="#2a2010" stroke-width="0.5" opacity=".6"/>
  <path d="M56 82 L58 108" stroke="#2a2010" stroke-width="0.5" opacity=".6"/>
  <!-- cargo pocket -->
  <path d="M36 84 L46 84 L46 94 L36 94 Z" fill="#4a3818"/>
  <path d="M60 84 L50 84 L50 94 L60 94 Z" fill="#4a3818"/>
  <path d="M36 84 L46 84 L46 86 L36 86 Z" fill="#7a6038" opacity=".7"/>
  <path d="M60 84 L50 84 L50 86 L60 86 Z" fill="#7a6038" opacity=".7"/>
  <!-- BLACK HARD SHELL KNEE PADS -->
  <path d="M36 94 Q42 92 46 94 L46 104 Q42 108 36 106 Z" fill="url(#r-plate)"/>
  <path d="M60 94 Q54 92 50 94 L50 104 Q54 108 60 106 Z" fill="url(#r-plate)"/>
  <!-- knee pad highlight/sheen -->
  <path d="M38 95 Q42 94 45 95" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <path d="M58 95 Q54 94 51 95" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <!-- ankle wraps -->
  <path d="M37 106 L47 106 L47 110 L37 110 Z" fill="#2a2010"/>
  <path d="M59 106 L49 106 L49 110 L59 110 Z" fill="#2a2010"/>
  <!-- DESERT TAN BOOTS -->
  <path d="M35 110 Q34 116 38 118 L48 118 L48 110 Z" fill="url(#r-boot)"/>
  <path d="M61 110 Q62 116 58 118 L48 118 L48 110 Z" fill="url(#r-boot)"/>
  <!-- boot laces -->
  <path d="M38 112 L45 112 M38 114 L45 114 M38 116 L45 116" stroke="#3a2818" stroke-width="0.5"/>
  <path d="M51 112 L58 112 M51 114 L58 114 M51 116 L58 116" stroke="#3a2818" stroke-width="0.5"/>

  <!-- BELT -->
  <path d="M28 72 L68 72 L68 78 L28 78 Z" fill="#1a1410"/>
  <!-- belt buckle -->
  <rect x="45" y="72" width="6" height="6" fill="url(#r-plate-hl)"/>
  <rect x="46.5" y="73.5" width="3" height="3" fill="#7cc4ff"/>
  <!-- leg holster -->
  <path d="M58 78 L66 78 L66 94 L58 94 Z" fill="url(#r-plate)"/>
  <path d="M60 80 L64 80 L64 90 L60 90 Z" fill="#0a0a0c"/>
  <path d="M61 82 L63 82 L63 88 L61 88 Z" fill="#1a1a1c"/>

  <!-- TORSO: matte black hard-shell plate -->
  <path d="M22 38 Q22 34 26 34 L70 34 Q74 34 74 38 L74 72 Q74 76 70 76 L26 76 Q22 76 22 72 Z" fill="url(#r-plate)"/>
  <!-- plate highlight edges (makes it look glossy/hard) -->
  <path d="M26 34 L70 34 L70 36 L26 36 Z" fill="url(#r-plate-hl)" opacity=".7"/>
  <!-- chest plate segmentation -->
  <path d="M22 44 L74 44" stroke="#4a4a50" stroke-width="0.5" opacity=".6"/>
  <path d="M22 60 L74 60" stroke="#4a4a50" stroke-width="0.5" opacity=".6"/>
  <path d="M48 34 L48 76" stroke="#4a4a50" stroke-width="0.4" opacity=".5"/>
  <!-- GOLD DOUBLE-HEADED EAGLE EMBLEM (shared squad crest) -->
  <g transform="translate(48 52)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="2.5" ry="4.5" fill="url(#r-gold)"/>
    <!-- heads (two, looking left and right) -->
    <circle cx="-2.5" cy="-4" r="1.6" fill="url(#r-gold)"/>
    <circle cx="2.5" cy="-4" r="1.6" fill="url(#r-gold)"/>
    <path d="M-4 -4.5 L-5 -4 L-4 -3.5 Z" fill="url(#r-gold)"/>
    <path d="M4 -4.5 L5 -4 L4 -3.5 Z" fill="url(#r-gold)"/>
    <!-- wings spread -->
    <path d="M-2 -1 L-8 -2 L-10 1 L-8 3 L-4 2 L-2 3 Z" fill="url(#r-gold)"/>
    <path d="M2 -1 L8 -2 L10 1 L8 3 L4 2 L2 3 Z" fill="url(#r-gold)"/>
    <!-- wing feather lines -->
    <path d="M-9 0 L-6 0 M-8 2 L-5 2" stroke="#8a6838" stroke-width="0.3"/>
    <path d="M9 0 L6 0 M8 2 L5 2" stroke="#8a6838" stroke-width="0.3"/>
    <!-- tail -->
    <path d="M-1 4 L0 6 L1 4 Z" fill="url(#r-gold)"/>
    <!-- crown on top -->
    <path d="M-1 -6 L-1 -5 L0 -6 L1 -5 L1 -6 Z" fill="url(#r-gold)"/>
  </g>
  <!-- chest rig straps (tan webbing) -->
  <path d="M26 40 L46 40 L46 46 L26 46 Z" fill="url(#r-tan)"/>
  <path d="M50 40 L70 40 L70 46 L50 46 Z" fill="url(#r-tan)"/>
  <!-- mag pouches -->
  <rect x="27" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="33" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="39" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="52" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="58" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <rect x="64" y="42" width="5" height="8" rx="0.5" fill="#1a1410"/>
  <!-- pouch straps -->
  <path d="M28 45 L31 45 M28 47 L31 47" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M34 45 L37 45 M34 47 L37 47" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M40 45 L43 45 M40 47 L43 47" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M53 45 L56 45 M53 47 L56 47" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M59 45 L62 45 M59 47 L62 47" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M65 45 L68 45 M65 47 L68 47" stroke="#3a3020" stroke-width="0.3"/>
  <!-- lower chest accessories -->
  <rect x="30" y="62" width="6" height="10" rx="0.5" fill="#1a1410"/>
  <rect x="60" y="62" width="6" height="10" rx="0.5" fill="#1a1410"/>
  <path d="M31 64 L35 64 M31 67 L35 67 M31 70 L35 70" stroke="#3a3020" stroke-width="0.3"/>
  <path d="M61 64 L65 64 M61 67 L65 67 M61 70 L65 70" stroke="#3a3020" stroke-width="0.3"/>
  <!-- sheen on plate -->
  <path d="M26 50 Q28 54 30 58" fill="none" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <path d="M70 50 Q68 54 66 58" fill="none" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>

  <!-- PAULDRONS: glossy black hard shells -->
  <path d="M16 34 Q12 46 20 50 L28 46 L28 36 Q22 32 18 32 Q16 32 16 34 Z" fill="url(#r-plate)"/>
  <path d="M80 34 Q84 46 76 50 L68 46 L68 36 Q74 32 78 32 Q80 32 80 34 Z" fill="url(#r-plate)"/>
  <!-- pauldron sheen -->
  <path d="M16 40 Q20 44 26 42" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <path d="M80 40 Q76 44 70 42" fill="none" stroke="#4a4a50" stroke-width="0.6"/>
  <!-- shoulder panel seam -->
  <path d="M18 38 L26 38" stroke="#0a0a0c" stroke-width="0.4"/>
  <path d="M78 38 L70 38" stroke="#0a0a0c" stroke-width="0.4"/>
  <!-- pauldron squad sigil (small gold eagle silhouette) -->
  <circle cx="22" cy="44" r="1.6" fill="#0a0a0c"/>
  <path d="M22 43 L21 45 L22 45.5 L23 45 Z" fill="url(#r-gold)"/>
  <circle cx="74" cy="44" r="1.6" fill="#0a0a0c"/>
  <path d="M74 43 L73 45 L74 45.5 L75 45 Z" fill="url(#r-gold)"/>

  <!-- DESERT TAN SCARF / shemagh around neck -->
  <path d="M34 34 Q48 42 62 34 L62 40 Q48 46 34 40 Z" fill="url(#r-tan)"/>
  <path d="M34 34 L30 38 L32 42 L36 40 Z" fill="url(#r-tan)"/>
  <path d="M62 34 L66 38 L64 42 L60 40 Z" fill="url(#r-tan)"/>
  <!-- scarf checker pattern hint -->
  <path d="M36 36 L60 36 M36 38 L60 38 M36 40 L60 40" stroke="#5a4828" stroke-width="0.3" opacity=".5"/>

  <!-- HEAD: modern tactical helmet with respirator -->
  <!-- helmet shell (smooth matte black) -->
  <ellipse cx="48" cy="20" rx="13" ry="15" fill="url(#r-plate)"/>
  <!-- helmet rim / edge -->
  <path d="M35 22 L61 22" stroke="#0a0a0c" stroke-width="0.8"/>
  <!-- helmet top sheen -->
  <path d="M38 8 Q48 4 58 8" fill="none" stroke="#4a4a50" stroke-width="0.6" opacity=".6"/>
  <!-- helmet front face plate / respirator -->
  <path d="M36 20 L60 20 L60 34 L55 36 L41 36 L36 34 Z" fill="url(#r-plate)"/>
  <!-- visor slit (horizontal, dark) -->
  <path d="M37 22 L59 22 L59 27 L37 27 Z" fill="#000"/>
  <!-- visor inner glow -->
  <path d="M38 24 L46 24" stroke="#7cc4ff" stroke-width="0.5" opacity=".8"/>
  <path d="M52 24 L58 24" stroke="#7cc4ff" stroke-width="0.4" opacity=".6"/>
  <!-- respirator filter canister on cheek -->
  <rect x="32" y="26" width="6" height="8" rx="1" fill="url(#r-plate-hl)"/>
  <circle cx="35" cy="30" r="1.6" fill="#0a0a0c"/>
  <path d="M33 28 L37 28 M33 32 L37 32" stroke="#0a0a0c" stroke-width="0.4"/>
  <!-- hose from filter -->
  <path d="M38 30 Q42 32 44 30" fill="none" stroke="#1a1a1c" stroke-width="1.5"/>
  <!-- mouth vent grille -->
  <rect x="42" y="28" width="12" height="5" rx="0.4" fill="#0a0a0c"/>
  <path d="M43 29 L53 29 M43 31 L53 31" stroke="#2a2a2e" stroke-width="0.4"/>
  <!-- chin guard -->
  <path d="M41 34 L48 38 L55 34" fill="url(#r-plate-hl)"/>
  <!-- side rails with antenna + sensor -->
  <rect x="33" y="14" width="2" height="10" fill="#0a0a0c"/>
  <rect x="61" y="14" width="2" height="10" fill="#0a0a0c"/>
  <path d="M32 10 L32 4" stroke="#0a0a0c" stroke-width="0.7"/>
  <path d="M64 6 L64 0" stroke="#0a0a0c" stroke-width="0.7"/>
  <circle cx="33" cy="16" r="0.7" fill="#7cc4ff"/>
  <!-- NVG mount on top -->
  <rect x="42" y="6" width="12" height="3" rx="0.5" fill="#0a0a0c"/>
  <rect x="44" y="4" width="8" height="3" rx="0.5" fill="#1a1a1c"/>
  <circle cx="46" cy="5.5" r="0.8" fill="#7cc4ff"/>
  <circle cx="50" cy="5.5" r="0.8" fill="#1a1a1c"/>
  <!-- helmet patch (gold eagle mini) -->
  <rect x="44" y="12" width="8" height="5" fill="url(#r-plate-hl)"/>
  <path d="M48 14 L47 16 L48 16.5 L49 16 Z" fill="url(#r-gold)"/>
  <circle cx="46" cy="14" r="0.5" fill="url(#r-gold)"/>
  <circle cx="50" cy="14" r="0.5" fill="url(#r-gold)"/>
  <!-- helmet weathering -->
  <path d="M38 18 L36 22" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <path d="M58 18 L60 22" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>

  <!-- ARMS: matte black shell + tan sleeves at joints -->
  <path d="M18 42 L26 40 L26 54 L18 56 Z" fill="url(#r-plate)"/>
  <path d="M78 42 L70 40 L70 54 L78 56 Z" fill="url(#r-plate)"/>
  <!-- elbow gap (tan fabric) -->
  <path d="M18 56 L26 54 L26 58 L18 60 Z" fill="url(#r-tan)"/>
  <path d="M78 56 L70 54 L70 58 L78 60 Z" fill="url(#r-tan)"/>
  <!-- forearm plate -->
  <path d="M16 58 L26 58 L26 72 L18 72 Z" fill="url(#r-plate)"/>
  <path d="M80 58 L70 58 L70 72 L78 72 Z" fill="url(#r-plate)"/>
  <!-- forearm seam -->
  <path d="M18 62 L24 62 M18 68 L24 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <path d="M72 62 L78 62 M72 68 L78 68" stroke="#4a4a50" stroke-width="0.3" opacity=".5"/>
  <!-- tactical gloves (dark) -->
  <path d="M14 72 Q12 76 16 78 L22 78 Q24 74 22 72 Z" fill="#0a0a0c"/>
  <path d="M82 72 Q84 76 80 78 L74 78 Q72 74 74 72 Z" fill="#0a0a0c"/>
  <!-- knuckle studs -->
  <circle cx="16" cy="74" r="0.6" fill="#2a2a2e"/>
  <circle cx="20" cy="76" r="0.6" fill="#2a2a2e"/>
  <circle cx="80" cy="74" r="0.6" fill="#2a2a2e"/>
  <circle cx="76" cy="76" r="0.6" fill="#2a2a2e"/>

</svg>