<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="s-bone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0ead8"/><stop offset="1" stop-color="#8a7e66"/>
    </linearGradient>
    <linearGradient id="s-bone-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8ad95"/><stop offset="1" stop-color="#4a3e28"/>
    </linearGradient>
    <linearGradient id="s-fur" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d4c8b0"/><stop offset="1" stop-color="#3a3020"/>
    </linearGradient>
    <linearGradient id="s-scarf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8dfc4"/><stop offset="1" stop-color="#7a6e52"/>
    </linearGradient>
    <linearGradient id="s-under" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a251e"/><stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="s-brass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c8a868"/><stop offset="1" stop-color="#6a4a1a"/>
    </linearGradient>
    <linearGradient id="s-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2218"/><stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="s-alch" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8f8d8"/>
      <stop offset=".4" stop-color="#9cd6a6"/>
      <stop offset="1" stop-color="#2a5a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4c0"/>
      <stop offset=".5" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#8a3010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="120" rx="26" ry="5" fill="#000" opacity=".55"/>

  <!-- BACK CLOAK / short utility mantle -->
  <path d="M12 36 Q10 46 12 82 Q14 100 22 100 L30 96 L34 40 Z" fill="url(#s-fur)"/>
  <path d="M84 36 Q86 46 84 82 Q82 100 74 100 L66 96 L62 40 Z" fill="url(#s-fur)"/>
  <path d="M34 38 L62 38 L62 96 L34 96 Z" fill="url(#s-bone-dark)" opacity=".4"/>
  <!-- torn hem -->
  <path d="M14 94 L18 102 L22 96 L26 102 L30 96 L34 100 L34 104 L14 104 Z" fill="#1b2331"/>
  <path d="M62 96 L66 102 L70 96 L74 102 L78 96 L82 102 L84 96 L84 104 L62 104 Z" fill="#1b2331"/>
  <path d="M16 40 Q16 70 16 96" fill="none" stroke="#2a2414" stroke-width="0.8"/>
  <path d="M80 40 Q80 70 80 96" fill="none" stroke="#2a2414" stroke-width="0.8"/>

  <!-- LEGS: dark undersuit + bone greaves -->
  <path d="M34 78 Q32 108 40 114 L46 114 L48 78 Z" fill="url(#s-under)"/>
  <path d="M62 78 Q64 108 56 114 L50 114 L48 78 Z" fill="url(#s-under)"/>
