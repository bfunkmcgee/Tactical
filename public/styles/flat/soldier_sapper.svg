  <path d="M24 82 L32 82 L32 94 L24 94 Z" fill="#1a1410"/>
  <path d="M64 82 L72 82 L72 94 L64 94 Z" fill="#1a1410"/>
  <path d="M25 86 L31 86 M25 90 L31 90" stroke="#3a3228" stroke-width="0.4"/>
  <path d="M65 86 L71 86 M65 90 L71 90" stroke="#3a3228" stroke-width="0.4"/>
