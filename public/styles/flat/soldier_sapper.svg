  <!-- ALCHEMICAL VIAL BANDOLIER across chest (narrow) -->
  <path d="M26 40 L72 56" stroke="#3a3228" stroke-width="3.5"/>
  <g>
    <rect x="30" y="42" width="3" height="5" rx="0.4" fill="#0a0806"/>
    <rect x="30.5" y="43" width="2" height="3" fill="#9cd6a6"/>
    <circle cx="31.5" cy="42" r="0.6" fill="url(#s-brass)"/>
  </g>
  <g>
    <rect x="36" y="45" width="3" height="5" rx="0.4" fill="#0a0806"/>
    <rect x="36.5" y="46" width="2" height="3" fill="#9cd6a6"/>
    <circle cx="37.5" cy="45" r="0.6" fill="url(#s-brass)"/>
  </g>
  <g>
    <rect x="56" y="51" width="3" height="5" rx="0.4" fill="#0a0806"/>
    <rect x="56.5" y="52" width="2" height="3" fill="#9cd6a6"/>
    <circle cx="57.5" cy="51" r="0.6" fill="url(#s-brass)"/>
  </g>
  <g>
    <rect x="62" y="54" width="3" height="5" rx="0.4" fill="#0a0806"/>
    <rect x="62.5" y="55" width="2" height="3" fill="#9cd6a6"/>
    <circle cx="63.5" cy="54" r="0.6" fill="url(#s-brass)"/>
  </g>

  <!-- SHOTGUN SHELL BANDOLIER (other diagonal) -->
  <path d="M72 40 L24 56" stroke="#3a3228" stroke-width="3"/>
  <rect x="30" y="54" width="2.5" height="3.5" fill="#8a3010"/>
  <rect x="30.5" y="54" width="2" height="1" fill="#c8a868"/>
  <rect x="38" y="51" width="2.5" height="3.5" fill="#8a3010"/>
  <rect x="38.5" y="51" width="2" height="1" fill="#c8a868"/>
  <rect x="56" y="44" width="2.5" height="3.5" fill="#8a3010"/>
  <rect x="56.5" y="44" width="2" height="1" fill="#c8a868"/>
  <rect x="64" y="41" width="2.5" height="3.5" fill="#8a3010"/>
  <rect x="64.5" y="41" width="2" height="1" fill="#c8a868"/>

  <!-- pauldrons (layered bone) -->
  <path d="M16 36 Q14 48 20 52 L28 48 L28 38 Q22 34 18 34 Q16 34 16 36 Z" fill="url(#s-bone)"/>
  <path d="M80 36 Q82 48 76 52 L68 48 L68 38 Q74 34 78 34 Q80 34 80 36 Z" fill="url(#s-bone)"/>
  <path d="M16 44 Q22 48 28 44" fill="none" stroke="#6a5a40" stroke-width="0.5"/>
