  <path d="M34 82 L36 82 M46 82 L44 82" stroke="#6a5a40" stroke-width="0.4"/>
  <path d="M62 82 L60 82 M50 82 L52 82" stroke="#6a5a40" stroke-width="0.4"/>
  <!-- knee plates -->
  <path d="M34 94 Q40 92 46 94 L46 102 Q40 104 34 102 Z" fill="url(#s-bone-dark)"/>
  <path d="M62 94 Q56 92 50 94 L50 102 Q56 104 62 102 Z" fill="url(#s-bone-dark)"/>
  <path d="M36 97 L44 97 M36 100 L44 100" stroke="#5a4a30" stroke-width="0.3"/>
  <path d="M52 97 L60 97 M52 100 L60 100" stroke="#5a4a30" stroke-width="0.3"/>
  <!-- shin greaves -->
  <path d="M34 102 L46 102 L45 112 L35 112 Z" fill="url(#s-bone)"/>
  <path d="M62 102 L50 102 L51 112 L61 112 Z" fill="url(#s-bone)"/>
  <path d="M38 106 L42 106" stroke="#6a5a40" stroke-width="0.3"/>
  <path d="M54 106 L58 106" stroke="#6a5a40" stroke-width="0.3"/>
  <!-- grime -->
  <path d="M36 108 L42 111" stroke="#5a4a30" stroke-width="0.4" opacity=".7"/>
  <path d="M54 108 L60 111" stroke="#5a4a30" stroke-width="0.4" opacity=".7"/>
  <!-- heavy tactical boots -->
  <path d="M32 112 L48 112 L48 118 L36 120 Q32 117 32 112 Z" fill="#0a0806"/>
  <path d="M64 112 L48 112 L48 118 L60 120 Q64 117 64 112 Z" fill="#0a0806"/>
