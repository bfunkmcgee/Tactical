  <path d="M40 28 L56 28 L55 36 L41 36 Z" fill="url(#s-bone-dark)"/>
  <!-- filter canister -->
  <rect x="42" y="30" width="12" height="5" rx="1" fill="#1a1410"/>
  <!-- filter mesh -->
  <circle cx="44" cy="32.5" r="0.6" fill="#3a3228"/>
  <circle cx="47" cy="32.5" r="0.6" fill="#3a3228"/>
  <circle cx="50" cy="32.5" r="0.6" fill="#3a3228"/>
  <circle cx="53" cy="32.5" r="0.6" fill="#3a3228"/>
  <!-- alchemical glow inside filter -->
  <rect x="43" y="31" width="10" height="1" fill="#9cd6a6" opacity=".5"/>
  <!-- hose connecting to side -->
  <path d="M40 34 Q34 36 32 40" fill="none" stroke="#2a2218" stroke-width="2"/>
  <path d="M56 34 Q62 36 64 40" fill="none" stroke="#2a2218" stroke-width="2"/>
  <!-- chin plate -->
  <path d="M42 36 L48 40 L54 36 L53 38 L43 38 Z" fill="url(#s-bone-dark)"/>
  <!-- forehead engraving -->
  <path d="M44 10 L48 8 L52 10 L50 14 L46 14 Z" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <circle cx="48" cy="12" r="0.8" fill="#9cd6a6"/>
  <!-- NVG/rangefinder mount -->
  <rect x="44" y="4" width="8" height="2" rx="0.5" fill="#1a1410"/>
  <rect x="46" y="2" width="4" height="3" rx="0.5" fill="#1a1410"/>
  <circle cx="48" cy="3.5" r="0.8" fill="#9cd6a6"/>
  <!-- weathering streaks -->
  <path d="M38 22 L36 26" stroke="#6a5a40" stroke-width="0.3" opacity=".6"/>
  <path d="M58 22 L60 26" stroke="#6a5a40" stroke-width="0.3" opacity=".6"/>
  <path d="M42 38 L44 40" stroke="#5a4a30" stroke-width="0.3" opacity=".6"/>

  <!-- ARMS: undersuit + bone bracers -->
  <path d="M18 44 Q16 46 16 48 L18 68 Q18 72 22 72 L26 70 L26 42 Z" fill="url(#s-under)"/>
  <path d="M78 44 Q80 46 80 48 L78 68 Q78 72 74 72 L70 70 L70 42 Z" fill="url(#s-under)"/>
  <path d="M16 50 L26 50 L26 56 L16 56 Z" fill="url(#s-bone)"/>
  <path d="M80 50 L70 50 L70 56 L80 56 Z" fill="url(#s-bone)"/>
  <path d="M16 62 L26 62 L26 70 L16 70 Z" fill="url(#s-bone)"/>
  <path d="M80 62 L70 62 L70 70 L80 70 Z" fill="url(#s-bone)"/>
  <path d="M18 64 L24 64 M18 67 L24 67" stroke="#6a5a40" stroke-width="0.4"/>
  <path d="M72 64 L78 64 M72 67 L78 67" stroke="#6a5a40" stroke-width="0.4"/>
  <!-- gloves (dark, reinforced with brass knuckles) -->
  <path d="M14 70 Q12 74 16 78 L22 78 Q24 74 22 70 Z" fill="#0a0806"/>
  <path d="M82 70 Q84 74 80 78 L74 78 Q72 74 74 70 Z" fill="#0a0806"/>
  <circle cx="16" cy="74" r="0.8" fill="url(#s-brass)"/>
  <circle cx="20" cy="76" r="0.8" fill="url(#s-brass)"/>
  <circle cx="80" cy="74" r="0.8" fill="url(#s-brass)"/>
  <circle cx="76" cy="76" r="0.8" fill="url(#s-brass)"/>

  <!-- HEXBORE SCATTERGUN (dark tactical shotgun) -->
  <path d="M6 66 L18 64 L18 74 L6 76 Z" fill="url(#s-gun)"/>
  <rect x="4" y="66" width="2" height="10" fill="url(#s-brass)"/>
  <path d="M18 62 L48 62 L48 76 L18 76 Z" fill="url(#s-gun)"/>
  <rect x="18" y="68" width="30" height="2" fill="url(#s-brass)"/>
  <!-- alchemical vial (class tag) on receiver -->
  <rect x="28" y="66" width="6" height="8" rx="0.6" fill="#0a0806"/>
  <rect x="28.5" y="67" width="5" height="6" fill="#9cd6a6"/>
  <rect x="28.5" y="67" width="5" height="2" fill="#e8f8d8" opacity=".7"/>
  <!-- hex sigil -->
  <path d="M40 66 L43 68 L43 71 L40 73 L37 71 L37 68 Z" fill="none" stroke="#9cd6a6" stroke-width="0.6"/>
  <!-- pump grip -->
  <path d="M38 76 L46 76 L46 82 L38 82 Z" fill="#1a1410"/>
  <path d="M39 77 L45 77 M39 79 L45 79 M39 81 L45 81" stroke="#3a3228" stroke-width="0.3"/>
  <!-- trigger -->
  <path d="M48 70 Q52 74 54 70" fill="none" stroke="#0a0806" stroke-width="1.4"/>
  <path d="M52 70 L58 70 L58 80 L54 82 Z" fill="#1a1410"/>
  <!-- double barrel -->
  <rect x="48" y="64" width="36" height="4" fill="url(#s-gun)"/>
  <rect x="48" y="68" width="36" height="4" fill="url(#s-gun)"/>
  <path d="M48 68 L84 68" stroke="#0a0806" stroke-width="0.3"/>
  <rect x="58" y="64" width="2" height="8" fill="url(#s-brass)"/>
  <rect x="72" y="64" width="2" height="8" fill="url(#s-brass)"/>
