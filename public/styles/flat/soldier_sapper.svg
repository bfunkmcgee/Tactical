  <path d="M84 62 L90 64 L90 72 L84 74 Z" fill="url(#s-gun)"/>
  <rect x="85" y="64" width="1" height="8" fill="#0a0806"/>
  <rect x="88" y="64" width="1" height="8" fill="#0a0806"/>
  <!-- alchemical muzzle glow -->
  <circle cx="92" cy="68" r="5" fill="url(#s-alch)"/>
  <circle cx="92" cy="68" r="2" fill="#e8f8d8"/>
  <circle cx="90" cy="62" r="0.8" fill="#9cd6a6"/>
  <circle cx="94" cy="74" r="0.6" fill="#9cd6a6"/>
</svg>
