  <path d="M36 20 L60 20 L60 26 L36 26 Z" fill="#0a0806"/>
  <path d="M36 20 L60 20" stroke="#3a3228" stroke-width="0.8"/>
  <!-- left lens (round) -->
  <circle cx="42" cy="23" r="2.6" fill="#0a0806"/>
  <circle cx="42" cy="23" r="1.8" fill="#9cd6a6"/>
  <circle cx="42" cy="23" r="0.7" fill="#e8f8d8"/>
  <!-- right lens -->
  <circle cx="54" cy="23" r="2.6" fill="#0a0806"/>
  <circle cx="54" cy="23" r="1.8" fill="#9cd6a6"/>
  <circle cx="54" cy="23" r="0.7" fill="#e8f8d8"/>
  <!-- bridge between lenses -->
  <rect x="44" y="22" width="6" height="3" fill="url(#s-bone-dark)"/>
  <!-- temple filigree -->
  <path d="M36 18 Q34 22 36 26" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
  <path d="M60 18 Q62 22 60 26" fill="none" stroke="#5a4a30" stroke-width="0.5"/>
