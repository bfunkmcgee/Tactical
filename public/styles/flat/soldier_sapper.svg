  <path d="M32 118 L38 116 L36 120 Z" fill="url(#s-brass)"/>
  <path d="M64 118 L58 116 L60 120 Z" fill="url(#s-brass)"/>

  <!-- BELT with tool pouches + GRENADE LOOPS -->
  <path d="M22 74 L74 74 L74 82 L22 82 Z" fill="#1a1410"/>
  <rect x="44" y="73" width="10" height="10" fill="url(#s-bone-dark)"/>
  <path d="M46 75 L52 75 L52 81 L46 81 Z" fill="#1a1410"/>
  <circle cx="49" cy="78" r="1.2" fill="#9cd6a6"/>
