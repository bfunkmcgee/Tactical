           Q80 28 70 28 Q60 30 48 30 Q36 30 26 28 Q16 28 14 32 Z" fill="url(#s-fur)"/>
  <path d="M14 32 L16 36 L18 32 L20 36 L22 32 L24 36 L26 32 L28 36 L30 32 L32 36 L34 32
