  <path d="M36 84 L44 84 L44 92 L36 92 Z" fill="#1a1410"/>
  <path d="M52 84 L60 84 L60 92 L52 92 Z" fill="#1a1410"/>
  <circle cx="40" cy="88" r="0.8" fill="#c8a868"/>
  <circle cx="56" cy="88" r="0.8" fill="#c8a868"/>
