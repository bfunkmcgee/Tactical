  <path d="M28 48 L34 52" stroke="#5a4a30" stroke-width="0.4" opacity=".7"/>
  <path d="M60 48 L66 52" stroke="#5a4a30" stroke-width="0.4" opacity=".7"/>
  <path d="M34 58 L40 62" stroke="#4a3e28" stroke-width="0.4" opacity=".7"/>
  <path d="M56 58 L62 62" stroke="#4a3e28" stroke-width="0.4" opacity=".7"/>
