  <g>
    <path d="M34 80 L34 86" stroke="#3a3228" stroke-width="0.8"/>
    <circle cx="34" cy="88" r="3" fill="#1a1410"/>
    <circle cx="34" cy="88" r="2.2" fill="url(#s-ember)"/>
    <circle cx="34" cy="88" r="1" fill="#fff4c0"/>
  </g>
  <g>
    <path d="M42 80 L42 88" stroke="#3a3228" stroke-width="0.8"/>
    <circle cx="42" cy="90" r="3" fill="#1a1410"/>
    <circle cx="42" cy="90" r="2.2" fill="url(#s-ember)"/>
    <circle cx="42" cy="90" r="1" fill="#fff4c0"/>
  </g>
  <g>
    <path d="M56 80 L56 88" stroke="#3a3228" stroke-width="0.8"/>
    <circle cx="56" cy="90" r="3" fill="#1a1410"/>
    <circle cx="56" cy="90" r="2.2" fill="url(#s-ember)"/>
    <circle cx="56" cy="90" r="1" fill="#fff4c0"/>
  </g>
  <g>
    <path d="M62 80 L62 86" stroke="#3a3228" stroke-width="0.8"/>
    <circle cx="62" cy="88" r="3" fill="#1a1410"/>
    <circle cx="62" cy="88" r="2.2" fill="url(#s-ember)"/>
    <circle cx="62" cy="88" r="1" fill="#fff4c0"/>
  </g>

  <!-- TORSO: bone plate -->
  <path d="M22 38 Q22 34 26 34 L70 34 Q74 34 74 38 L74 74 Q74 78 70 78 L26 78 Q22 78 22 74 Z" fill="url(#s-under)"/>
  <!-- upper plate -->
  <path d="M26 40 L70 40 Q72 40 72 42 L72 56 L48 62 L24 56 L24 42 Q24 40 26 40 Z" fill="url(#s-bone)"/>
  <!-- lower plate -->
  <path d="M26 56 L70 56 L70 68 L48 74 L26 68 Z" fill="url(#s-bone)"/>
  <path d="M24 56 L72 56" stroke="#6a5a40" stroke-width="0.6"/>
  <!-- alchemical sigil in center chest (crown-style, smaller) -->
  <path d="M42 46 L46 42 L48 44 L50 42 L54 46 L52 52 L44 52 Z" fill="none" stroke="#5a4a30" stroke-width="0.6"/>
  <path d="M46 44 L46 50 M48 42 L48 50 M50 44 L50 50" stroke="#5a4a30" stroke-width="0.4"/>
  <circle cx="48" cy="48" r="1.3" fill="#9cd6a6"/>
  <circle cx="48" cy="48" r="0.6" fill="#e8f8d8"/>
  <!-- filigree on lower plate -->
  <path d="M32 60 Q48 64 64 60" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <path d="M34 66 Q48 70 62 66" fill="none" stroke="#5a4a30" stroke-width="0.4"/>
  <!-- rivets -->
  <circle cx="28" cy="44" r="0.8" fill="#6a5a40"/>
  <circle cx="68" cy="44" r="0.8" fill="#6a5a40"/>
  <circle cx="28" cy="54" r="0.8" fill="#6a5a40"/>
  <circle cx="68" cy="54" r="0.8" fill="#6a5a40"/>
  <circle cx="30" cy="66" r="0.8" fill="#6a5a40"/>
  <circle cx="66" cy="66" r="0.8" fill="#6a5a40"/>
