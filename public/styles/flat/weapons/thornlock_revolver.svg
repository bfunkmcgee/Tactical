<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="tr-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a2a1e"/><stop offset="1" stop-color="#1a100a"/>
    </linearGradient>
    <linearGradient id="tr-steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a5050"/><stop offset="1" stop-color="#2a2028"/>
    </linearGradient>
    <linearGradient id="tr-brass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c89858"/><stop offset="1" stop-color="#7a5828"/>
    </linearGradient>
  </defs>
  <!-- THORNLOCK REVOLVER (heavy brass-cylinder wheel-gun) -->
  <!-- grip (leather-wrapped, curved back) -->
  <path d="M42 70 Q40 80 46 84 L54 84 Q56 80 54 70 Z" fill="url(#tr-gun)"/>
  <!-- grip stitching hint -->
  <path d="M44 74 L53 74 M44 78 L53 78" stroke="#6a4828" stroke-width="0.3" opacity=".6"/>
  <!-- trigger guard -->
  <path d="M44 70 Q48 74 52 70" fill="none" stroke="#0a0a0c" stroke-width="1.3"/>
  <!-- frame / receiver -->
  <path d="M40 60 L70 60 L70 70 L40 70 Z" fill="url(#tr-steel)"/>
  <!-- cylinder (6-shot wheel, prominent) -->
  <ellipse cx="54" cy="65" rx="7" ry="5.5" fill="url(#tr-brass)" stroke="#3a2814" stroke-width="0.5"/>
  <!-- chamber dots -->
  <circle cx="54" cy="61" r="0.9" fill="#2a2018"/>
  <circle cx="58" cy="63" r="0.9" fill="#2a2018"/>
  <circle cx="58" cy="67" r="0.9" fill="#2a2018"/>
  <circle cx="54" cy="69" r="0.9" fill="#2a2018"/>
  <circle cx="50" cy="67" r="0.9" fill="#2a2018"/>
  <circle cx="50" cy="63" r="0.9" fill="#2a2018"/>
  <!-- cylinder center pin -->
  <circle cx="54" cy="65" r="1.2" fill="#3a2814"/>
  <!-- barrel (short, heavy) -->
  <rect x="62" y="62" width="16" height="6" fill="url(#tr-steel)"/>
  <path d="M64 63 L76 63" stroke="#7a7078" stroke-width="0.3"/>
  <!-- front sight blade -->
  <rect x="74" y="60" width="1.5" height="2" fill="#0a0a0c"/>
  <!-- muzzle thorn accent -->
  <path d="M78 63 L82 62 L82 68 L78 67 Z" fill="url(#tr-brass)"/>
  <circle cx="80" cy="65" r="1.5" fill="#1a0808"/>
  <!-- hammer spur at rear -->
  <path d="M38 60 L40 56 L42 58 L42 60 Z" fill="url(#tr-steel)"/>
</svg>
