<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="wn-gun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2030"/><stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
    <linearGradient id="wn-violet" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c79aff"/><stop offset="1" stop-color="#4a2a7a"/>
    </linearGradient>
    <radialGradient id="wn-rune" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe0ff"/>
      <stop offset=".5" stop-color="#c79aff"/>
      <stop offset="1" stop-color="#4a2a7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- WHISPERNEEDLE SMG (compact silenced, fae sigils) -->
  <!-- folding stock (short) -->
  <path d="M28 62 L38 62 L38 68 L28 68 Z" fill="url(#wn-gun)"/>
  <path d="M30 64 L36 64 M30 66 L36 66" stroke="#0a0810" stroke-width="0.4"/>
  <!-- receiver -->
  <path d="M38 60 L62 60 L62 70 L38 70 Z" fill="url(#wn-gun)"/>
  <!-- top rail -->
  <rect x="40" y="58" width="18" height="2" fill="#0a0810"/>
  <path d="M42 58 L42 60 M46 58 L46 60 M50 58 L50 60 M54 58 L54 60" stroke="#2a2030" stroke-width="0.3"/>
  <!-- small holosight -->
  <rect x="44" y="54" width="8" height="4" rx="0.5" fill="#0a0810"/>
  <circle cx="48" cy="56" r="1" fill="#c79aff"/>
  <!-- fae-sigil inlay on receiver side -->
  <path d="M52 63 L55 65 L52 67 L49 65 Z" fill="url(#wn-violet)" opacity=".75"/>
  <!-- magazine (curved, short) -->
  <path d="M44 70 Q44 78 46 80 L52 80 Q54 78 54 70 Z" fill="#0a0810"/>
  <path d="M45 73 L53 73 M45 76 L53 76" stroke="#2a2030" stroke-width="0.3"/>
  <!-- trigger guard -->
  <path d="M54 70 Q56 74 58 70" fill="none" stroke="#0a0810" stroke-width="1.2"/>
  <!-- barrel -->
  <rect x="62" y="63" width="6" height="4" fill="url(#wn-gun)"/>
  <!-- suppressor (wrapped in fae sigils) -->
  <rect x="68" y="61" width="18" height="8" rx="1" fill="#1a1020"/>
  <!-- sigil wraps — small runes along suppressor -->
  <circle cx="72" cy="65" r="1.2" fill="url(#wn-violet)" opacity=".7"/>
  <circle cx="77" cy="65" r="1.2" fill="url(#wn-violet)" opacity=".7"/>
  <circle cx="82" cy="65" r="1.2" fill="url(#wn-violet)" opacity=".7"/>
  <!-- thin violet glow traces -->
  <path d="M70 62 L84 62 M70 68 L84 68" stroke="#c79aff" stroke-width="0.3" opacity=".5"/>
  <!-- runic muzzle whisper -->
  <circle cx="86" cy="65" r="2.5" fill="url(#wn-rune)"/>
  <circle cx="86" cy="65" r="1" fill="#ffe0ff"/>
</svg>
