<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="t-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a6a50"/><stop offset="1" stop-color="#2a2418"/>
    </linearGradient>
    <linearGradient id="t-skin-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a4a38"/><stop offset="1" stop-color="#1a1408"/>
    </linearGradient>
    <linearGradient id="t-rust" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a5028"/><stop offset="1" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="t-rust-hl" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c87030"/><stop offset="1" stop-color="#4a2410"/>
    </linearGradient>
    <linearGradient id="t-metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a6a6e"/><stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="t-rag" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6a5838"/><stop offset="1" stop-color="#2a2010"/>
    </linearGradient>
    <radialGradient id="t-eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset=".5" stop-color="#c82810"/>
      <stop offset="1" stop-color="#3a0808" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ARMS: tree-trunk thick -->
  <!-- left arm (holding massive weapon forestock) -->
  <path d="M2 40 Q-2 48 2 60 L10 78 Q18 82 22 74 L24 46 Z" fill="url(#t-skin)"/>
  <!-- right arm (trigger side) -->
  <path d="M94 40 Q98 48 94 60 L86 78 Q78 82 74 74 L72 46 Z" fill="url(#t-skin)"/>
  <!-- bicep chain wraps -->
  <path d="M4 52 L22 54" stroke="#2a2010" stroke-width="1.5"/>
  <path d="M92 52 L74 54" stroke="#2a2010" stroke-width="1.5"/>
  <!-- scars -->
  <path d="M10 62 L20 66" stroke="#1a1408" stroke-width="0.6"/>
  <path d="M86 62 L76 66" stroke="#1a1408" stroke-width="0.6"/>
  <!-- vambrace scrap -->
  <path d="M4 64 L22 64 L22 76 L8 78 Z" fill="url(#t-rust)"/>
  <path d="M92 64 L74 64 L74 76 L88 78 Z" fill="url(#t-rust)"/>
  <circle cx="8" cy="66" r="0.8" fill="#c87030"/>
  <circle cx="18" cy="66" r="0.8" fill="#c87030"/>
  <circle cx="8" cy="74" r="0.8" fill="#c87030"/>
  <circle cx="18" cy="74" r="0.8" fill="#c87030"/>
  <circle cx="88" cy="66" r="0.8" fill="#c87030"/>
  <circle cx="78" cy="66" r="0.8" fill="#c87030"/>
  <circle cx="88" cy="74" r="0.8" fill="#c87030"/>
  <circle cx="78" cy="74" r="0.8" fill="#c87030"/>
  <!-- massive fists -->
  <path d="M0 76 Q-4 84 6 86 L22 82 Q24 78 22 76 Z" fill="url(#t-skin-dark)"/>
  <path d="M96 76 Q100 84 90 86 L74 82 Q72 78 74 76 Z" fill="url(#t-skin-dark)"/>
  <!-- welded-on knuckle spikes -->
  <path d="M2 84 L0 88 L4 86 Z" fill="#c87030"/>
  <path d="M8 86 L6 90 L10 88 Z" fill="#c87030"/>
  <path d="M94 84 L96 88 L92 86 Z" fill="#c87030"/>
  <path d="M88 86 L90 90 L86 88 Z" fill="#c87030"/>

  <!-- HEAD / HEAVY BUCKET HELM (full face, narrow eye slit) -->
  <path d="M30 6 Q34 -2 48 -4 Q62 -2 66 6 L66 22 L30 22 Z" fill="url(#t-metal)"/>
  <!-- helm rim -->
  <path d="M30 22 L66 22" stroke="#0a0a0c" stroke-width="1.2"/>
  <!-- rivets ringing the helm -->
  <circle cx="34" cy="20" r="0.9" fill="#c87030"/>
  <circle cx="42" cy="20" r="0.9" fill="#c87030"/>
  <circle cx="48" cy="20" r="0.9" fill="#c87030"/>
  <circle cx="54" cy="20" r="0.9" fill="#c87030"/>
  <circle cx="62" cy="20" r="0.9" fill="#c87030"/>
  <!-- center welded panel -->
  <path d="M38 2 L58 2 L58 18 L38 18 Z" fill="url(#t-rust)"/>
  <path d="M38 2 L58 2" stroke="#0a0a0c" stroke-width="0.6"/>
  <!-- NARROW EYE SLIT -->
  <path d="M38 10 L58 10 L58 14 L38 14 Z" fill="#000"/>
  <!-- glowing red eyes through slit -->
  <circle cx="42" cy="12" r="1.6" fill="url(#t-eye)"/>
  <circle cx="54" cy="12" r="1.6" fill="url(#t-eye)"/>
  <circle cx="42" cy="12" r="0.7" fill="#fff4c0"/>
  <circle cx="54" cy="12" r="0.7" fill="#fff4c0"/>
  <!-- ventilation grid below slit -->
  <path d="M40 16 L56 16" stroke="#0a0a0c" stroke-width="0.6"/>
  <circle cx="42" cy="17" r="0.5" fill="#0a0a0c"/>
  <circle cx="46" cy="17" r="0.5" fill="#0a0a0c"/>
  <circle cx="50" cy="17" r="0.5" fill="#0a0a0c"/>
  <circle cx="54" cy="17" r="0.5" fill="#0a0a0c"/>
  <!-- huge bull horns welded on top -->
  <path d="M32 6 Q22 2 16 -6 L22 -2 Q28 2 34 8 Z" fill="url(#t-rust)"/>
  <path d="M64 6 Q74 2 80 -6 L74 -2 Q68 2 62 8 Z" fill="url(#t-rust)"/>
  <!-- horn rings/chains at base -->
  <circle cx="30" cy="6" r="1.4" fill="none" stroke="#c87030" stroke-width="0.6"/>
  <circle cx="66" cy="6" r="1.4" fill="none" stroke="#c87030" stroke-width="0.6"/>
  <!-- dangling bells off horns (choir motif) -->
  <path d="M18 -2 L20 -8 L22 -2 Z" fill="url(#t-rust-hl)"/>
  <path d="M20 -2 L20 2" stroke="#2a1408" stroke-width="0.4"/>
  <path d="M78 -2 L76 -8 L74 -2 Z" fill="url(#t-rust-hl)"/>
  <path d="M76 -2 L76 2" stroke="#2a1408" stroke-width="0.4"/>
  <!-- helm weathering/rust streaks -->
  <path d="M34 8 L32 14" stroke="url(#t-rust-hl)" stroke-width="0.5" opacity=".8"/>
  <path d="M62 8 L64 14" stroke="url(#t-rust-hl)" stroke-width="0.5" opacity=".8"/>

</svg>