<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128">
  <defs>
    <linearGradient id="t-skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7d8e63"/><stop offset="1" stop-color="#3a4826"/>
    </linearGradient>
    <linearGradient id="t-skin-dark" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#566c3e"/><stop offset="1" stop-color="#2a3818"/>
    </linearGradient>
    <linearGradient id="t-metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7a7066"/><stop offset="1" stop-color="#2a241e"/>
    </linearGradient>
    <linearGradient id="t-leather" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5a3820"/><stop offset="1" stop-color="#2a1a0e"/>
    </linearGradient>
  </defs>
  <rect width="96" height="128" fill="#1b2331"/>
  <ellipse cx="48" cy="122" rx="30" ry="5" fill="#000" opacity=".55"/>

  <!-- HUNCHED STANCE: wide legs, bent knees -->
  <!-- thighs -->
  <path d="M22 94 Q18 112 26 118 L42 118 L40 94 Z" fill="url(#t-skin)"/>
  <path d="M74 94 Q78 112 70 118 L54 118 L56 94 Z" fill="url(#t-skin)"/>
  <!-- wraps/chains on shins -->
  <path d="M26 110 L42 110 M28 114 L40 114" stroke="#2a1a0e" stroke-width="1.4"/>
  <path d="M54 110 L70 110 M56 114 L68 114" stroke="#2a1a0e" stroke-width="1.4"/>
  <!-- bare clawed feet -->
  <path d="M24 118 Q22 124 32 124 L44 124 L44 118 Z" fill="url(#t-skin-dark)"/>
  <path d="M72 118 Q74 124 64 124 L52 124 L52 118 Z" fill="url(#t-skin-dark)"/>
  <!-- toe claws -->
  <path d="M24 124 L22 126 L26 126 Z" fill="#e8ddc6"/>
  <path d="M30 124 L28 127 L32 127 Z" fill="#e8ddc6"/>
  <path d="M36 124 L34 127 L38 127 Z" fill="#e8ddc6"/>
  <path d="M42 124 L40 126 L44 126 Z" fill="#e8ddc6"/>
  <path d="M54 124 L52 126 L56 126 Z" fill="#e8ddc6"/>
  <path d="M60 124 L58 127 L62 127 Z" fill="#e8ddc6"/>
  <path d="M66 124 L64 127 L68 127 Z" fill="#e8ddc6"/>
  <path d="M72 124 L70 126 L74 126 Z" fill="#e8ddc6"/>

  <!-- TORSO: broad, hunched, muscular -->
  <path d="M14 46 Q10 42 18 38 L78 38 Q86 42 82 46 L84 86 Q84 96 70 96 L26 96 Q12 96 12 86 Z" fill="url(#t-skin)"/>
  <!-- belly shadow -->
  <path d="M28 70 Q48 84 68 70 L68 90 Q48 98 28 90 Z" fill="url(#t-skin-dark)" opacity=".7"/>
  <!-- ribs suggestion -->
  <path d="M20 56 Q28 52 36 58" fill="none" stroke="#2a3818" stroke-width="0.7"/>
  <path d="M60 58 Q68 52 76 56" fill="none" stroke="#2a3818" stroke-width="0.7"/>
  <!-- scars -->
  <path d="M36 68 L44 72" stroke="#2a1a0e" stroke-width="0.8"/>
  <path d="M56 64 L64 68" stroke="#2a1a0e" stroke-width="0.8"/>

  <!-- PATCHWORK ARMOR: scavenged plates strapped on -->
  <path d="M20 44 L38 44 L40 60 L18 60 Z" fill="url(#t-metal)"/>
  <path d="M22 46 L36 46 L37 52 L23 52 Z" fill="#3a342a"/>
  <rect x="24" y="56" width="2" height="4" fill="#0d1119"/>
  <rect x="32" y="56" width="2" height="4" fill="#0d1119"/>
  <!-- right shoulder plate with spikes -->
  <path d="M66 38 Q84 38 86 48 L80 56 Q72 58 68 52 Z" fill="url(#t-metal)"/>
  <path d="M72 36 L74 30 L76 36 Z" fill="#2a241e"/>
  <path d="M78 36 L80 28 L82 36 Z" fill="#2a241e"/>
  <path d="M84 42 L88 38 L86 46 Z" fill="#2a241e"/>
  <!-- chain sash across chest -->
  <path d="M14 50 Q48 68 82 54" stroke="#3a342a" stroke-width="3" fill="none"/>
  <circle cx="20" cy="52" r="1.4" fill="#7a7066"/>
  <circle cx="30" cy="58" r="1.4" fill="#7a7066"/>
  <circle cx="48" cy="64" r="1.8" fill="#7a7066"/>
  <circle cx="66" cy="60" r="1.4" fill="#7a7066"/>
  <circle cx="76" cy="56" r="1.4" fill="#7a7066"/>
  <!-- loincloth -->
  <path d="M30 86 L66 86 L70 112 L26 112 Z" fill="url(#t-leather)"/>
  <path d="M34 90 L62 90 M32 98 L64 98" stroke="#2a1a0e" stroke-width="0.8"/>
  <!-- belt -->
  <rect x="22" y="82" width="52" height="6" fill="#2a1a0e"/>
  <rect x="44" y="80" width="8" height="10" fill="url(#t-metal)"/>

  <!-- HEAD: hunched low, big jaw -->
  <!-- neck (thick) -->
  <path d="M38 32 L58 32 L58 42 L38 42 Z" fill="url(#t-skin)"/>
  <!-- head base -->
  <ellipse cx="48" cy="24" rx="16" ry="14" fill="url(#t-skin)"/>
  <!-- brow ridge -->
  <path d="M32 22 Q48 12 64 22 L64 26 Q48 22 32 26 Z" fill="url(#t-skin-dark)"/>
  <!-- deep-set eyes -->
  <ellipse cx="42" cy="24" rx="2.5" ry="1.8" fill="#0d1119"/>
  <ellipse cx="54" cy="24" rx="2.5" ry="1.8" fill="#0d1119"/>
  <circle cx="42" cy="24" r="1" fill="#ff5a6a"/>
  <circle cx="54" cy="24" r="1" fill="#ff5a6a"/>
  <!-- snarling snout -->
  <path d="M42 28 Q48 32 54 28 L54 34 Q48 38 42 34 Z" fill="url(#t-skin-dark)"/>
  <!-- nostrils -->
  <circle cx="45" cy="31" r="0.8" fill="#0d1119"/>
  <circle cx="51" cy="31" r="0.8" fill="#0d1119"/>
  <!-- lower jaw / underbite with tusks -->
  <path d="M38 34 Q48 42 58 34 L58 38 Q48 44 38 38 Z" fill="url(#t-skin)"/>
  <!-- tusks -->
  <path d="M40 34 L39 30 L42 34 Z" fill="#e8ddc6"/>
  <path d="M56 34 L57 30 L54 34 Z" fill="#e8ddc6"/>
  <path d="M42 38 L40 42 L44 40 Z" fill="#e8ddc6"/>
  <path d="M54 38 L56 42 L52 40 Z" fill="#e8ddc6"/>
  <!-- ears (pointed / torn) -->
  <path d="M32 20 L28 16 L32 10 L34 18 Z" fill="url(#t-skin)"/>
  <path d="M64 20 L68 16 L64 10 L62 18 Z" fill="url(#t-skin)"/>
  <path d="M30 14 L28 16 L32 14 Z" fill="#2a3818"/>
  <path d="M66 14 L68 16 L64 14 Z" fill="#2a3818"/>
  <!-- scars on face -->
  <path d="M38 16 L46 22" stroke="#2a1a0e" stroke-width="0.8"/>

  <!-- LEFT ARM (holding cleaver) -->
  <path d="M14 48 Q8 56 10 72 Q12 84 22 88 L30 82 L28 52 Z" fill="url(#t-skin)"/>
  <!-- bicep wraps -->
  <path d="M14 58 L24 58 M12 64 L26 62" stroke="#2a1a0e" stroke-width="1.4"/>
  <!-- fist -->
  <path d="M18 86 Q16 94 24 94 L30 90 Q32 86 30 82 Z" fill="url(#t-skin-dark)"/>
  <!-- knuckle claws -->
  <path d="M22 94 L21 98 L24 98 Z" fill="#e8ddc6"/>
  <path d="M26 94 L25 98 L28 98 Z" fill="#e8ddc6"/>

  <!-- RIGHT ARM (raised with maul) -->
  <path d="M76 46 Q88 48 92 58 Q94 68 84 74 L74 70 L72 48 Z" fill="url(#t-skin)"/>
  <path d="M78 54 L90 56 M78 60 L92 62" stroke="#2a1a0e" stroke-width="1.4"/>
  <!-- gripping hand -->
  <path d="M80 70 Q78 78 88 78 L92 74 Q94 70 92 66 Z" fill="url(#t-skin-dark)"/>

  <!-- SCAVENGED CLEAVER in left hand -->
  <rect x="16" y="90" width="4" height="24" fill="#3a2a1a"/>
  <path d="M6 82 L28 82 L30 102 L4 100 Z" fill="url(#t-metal)"/>
  <path d="M6 82 L28 82 L30 84 L6 84 Z" fill="#9a9088"/>
  <!-- jagged edge -->
  <path d="M4 100 L8 98 L10 101 L14 99 L16 102 L20 100 L22 102 L26 100 L28 102 L30 100 L30 104 L4 104 Z" fill="#2a241e"/>
  <!-- bloodstains -->
  <path d="M14 88 L18 94 L12 94 Z" fill="#8a1a1a" opacity=".7"/>
  <path d="M22 90 L26 96 L20 96 Z" fill="#8a1a1a" opacity=".7"/>
  <!-- bone charms on haft -->
  <circle cx="18" cy="110" r="1.5" fill="#e8ddc6"/>

  <!-- SPIKED MAUL in right hand (raised high) -->
  <rect x="84" y="20" width="4" height="60" fill="#3a2a1a"/>
  <path d="M76 8 L96 8 L96 28 L76 28 Z" fill="url(#t-metal)"/>
  <!-- spikes -->
  <path d="M80 8 L80 2 L82 8 Z" fill="#2a241e"/>
  <path d="M86 8 L86 0 L88 8 Z" fill="#2a241e"/>
  <path d="M92 8 L92 2 L94 8 Z" fill="#2a241e"/>
  <path d="M80 28 L80 34 L82 28 Z" fill="#2a241e"/>
  <path d="M86 28 L86 36 L88 28 Z" fill="#2a241e"/>
  <path d="M92 28 L92 34 L94 28 Z" fill="#2a241e"/>
  <path d="M76 14 L72 16 L76 18 Z" fill="#2a241e"/>
  <path d="M76 22 L72 20 L76 24 Z" fill="#2a241e"/>
  <!-- rust streaks -->
  <path d="M78 12 L94 14 M78 22 L94 20" stroke="#8a4a1a" stroke-width="0.6" opacity=".7"/>
  <!-- bindings on haft -->
  <path d="M84 34 L88 34 M84 44 L88 44 M84 54 L88 54 M84 64 L88 64" stroke="#2a1a0e" stroke-width="1.2"/>
</svg>
