  <path d="M14 52 L82 52" stroke="#0a0a0c" stroke-width="1.2"/>
  <!-- smaller plates welded over gaps -->
  <path d="M18 64 L40 64 L40 78 L18 78 Z" fill="url(#t-metal)"/>
  <path d="M56 64 L78 64 L78 78 L56 78 Z" fill="url(#t-rust)"/>
  <!-- rivets (many, across all plates) -->
  <circle cx="17" cy="37" r="1" fill="#c87030"/>
  <circle cx="30" cy="37" r="1" fill="#c87030"/>
  <circle cx="45" cy="37" r="1" fill="#c87030"/>
  <circle cx="17" cy="60" r="1" fill="#c87030"/>
  <circle cx="30" cy="60" r="1" fill="#c87030"/>
  <circle cx="45" cy="60" r="1" fill="#c87030"/>
  <circle cx="52" cy="37" r="1" fill="#4a4a4e"/>
  <circle cx="66" cy="37" r="1" fill="#4a4a4e"/>
  <circle cx="79" cy="37" r="1" fill="#4a4a4e"/>
  <circle cx="52" cy="60" r="1" fill="#4a4a4e"/>
  <circle cx="66" cy="60" r="1" fill="#4a4a4e"/>
  <circle cx="79" cy="60" r="1" fill="#4a4a4e"/>
  <circle cx="21" cy="68" r="0.9" fill="#4a4a4e"/>
  <circle cx="37" cy="68" r="0.9" fill="#4a4a4e"/>
  <circle cx="21" cy="76" r="0.9" fill="#4a4a4e"/>
  <circle cx="37" cy="76" r="0.9" fill="#4a4a4e"/>
  <circle cx="59" cy="68" r="0.9" fill="#c87030"/>
  <circle cx="75" cy="68" r="0.9" fill="#c87030"/>
  <circle cx="59" cy="76" r="0.9" fill="#c87030"/>
  <circle cx="75" cy="76" r="0.9" fill="#c87030"/>

  <!-- big jagged CHOIR HYMN painted across both plates -->
  <path d="M16 44 L22 40 L28 46 L34 40 L40 46 L46 42" fill="none" stroke="#c87030" stroke-width="1.2"/>
  <path d="M52 44 L58 48 L64 42 L70 48 L76 42 L80 46" fill="none" stroke="#c87030" stroke-width="1"/>
  <!-- rust streaks -->
  <path d="M22 54 L20 62" stroke="#2a1408" stroke-width="0.4"/>
  <path d="M38 54 L40 62" stroke="#2a1408" stroke-width="0.4"/>
  <path d="M56 54 L58 62" stroke="url(#t-rust-hl)" stroke-width="0.4" opacity=".7"/>
  <path d="M72 54 L74 62" stroke="url(#t-rust-hl)" stroke-width="0.4" opacity=".7"/>

  <!-- BROKEN MEGAPHONE strapped to chest (Rust Choir signature) -->
  <path d="M30 56 L28 60 L28 68 L30 72 L40 70 L40 58 Z" fill="url(#t-rust-hl)"/>
  <!-- megaphone opening (conical) -->
  <path d="M40 58 L48 56 L48 72 L40 70 Z" fill="url(#t-rust)"/>
  <ellipse cx="48" cy="64" rx="1.5" ry="8" fill="#2a1408"/>
